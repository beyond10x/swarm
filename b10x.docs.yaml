# Atlas owns delivery and routing; swarm owns these source and presentation fields.
# The repository is private and its documentation is not published: the surface is declared as
# planned and internal so the catalog knows it exists, and nothing here is collected by the Website.
delivery:
  origin: https://beyond10x.github.io
  publisher: website
  repository: beyond10x.github.io
repository:
  displayName: swarm
  id: swarm
  url: https://github.com/beyond10x/swarm
schema: b10x-docs/v4
surfaces:
  - accent: '#f2a65a'
    canonicalUrl: https://beyond10x.github.io/docs/swarm/
    capabilities:
      - agent-swarm
      - executable-specification
      - swarm-runtime
    documentDefaults:
      access: private
      audiences:
        - developer
        - adopter
      experienceIds:
        - build-agent-systems
      support: planned
    experienceIds:
      - build-agent-systems
    id: docs
    journeys:
      - understand
      - specify
      - build-agents
    kind: documentation
    maturity: experimental
    name: swarm
    primaryJourney: build-agents
    publication:
      availability: planned
      discoverability: internal
    relationships:
      - kind: uses
        label: Declares the swarm kernel as an Executable System Specification
        target: ess/docs
      - kind: uses
        label: Appends and folds the swarm's event log
        target: eventlog/docs
    routeBase: /docs/swarm/
    sections:
      - kind: docs
        label: The specified kernel
        url: https://github.com/beyond10x/swarm/blob/main/src/core/README.md
      - kind: reference
        label: Instance data layout
        url: https://github.com/beyond10x/swarm/blob/main/data/README.md
      - kind: source
        label: Source
        url: https://github.com/beyond10x/swarm
    source:
      documents:
        # Deliberately an allowlist. The repository also holds planning artifacts, wave evidence,
        # instance data and a separate Docusaurus site; none of those is a unified-site page.
        include:
          - docs/index.md
          - src/core/README.md
          - src/core/docs/ess-authoring-rules.md
          - data/README.md
        exclude:
          - .engineering/**
          - data/swarms/**
          - examples/**
          - src/core/generated/**
          - website/**
      navigation:
        group: Products
        label: swarm
        order: 95
        sidebar: autogenerated
      root: .
    summary: A working agent swarm whose behaviour is specified in ESS and served by a small Rust runtime with a Vue canvas UI.
