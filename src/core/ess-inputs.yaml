# Exact input list (ess-inputs/1). Needed because the legacy layout reads EVERY *.yaml under
# this directory, and config/, flows/ and generated/ hold instance documents and projections that
# are not specification sources (observed 2026-09-11: `config/codex-takeover.yaml: unknown field
# config_id`). Regenerated by the integrator whenever a domain file is added.
format: ess-inputs/1
specification:
  - system.yaml
  - domains/agent.yaml
  - domains/blackbox.yaml
  - domains/board.yaml
  - domains/config.yaml
  - domains/decision.yaml
  - domains/fault.yaml
  - domains/flow.yaml
  - domains/manager.yaml
  - domains/orchestrator.yaml
  - domains/schedule.yaml
  - domains/work.yaml
  - components.yaml
  - topology.yaml
scenarios: []
