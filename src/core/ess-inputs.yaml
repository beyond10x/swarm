# Exact input list (ess-inputs/1). Needed because the legacy layout reads EVERY *.yaml under this
# directory, and instance documents are not specification sources (observed 2026-09-11:
# `config/codex-takeover.yaml: unknown field config_id`). Instance data lives in ../../data/.
# Regenerated whenever a domain file is added or removed.
format: ess-inputs/1
specification:
  - system.yaml
  - domains/agent.yaml
  - domains/blackbox.yaml
  - domains/config.yaml
  - domains/goal.yaml
  - domains/mailbox.yaml
  - domains/manager.yaml
  - components.yaml
  - topology.yaml
scenarios: []
