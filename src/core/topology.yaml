# Semantic runtime requirements, per swarm (ess/examples/billing/topology.yaml: "a statement about
# the design, not a Kubernetes manifest"). Three workloads, one per component.
#
#   - swarm-manager `min 1, max 1`: one manager holds many swarms; nothing here says it is
#     replicated, so the honest floor and ceiling are both one.
#   - agent-runtime `min 1`, no ceiling: a swarm is born with one agent, the coordinator, so one is
#     the floor. There is no ceiling because how many agents a swarm arrives at is the swarm's
#     business, not this file's. Exactly one of them holds the Coordinator role — that is a replica
#     ceiling the role enforces by being a single reserved variant, not a number here.
#   - blackbox-bus `min 1, max 1`: one canvas record per swarm, and a second writer on an
#     append-only record is a fault rather than a capacity.
#
# `stateless: false` everywhere: every one of these holds state that outlives a request. The store
# each requires is one per swarm, at `data/swarms/<slug>/`.
topology:
  workloads:
    swarm-manager:
      replicas: {min: 1, max: 1}
      stateless: false
      requires:
        - store: swarms-record
    agent-runtime:
      replicas: {min: 1}
      stateless: false
      requires:
        - store: agent-record
    blackbox-bus:
      replicas: {min: 1, max: 1}
      stateless: false
      requires:
        - store: canvas-record
