# One swarm.config.Config record: the runtime configuration the 2026-09-11 swarm (`b10x-forward`)
# runs with, every value read from the file named beside it. Validated against the JSON Schema
# `ess generate --kind schema` projects from domains/config.yaml (see generated/schema/).
# The swarm_id is the seed swarm's id, shared with website/public/data/seed.json.
config_id: 8d2dc1ef-ce38-4048-991e-2688ee989ffe
swarm_id: a0eae637-d85f-43b8-8072-389a06954fa6
version: 1
state: Active
note: read from ./swarm on 2026-09-11; the first config a swarm ever had written down
drafted_at: "2026-09-11T18:30:00+02:00"
activated_at: "2026-09-11T18:30:00+02:00"

paths:
  runs_dir: swarm/runs                                              # swarm/README.md "runs/"
  board_store: swarm/runs/<run>/board/messages.jsonl                # swarm/domains/board.yaml comments
  events_store: swarm/runs/<run>/events/events-YYYYMMDD.jsonl      # swarm/docs/eventlog.md
  agent_state_projection: swarm/runs/<run>/agent-state.json        # swarm/docs/eventlog.md
  planning_store: .engineering/planning                            # swarm/WORKING-RULES.md §2
  wake_dir: swarm/wake.d                                           # swarm/docs/wake-gate.md
  roles_dir: .agents                                               # .agents/README.md
  rules_file: swarm/WORKING-RULES.md                               # swarm/WORKING-RULES.md
  memory_file: swarm/runs/<run>/coordinator.memory.md              # swarm/coordinator/CHARTER.md §4
  decisions_file: swarm/runs/<run>/decisions.md                    # swarm/coordinator/CHARTER.md §1
  scratch_dir: ~/.cache/b10x-forward                                # per swarm, never /tmp (swarm/AGENTS.md §6 has the live run's)

launch:                                                            # swarm/AGENTS.md §6
  harness: Claude
  binary: claude
  model: opus
  args: ["--dangerously-skip-permissions", "--model", "opus"]
  skip_permissions: true

schedules:
  check_in_cron: "*/1 * * * *"                                     # swarm/coordinator/SEED.md §1
  memory_tick_cron: "*/15 * * * *"                                 # swarm/coordinator/SEED.md §1
  cron_ttl_days: 7                                                 # swarm/coordinator/SEED.md §1
  wake_poll_seconds: 60                                            # swarm/docs/wake-gate.md
  wake_min_interval_seconds: 300                                   # swarm/wake.d/*.conf WAKE_MIN_INTERVAL
  wake_max_idle_seconds: 0                                         # swarm/wake.d/*.conf WAKE_MAX_IDLE

budgets:
  memory_file_bytes: 8192                                          # swarm/coordinator/CHARTER.md §4
  max_defers: 3                                                    # swarm/coordinator/CHARTER.md §5.7
  assignment_stale_seconds: 7200                                   # swarm/bin/assign.sh header
  event_stale_seconds: 900                                         # swarm/bin/assign.sh header (swarm-state.sh rule)
  event_msg_max_chars: 500                                         # swarm/docs/eventlog.md
  disk_floor_gb: 40                                                # swarm/AGENTS.md §6
  disk_target_gb: 80                                               # swarm/AGENTS.md §6
  subagent_tool_calls_per_round: 30                                # .agents/swarm-improver.md

board:
  orchestrator_slug: orchestrator                                  # swarm/WORKING-RULES.md §4
  default_inbox: main                                              # swarm/WORKING-RULES.md §4
  broadcast_prefer: [main, orchestrator, inbox, rounds]            # .skills/swarm-inbox/SKILL.md
