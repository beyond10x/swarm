# One swarm2.flow.Flow record: the coordinator's 15-minute generational cycle,
# swarm/coordinator/CHARTER.md §5, steps 1–7 in its order. Runs inside
# swarm2.orchestrator.Generation / Ticking, started by the binding on MemoryTicked. The gate step
# (coord-budget.sh) has max_attempts 1 and no edge out on a red exit: a red gate fails the run and
# nothing restarts (§5.4 "Never restart on a red gate").
flow_id: orchestrator.memory-tick
swarm_id: a0eae637-d85f-43b8-8072-389a06954fa6
name: Memory tick
summary: Defer if a question is in flight; refresh the derived section; rewrite the memory file in place; gate it; check for a second coordinator; restart the generation.
version: 1
owner_agent: orchestrator
state: Published
published_at: "2026-09-11T18:40:00+02:00"
binds: {entity: swarm2.orchestrator.Generation, state: Ticking}
inputs:
  - {name: generation_id, schema_id: swarm2.orchestrator.Generation/1, required: true}
outputs:
  - {name: restarted, schema_id: swarm2.orchestrator.GenerationRestarting/1, required: false}
context:
  skills: []
  tools: [Bash]
  files: [swarm/coordinator/CHARTER.md]
  write_scope: ["swarm/runs/<run>/coordinator.memory.md"]
  cwd: /home/timo/beyond10x/harness-builder
steps:
  - step_id: defer-check
    name: Defer check
    kind: Command
    run: [swarm/bin/coord-budget.sh, --in-flight]
    inputs: []
    outputs: [{name: in_flight, schema_id: boolean/1, required: true}]
    context: {skills: [], tools: [], files: [], write_scope: []}
    max_attempts: 1
  - step_id: refresh-derived
    name: Refresh the derived section
    kind: Command
    run: [swarm/bin/coord-windows.sh, --write]
    inputs: []
    outputs: []
    context: {skills: [], tools: [], files: [], write_scope: ["swarm/runs/<run>/coordinator.memory.md"]}
    max_attempts: 2
  - step_id: rewrite-sections
    name: Rewrite sections 0, 1, 2, 4, 5 in place
    kind: Llm
    run: []
    prompt: >-
      Rewrite sections 0, 1, 2, 4 and 5 of the memory file in place. Drop per each section's
      eviction rule first, then write. Never append. Nothing a command re-derives goes in.
    inputs: []
    outputs: []
    context: {skills: [], tools: [Edit], files: ["swarm/runs/<run>/coordinator.memory.md"], write_scope: ["swarm/runs/<run>/coordinator.memory.md"]}
    max_attempts: 1
  - step_id: gate
    name: Budget gate
    kind: Command
    run: [swarm/bin/coord-budget.sh]
    inputs: []
    outputs: [{name: exit, schema_id: exit-code/1, required: true}]
    evidence: {kind: gate, verifier: coord-budget}
    context: {skills: [], tools: [], files: [], write_scope: []}
    max_attempts: 1
  - step_id: single-coordinator-check
    name: Single-coordinator check
    kind: Tool
    tool: coordinator-seed
    run: []
    inputs: []
    outputs: [{name: two_coordinators, schema_id: boolean/1, required: true}]
    context: {skills: [], tools: [], files: [], write_scope: []}
    max_attempts: 1
  - step_id: restart
    name: Restart
    kind: Command
    run: [swarm/bin/coord-restart.sh]
    inputs: []
    outputs: [{name: restarted, schema_id: swarm2.orchestrator.GenerationRestarting/1, required: true}]
    context: {skills: [], tools: [], files: [], write_scope: []}
    max_attempts: 1
  - step_id: defer
    name: Defer
    kind: Llm
    run: []
    prompt: >-
      Record the defer in section 0 as defers: N. Hard cap 3 consecutive defers; on the 4th tick the
      in-flight question is written into decisions.md as a numbered binary row and the restart proceeds.
    inputs: [{name: in_flight, schema_id: boolean/1, required: true}]
    outputs: []
    context: {skills: [], tools: [Edit], files: [], write_scope: ["swarm/runs/<run>/coordinator.memory.md", "swarm/runs/<run>/decisions.md"]}
    max_attempts: 1
edges:
  - {from_step: defer-check, to_step: defer, when: "in_flight == true", wires: [{from_step: defer-check, from_output: in_flight, to_input: in_flight}]}
  - {from_step: defer-check, to_step: refresh-derived, when: "in_flight == false", wires: []}
  - {from_step: refresh-derived, to_step: rewrite-sections, wires: []}
  - {from_step: rewrite-sections, to_step: gate, wires: []}
  - {from_step: gate, to_step: single-coordinator-check, when: "exit == 0", wires: []}
  - {from_step: single-coordinator-check, to_step: restart, when: "two_coordinators == false", wires: []}
