# swarm2.work — a work item's workflow, and the wave it is dispatched in.
#
# One WorkItem is one story (WORKING-RULES §2: "one reviewable change, one acceptance statement")
# driven through ../aep/workflows/development/default.yaml version 2. The lifecycle below is that
# workflow with its state names PascalCased and nothing else changed: same ten states, same
# thirteen edges, same document order where the order matters. The aep workflow says what evidence
# opens each edge and deliberately not how it is obtained (../aep/drivers/development/default.yaml
# header: "that is a harness's business"); here every aep guard becomes a typed INPUT to the command
# that records the state exit, because an ess/1 `when` reads input only (ESS-COMMAND-003) — the
# fact is observed by whoever runs the command step, and this domain records what they observed.
#
# A Wave is what `aep-drive:wave` runs: "pick the next set of stories that can be implemented at
# once, propose it for approval, then dispatch one implementor per story into its own worktree, send
# each result to the adversary, and merge what goes green into one integration branch. ... it never
# starts a wave nobody approved." WORKING-RULES §11: work comes from the ledger; `aep plan artifact
# waves` says what can run at once; the store has one writer and it is the coordinator; evidence is
# recorded before the move that needs it.
domain: swarm2.work

summary: >-
  A work item is one story driven through the aep development workflow — receive, specify,
  decompose, establish verifiers, implement, verify, adversarial verify, review — to Complete or
  Declined, with the three routes back to Implement the workflow's version 2 added. A wave is the
  set of stories dispatched at once, proposed, approved by Timo, dispatched one implementor per
  story, and merged green into one integration branch.

naming:
  wire: work
  display: Work items and waves

types:
  # The phases the aep states declare (default.yaml `phases:` on each state), verbatim in
  # PascalCase. Finer than the state in one place: `decompose` declares `[decomposition, planning]`.
  - name: swarm2.work.Phase
    kind: enum
    variants: [Intake, Specification, Decomposition, Planning, VerificationSetup, Implementation, Verification, AdversarialVerification, Review, Completion]
    naming:
      display: Workflow phase

  # What the specification concluded. default.yaml `specify -> declined`: "there is nothing to
  # build — the behaviour already exists, or the request should not be satisfied"; otherwise
  # there is something to build.
  - name: swarm2.work.SpecDisposition
    kind: enum
    variants: [Build, Decline]
    naming:
      display: Specification disposition

  # aep `ReviewDisposition`: "three verdicts ... `approved`, `changes_requested`, `rejected`
  # (`aep_domain::review`)" (default.yaml, comment above `review -> implement`).
  - name: swarm2.work.ReviewDisposition
    kind: enum
    variants: [Approved, ChangesRequested, Rejected]
    naming:
      display: Review disposition

  # The three numbers the `verify` and `adversarial_verify` guards read: `tests.unit.failed`,
  # `tests.contract.failed`, `static_analysis.errors` (default.yaml). Produced by the driver's
  # command steps, not by the model: "`tests.execute` is exercised by the driver, and the record it
  # produces carries `producer: verifier / test-runner`" (drivers/development/default.yaml header).
  - name: swarm2.work.Counts
    kind: struct
    fields:
      - name: unit_failed
        type: Integer
      - name: contract_failed
        type: Integer
      - name: static_errors
        type: Integer
    invariants:
      - unit_failed >= 0
      - contract_failed >= 0
      - static_errors >= 0

entities:
  - name: swarm2.work.WorkItem
    identity:
      name: work_id
      type: Uuid
    fields:
      # The swarm this item runs in (swarm2.manager.Swarm).
      - name: swarm_id
        type: Uuid
      # The wave that dispatched it, if any. Optional because a single story can be driven alone
      # (`aep-drive:drive`: "one governed `metaharness aep drive` run over a single story"). This is
      # why `Wave` declares no `owns` relation over it — see the marker on `Wave`.
      - name: wave_id
        type: Optional<Uuid>
      # The aep artifact id, e.g. `story:agent-messaging-board` (WORKING-RULES §11: "emit
      # `assignment_taken` with the artifact id as `--ref`").
      - name: artifact_ref
        type: String
      # The implementor's slug, assigned by the implementation of `Open` from the dispatch
      # (WORKING-RULES §11: "one agent per artifact"). Not an input of `Open` and not `sets:`-able
      # from one; Optional because an item can exist before anybody is on it.
      - name: owner_agent
        type: Optional<String>
      # The repository whose `.engineering/planning` owns the outcome (WORKING-RULES §2).
      - name: repo
        type: String
      # The managed worktree the implementor works in (`aep-drive:wave`: "one implementor per story
      # into its own worktree"; WORKING-RULES §1). Assigned by the implementation at dispatch.
      - name: worktree
        type: Optional<String>
      # The wave's integration branch, copied down at dispatch ("merge what goes green into one
      # integration branch"). Optional for the same reason `wave_id` is.
      - name: integration_branch
        type: Optional<String>
      # The aep phase in progress. Derived by the implementation from the state's `phases:` list
      # in default.yaml; no command takes it as input, so no `sets:` line names it.
      - name: phase
        type: swarm2.work.Phase
      # The last counts a verifier or adversary recorded. Optional: none before the first
      # `RecordVerification`.
      - name: last_counts
        type: Optional<swarm2.work.Counts>
      # `evidence.missing` as the adversary last recorded it (default.yaml `adversarial_verify ->
      # review`: "No required evidence outstanding").
      - name: evidence_missing
        type: Integer
      # How many times the item has re-entered Implement. Incremented by the implementation on
      # each of the three back-edges; the aep engine's "own visit and attempt budgets bound the
      # loop" (drivers/development/default.yaml). No input carries it.
      - name: attempts
        type: Integer
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
    invariants:
      - attempts >= 0
      - evidence_missing >= 0
    lifecycle:
      # default.yaml `states:`, PascalCased. `receive` is `initial: receive` there; `complete` and
      # `declined` are `terminal: true` there. `declined` is "a terminal state rather than an
      # abandoned run, because *we decided not to* is a result somebody has to be able to read
      # later, and a run that simply stopped says only that it stopped."
      initial: Receive
      states: [Receive, Specify, Decompose, EstablishVerifiers, Implement, Verify, AdversarialVerify, Review, Complete, Declined]
      terminal: [Complete, Declined]
      # One transition per default.yaml edge, in default.yaml's document order, each named after
      # the edge. Ordering matters there ("transitions are tried in document order") and is kept
      # here in the ORDER OF THE OUTCOMES of the command that takes the edges out of one state.
      transitions:
        # aep: "Intake is done when there is something to specify; nothing else gates it."
        - name: intake_done
          from: [Receive]
          to: Specify
        # aep: "The specification concluded there is nothing to build — the behaviour already
        # exists, or the request should not be satisfied. Nothing in this repository mints
        # `specification.declines_the_request`, exactly as nothing mints `review.approved`: both
        # are somebody's judgement, recorded, and the run stops and waits for it rather than a
        # harness deciding it was not worth doing."
        - name: decline_at_spec
          from: [Specify]
          to: Declined
        # aep: "Work is only broken up once there is a specification to break up."
        - name: specified
          from: [Specify]
          to: Decompose
        # aep: "With units identified, each one's acceptance check can be written."
        - name: decomposed
          from: [Decompose]
          to: EstablishVerifiers
        # aep: "A test must exist before implementation begins. This is the mechanical form of
        # test-driven work: the guard, not the agent's good intentions, is what enforces the order."
        - name: verifiers_established
          from: [EstablishVerifiers]
          to: Implement
        # aep: "There is nothing to verify until the working tree has actually changed."
        - name: changed
          from: [Implement]
          to: Verify
        # aep: "Unit and contract suites green and static analysis clean. Contracts are in the guard
        # because a change that passes its own tests can still break a consumer."
        - name: verified
          from: [Verify]
          to: AdversarialVerify
        # aep: "Verification failed, so the work goes back to implementation. Any failing check
        # sends it back, not just the unit suite — a static-analysis error is a defect that has not
        # been symptomatic yet."
        - name: verify_failed
          from: [Verify]
          to: Implement
        # aep: "The adversary broke it. Same shape as `verify -> implement` and for the same
        # reason: a defect found here is a defect, and the alternative to a route back is deleting
        # the case that found it."
        - name: adversary_broke_it
          from: [AdversarialVerify]
          to: Implement
        # aep: "No required evidence outstanding. A reviewer reading a change with gaps in its
        # evidence is being asked to guess, and will guess in favour of the author."
        - name: adversary_passed
          from: [AdversarialVerify]
          to: Review
        # aep: "Review concluded in approval."
        - name: approved
          from: [Review]
          to: Complete
        # aep: "Review asked for changes. The work goes back to implementation with the review's
        # own record as the reason, rather than the run stopping and the reason living in
        # somebody's message."
        - name: changes_requested
          from: [Review]
          to: Implement
        # aep: "Review rejected the change outright. Not the same as asking for changes and
        # deliberately not routed to `implement`: *make this different* and *do not make this* are
        # different verdicts, and collapsing them would let a rejection be answered with a
        # revision."
        - name: rejected
          from: [Review]
          to: Declined

  # `aep-drive:wave`: "propose it for approval, then dispatch one implementor per story into its
  # own worktree, send each result to the adversary, and merge what goes green into one
  # integration branch. ... Proposes first and stops; it never starts a wave nobody approved."
  - name: swarm2.work.Wave
    identity:
      name: wave_id
      type: Uuid
    fields:
      - name: swarm_id
        type: Uuid
      # The aep story ids in the set (`aep plan artifact waves`, WORKING-RULES §11).
      - name: story_refs
        type: List<String>
      # "one integration branch" (`aep-drive:wave`).
      - name: integration_branch
        type: String
      # The slug of whoever proposed it — the improver reads the ledger (WORKING-RULES §11).
      - name: proposed_by
        type: String
      - name: proposed_at
        type: Timestamp
      - name: approved_at
        type: Optional<Timestamp>
      - name: merged_at
        type: Optional<Timestamp>
    # The items dispatched under this wave would be `items: owns swarm2.work.WorkItem via wave_id`,
    # refused (ESS-ENTITY-002, probed 2026-09-11): "relation `items` of `swarm2.work.Wave` is
    # carried by `swarm2.work.WorkItem.wave_id`, which is typed `Optional<Uuid>` ... must be typed
    # `Uuid`".
    # UNMAPPED: via must be required; a work item outside a wave exists (a single driven story), so the relation cannot be declared
    lifecycle:
      # Proposed: the set is on the table and nothing runs. Approved: Timo said yes. Dispatched: one
      # `Open` per story has happened. Merged: what went green is on the integration branch.
      # Abandoned: terminal, from any non-terminal state — a proposal nobody approved, an approval
      # nobody dispatched, or a dispatch nothing came back green from.
      initial: Proposed
      states: [Proposed, Approved, Dispatched, Merged, Abandoned]
      terminal: [Merged, Abandoned]
      transitions:
        - name: approve
          from: [Proposed]
          to: Approved
        - name: dispatch
          from: [Approved]
          to: Dispatched
        - name: merge
          from: [Dispatched]
          to: Merged
        - name: abandon
          from: [Proposed, Approved, Dispatched]
          to: Abandoned

errors:
  - name: swarm2.work.WorkStateConflict
    summary: The work item is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.work.WorkItem.State
  - name: swarm2.work.WaveStateConflict
    summary: The wave is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.work.Wave.State
  # An aep guard that reads false holds the run in place; in ess/1 a command that moves nothing is
  # a refusal, and this is the refusal. `guard` names the aep guard that did not hold (`test.exists`,
  # `diff.exists`).
  - name: swarm2.work.GuardNotMet
    summary: The recorded fact does not satisfy the guard on the only edge out of this state, so the item stays where it is.
    fields:
      - name: guard
        type: String
  # `adversarial_verify -> review` needs `evidence.missing == 0`; with nothing broken and evidence
  # still outstanding neither aep edge is permitted and the run waits. `missing` is the count.
  - name: swarm2.work.EvidenceOutstanding
    summary: The adversary broke nothing, but required evidence is still outstanding, so the item is not sent to review.
    fields:
      - name: missing
        type: Integer

commands:
  # One command per aep STATE EXIT. Each takes as typed input the facts the aep guards on that
  # state's edges read; the outcomes are those edges in default.yaml's document order, and the
  # last outcome is what happens when no edge's guard holds.

  # Creates the item in Receive. Issued by the coordinator once per story at dispatch
  # (WORKING-RULES §11: "a piece is picked up ... then dispatch"). `owner_agent`, `worktree` and
  # `integration_branch` are resolved by the implementation from the dispatch and the wave, so
  # they have no `sets:` line; `phase` is derived from the state.
  - name: swarm2.work.Open
    naming:
      wire: open
      display: Open a work item
    input:
      - name: swarm_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: repo
        type: String
      - name: wave_id
        type: Optional<Uuid>
    outcomes:
      - name: opened
        creates: swarm2.work.WorkItem
        instance: work_id
        emits:
          - swarm2.work.WorkItemOpened
        payload:
          swarm2.work.WorkItemOpened:
            swarm_id: input.swarm_id
            artifact_ref: input.artifact_ref
            repo: input.repo
            wave_id: input.wave_id
        sets:
          swarm_id: input.swarm_id
          artifact_ref: input.artifact_ref
          repo: input.repo
          wave_id: input.wave_id
        summary: The work item exists in Receive with no owner, no worktree and no counts.

  # `receive -> specify` is unguarded in aep ("nothing else gates it"), so this takes no fact.
  - name: swarm2.work.FinishIntake
    naming:
      wire: finish-intake
      display: Finish intake
    input:
      - name: work_id
        type: Uuid
    outcomes:
      - name: done
        moves: swarm2.work.WorkItem.intake_done
        instance: work_id
        emits:
          - swarm2.work.IntakeDone
        payload:
          swarm2.work.IntakeDone:
            work_id: input.work_id
        summary: What was asked for is recorded unedited; the item is in Specify.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Receive, so nothing moved.

  # Exit of `specify`. `disposition` stands for aep's `specification.declines_the_request`;
  # `spec_ref` for `artifact.specification.exists` (the id of the specification artifact). The
  # declining outcome is FIRST for the reason aep puts its edge first: "transitions are tried in
  # document order ... the rare edge is taken only where something actually observed the rare
  # fact, and the common edge is left exactly as strong as it was" — a negation on the common edge
  # would be undecidable in every ordinary run.
  - name: swarm2.work.RecordSpecification
    naming:
      wire: record-specification
      display: Record the specification
    input:
      - name: work_id
        type: Uuid
      - name: disposition
        type: swarm2.work.SpecDisposition
      - name: spec_ref
        type: String
      - name: reason
        type: Optional<String>
    outcomes:
      - name: declined
        when: disposition == Decline
        moves: swarm2.work.WorkItem.decline_at_spec
        instance: work_id
        emits:
          - swarm2.work.WorkDeclined
        payload:
          swarm2.work.WorkDeclined:
            work_id: input.work_id
            reason: input.reason
        summary: The specification found nothing to build; the item is Declined and the record says why.
      - name: specified
        moves: swarm2.work.WorkItem.specified
        instance: work_id
        emits:
          - swarm2.work.Specified
        payload:
          swarm2.work.Specified:
            work_id: input.work_id
            spec_ref: input.spec_ref
        summary: A specification exists; the item is in Decompose.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Specify, so nothing moved.

  # Exit of `decompose` — unguarded in aep. `unit_count` is how many units the decomposition
  # produced (`aep-plan:decomposer`, one story per unit under an epic; tasks under a story).
  - name: swarm2.work.RecordDecomposition
    naming:
      wire: record-decomposition
      display: Record the decomposition
    input:
      - name: work_id
        type: Uuid
      - name: unit_count
        type: Integer
    outcomes:
      - name: decomposed
        moves: swarm2.work.WorkItem.decomposed
        instance: work_id
        emits:
          - swarm2.work.Decomposed
        payload:
          swarm2.work.Decomposed:
            work_id: input.work_id
            unit_count: input.unit_count
        summary: Units are identified; the item is in EstablishVerifiers.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Decompose, so nothing moved.

  # Exit of `establish_verifiers`. `test_exists` stands for aep's `test.exists`. A guard that
  # reads false holds the aep run in place; here that is the `not_yet` refusal.
  - name: swarm2.work.RecordVerifiers
    naming:
      wire: record-verifiers
      display: Record that the verifiers exist
    input:
      - name: work_id
        type: Uuid
      - name: test_exists
        type: Boolean
    outcomes:
      - name: established
        when: test_exists == true
        moves: swarm2.work.WorkItem.verifiers_established
        instance: work_id
        emits:
          - swarm2.work.VerifiersEstablished
        payload:
          swarm2.work.VerifiersEstablished:
            work_id: input.work_id
        summary: A test exists before any implementation; the item is in Implement.
      - name: not-yet
        error: swarm2.work.GuardNotMet
        summary: No test exists yet, so the item stays in EstablishVerifiers.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in EstablishVerifiers, so nothing moved.

  # Exit of `implement`. `diff_exists` stands for aep's `diff.exists`.
  - name: swarm2.work.RecordChange
    naming:
      wire: record-change
      display: Record that the tree changed
    input:
      - name: work_id
        type: Uuid
      - name: diff_exists
        type: Boolean
    outcomes:
      - name: changed
        when: diff_exists == true
        moves: swarm2.work.WorkItem.changed
        instance: work_id
        emits:
          - swarm2.work.Changed
        payload:
          swarm2.work.Changed:
            work_id: input.work_id
        summary: The working tree has changed; the item is in Verify.
      - name: not-yet
        error: swarm2.work.GuardNotMet
        summary: The working tree has not changed, so there is nothing to verify and the item stays in Implement.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Implement, so nothing moved.

  # Exit of `verify`. `counts` are the driver's own numbers (`producer: verifier / test-runner`),
  # recorded by the Verifier actor and never by the implementor — that is what makes aep's
  # `independent: true` on entering `adversarial_verify` honestly satisfiable. The two aep edges
  # are complements (`all == 0` / `any > 0`), so the red edge is the unconditional outcome.
  - name: swarm2.work.RecordVerification
    naming:
      wire: record-verification
      display: Record a verification run
    input:
      - name: work_id
        type: Uuid
      - name: counts
        type: swarm2.work.Counts
    outcomes:
      - name: green
        when:
          all:
            - counts.unit_failed == 0
            - counts.contract_failed == 0
            - counts.static_errors == 0
        moves: swarm2.work.WorkItem.verified
        instance: work_id
        emits:
          - swarm2.work.Verified
        payload:
          swarm2.work.Verified:
            work_id: input.work_id
        sets:
          last_counts: input.counts
        summary: Unit and contract suites green, static analysis clean; the item is in AdversarialVerify.
      - name: red
        moves: swarm2.work.WorkItem.verify_failed
        instance: work_id
        emits:
          - swarm2.work.VerifyFailed
        payload:
          swarm2.work.VerifyFailed:
            work_id: input.work_id
        sets:
          last_counts: input.counts
        summary: Some check failed; the item is back in Implement with the counts kept.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Verify, so nothing moved.

  # Exit of `adversarial_verify`. The back-edge is FIRST because aep orders it first and "the order
  # is the whole point: the two are not mutually exclusive. An adversary that writes a failing case
  # and completes the evidence set satisfies both guards at once, and the first in document order
  # wins." With nothing broken and evidence outstanding, no aep edge is permitted: `evidence_outstanding`.
  - name: swarm2.work.RecordAdversarial
    naming:
      wire: record-adversarial
      display: Record the adversary's run
    input:
      - name: work_id
        type: Uuid
      - name: counts
        type: swarm2.work.Counts
      - name: evidence_missing
        type: Integer
    outcomes:
      - name: broke-it
        when:
          any:
            - counts.unit_failed > 0
            - counts.contract_failed > 0
            - counts.static_errors > 0
        moves: swarm2.work.WorkItem.adversary_broke_it
        instance: work_id
        emits:
          - swarm2.work.AdversaryBrokeIt
        payload:
          swarm2.work.AdversaryBrokeIt:
            work_id: input.work_id
        sets:
          last_counts: input.counts
          evidence_missing: input.evidence_missing
        summary: The adversary broke it; the item is back in Implement with the failing case kept.
      - name: passed
        when: evidence_missing == 0
        moves: swarm2.work.WorkItem.adversary_passed
        instance: work_id
        emits:
          - swarm2.work.AdversaryPassed
        payload:
          swarm2.work.AdversaryPassed:
            work_id: input.work_id
        sets:
          last_counts: input.counts
          evidence_missing: input.evidence_missing
        summary: Nothing broke and no required evidence is outstanding; the item is in Review.
      - name: evidence-outstanding
        error: swarm2.work.EvidenceOutstanding
        summary: Nothing broke, but required evidence is outstanding, so the item stays in AdversarialVerify.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in AdversarialVerify, so nothing moved.

  # Exit of `review`. `disposition` is aep's `ReviewDisposition`; `review_ref` the review record.
  # `artifact_ref` and `owner_agent` are taken as input so `WorkItemCompleted` can carry them: the
  # binding `WorkItemCompleted -> swarm2.board.PostMessage` needs a sender and a subject, and a
  # payload line maps an input, not an entity field.
  - name: swarm2.work.RecordReview
    naming:
      wire: record-review
      display: Record the review
    input:
      - name: work_id
        type: Uuid
      - name: disposition
        type: swarm2.work.ReviewDisposition
      - name: review_ref
        type: String
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: String
    outcomes:
      - name: approved
        when: disposition == Approved
        moves: swarm2.work.WorkItem.approved
        instance: work_id
        emits:
          - swarm2.work.WorkItemCompleted
        payload:
          swarm2.work.WorkItemCompleted:
            work_id: input.work_id
            artifact_ref: input.artifact_ref
            owner_agent: input.owner_agent
            review_ref: input.review_ref
        summary: Review approved; the item is Complete.
      - name: changes-requested
        when: disposition == ChangesRequested
        moves: swarm2.work.WorkItem.changes_requested
        instance: work_id
        emits:
          - swarm2.work.ChangesRequested
        payload:
          swarm2.work.ChangesRequested:
            work_id: input.work_id
            review_ref: input.review_ref
        summary: Review asked for changes; the item is back in Implement with the review as the reason.
      # `reason` on `WorkDeclined` has no payload line here: the reviewer's verdict text lives in
      # the review record `review_ref` names, and the implementation resolves it from there.
      - name: rejected
        moves: swarm2.work.WorkItem.rejected
        instance: work_id
        emits:
          - swarm2.work.WorkDeclined
        payload:
          swarm2.work.WorkDeclined:
            work_id: input.work_id
        summary: Review rejected the change outright; the item is Declined, not revised.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WorkStateConflict
        summary: The item is not in Review, so nothing moved.

  # `aep-drive:wave`: "pick the next set of stories that can be implemented at once, propose it
  # for approval". Proposes and stops.
  - name: swarm2.work.ProposeWave
    naming:
      wire: propose-wave
      display: Propose a wave
    input:
      - name: swarm_id
        type: Uuid
      - name: story_refs
        type: List<String>
      - name: integration_branch
        type: String
      - name: proposed_by
        type: String
    outcomes:
      - name: proposed
        creates: swarm2.work.Wave
        instance: wave_id
        emits:
          - swarm2.work.WaveProposed
        payload:
          swarm2.work.WaveProposed:
            swarm_id: input.swarm_id
            story_refs: input.story_refs
            proposed_by: input.proposed_by
        sets:
          swarm_id: input.swarm_id
          story_refs: input.story_refs
          integration_branch: input.integration_branch
          proposed_by: input.proposed_by
        summary: The wave is Proposed; nothing is dispatched until it is approved.

  # Timo's word, via a decision row (WORKING-RULES §9; `aep-drive:wave`: "it never starts a wave
  # nobody approved").
  - name: swarm2.work.ApproveWave
    naming:
      wire: approve-wave
      display: Approve a wave
    input:
      - name: wave_id
        type: Uuid
    outcomes:
      - name: approved
        moves: swarm2.work.Wave.approve
        instance: wave_id
        emits:
          - swarm2.work.WaveApproved
        payload:
          swarm2.work.WaveApproved:
            wave_id: input.wave_id
        summary: The wave is Approved and may be dispatched.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WaveStateConflict
        summary: Only a Proposed wave can be approved.

  # One `Open` per story follows, one implementor per story in its own worktree (`aep-drive:wave`).
  # `WaveDispatched.story_refs` has no payload line: the implementation reads it from the wave row.
  - name: swarm2.work.DispatchWave
    naming:
      wire: dispatch-wave
      display: Dispatch a wave
    input:
      - name: wave_id
        type: Uuid
    outcomes:
      - name: dispatched
        moves: swarm2.work.Wave.dispatch
        instance: wave_id
        emits:
          - swarm2.work.WaveDispatched
        payload:
          swarm2.work.WaveDispatched:
            wave_id: input.wave_id
        summary: The wave is Dispatched; a work item is opened for each story.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WaveStateConflict
        summary: Only an Approved wave can be dispatched.

  # "merge what goes green into one integration branch" (`aep-drive:wave`). `merged_sha` is the
  # integration branch's head after the merge.
  - name: swarm2.work.MergeWave
    naming:
      wire: merge-wave
      display: Merge a wave
    input:
      - name: wave_id
        type: Uuid
      - name: merged_sha
        type: String
    outcomes:
      - name: merged
        moves: swarm2.work.Wave.merge
        instance: wave_id
        emits:
          - swarm2.work.WaveMerged
        payload:
          swarm2.work.WaveMerged:
            wave_id: input.wave_id
            merged_sha: input.merged_sha
        summary: What went green is on the integration branch; the wave is Merged.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WaveStateConflict
        summary: Only a Dispatched wave can be merged.

  - name: swarm2.work.AbandonWave
    naming:
      wire: abandon-wave
      display: Abandon a wave
    input:
      - name: wave_id
        type: Uuid
      - name: reason
        type: String
    outcomes:
      - name: abandoned
        moves: swarm2.work.Wave.abandon
        instance: wave_id
        emits:
          - swarm2.work.WaveAbandoned
        payload:
          swarm2.work.WaveAbandoned:
            wave_id: input.wave_id
            reason: input.reason
        summary: The wave is Abandoned and the record says why; its items are not touched by this command.
      - name: wrong-state
        wrong_state: true
        error: swarm2.work.WaveStateConflict
        summary: The wave is already Merged or Abandoned, so nothing changed.

events:
  # Emitted by NO outcome: it is the `escalate` event of a binding in components.yaml (the binding result-reaches-the-orchestrator could not post the result).
  # An escalation nobody declared would be a silence; this is the fact instead (WakeLost precedent).
  - name: swarm2.work.ResultUndelivered
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.WorkItemOpened
    fields:
      - name: work_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: repo
        type: String
      - name: wave_id
        type: Optional<Uuid>
  - name: swarm2.work.IntakeDone
    fields:
      - name: work_id
        type: Uuid
  # Emitted by `RecordSpecification.declined` and `RecordReview.rejected`: both land in Declined.
  # `reason` is Optional because the input is and the crossing `Optional<String>` -> `String` is
  # refused without a `conversions:` entry (ESS-COMMAND-002, probed 2026-09-11) — and conversions
  # are declared in components.yaml, not in a domain file.
  - name: swarm2.work.WorkDeclined
    fields:
      - name: work_id
        type: Uuid
      - name: reason
        type: Optional<String>
  - name: swarm2.work.Specified
    fields:
      - name: work_id
        type: Uuid
      - name: spec_ref
        type: String
  - name: swarm2.work.Decomposed
    fields:
      - name: work_id
        type: Uuid
      - name: unit_count
        type: Integer
  - name: swarm2.work.VerifiersEstablished
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.Changed
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.Verified
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.VerifyFailed
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.AdversaryBrokeIt
    fields:
      - name: work_id
        type: Uuid
  - name: swarm2.work.AdversaryPassed
    fields:
      - name: work_id
        type: Uuid
  # Carries `artifact_ref` and `owner_agent` so the binding to `swarm2.board.PostMessage` has a
  # sender and a subject (a binding maps one event field per input).
  - name: swarm2.work.WorkItemCompleted
    fields:
      - name: work_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: String
      - name: review_ref
        type: String
  - name: swarm2.work.ChangesRequested
    fields:
      - name: work_id
        type: Uuid
      - name: review_ref
        type: String
  - name: swarm2.work.WaveProposed
    fields:
      - name: wave_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: story_refs
        type: List<String>
      - name: proposed_by
        type: String
  - name: swarm2.work.WaveApproved
    fields:
      - name: wave_id
        type: Uuid
  - name: swarm2.work.WaveDispatched
    fields:
      - name: wave_id
        type: Uuid
      - name: story_refs
        type: List<String>
  - name: swarm2.work.WaveMerged
    fields:
      - name: wave_id
        type: Uuid
      - name: merged_sha
        type: String
  - name: swarm2.work.WaveAbandoned
    fields:
      - name: wave_id
        type: Uuid
      - name: reason
        type: String

views:
  # Every item, newest first, with its lifecycle state projected. ess/1 has no "not terminal"
  # filter and a filter is one equality, so open work is read off `state` by the caller.
  - name: swarm2.work.WorkItems
    source: swarm2.work.WorkItem
    consistency: eventual
    order_by:
      - opened_at desc
    fields:
      - name: work_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: wave_id
        type: Optional<Uuid>
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: Optional<String>
      - name: phase
        type: swarm2.work.Phase
      - name: state
        type: swarm2.work.WorkItem.State
      - name: attempts
        type: Integer
      - name: opened_at
        type: Timestamp
    naming:
      wire: items
      display: All work items, newest first

  # What a reviewer picks from. Read-your-writes: the adversary that just sent it must see it.
  - name: swarm2.work.WorkInReview
    source: swarm2.work.WorkItem
    consistency: read_your_writes
    filter: state == Review
    fields:
      - name: work_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: Optional<String>
      - name: worktree
        type: Optional<String>
      - name: last_counts
        type: Optional<swarm2.work.Counts>
      - name: attempts
        type: Integer
    naming:
      wire: in-review
      display: Work items awaiting review

  # Named `DeclinedWork`, not `WorkDeclined`: that name is the event's, and "a name has exactly one
  # owner" (ESS-DOMAIN-006, probed 2026-09-11).
  - name: swarm2.work.DeclinedWork
    source: swarm2.work.WorkItem
    consistency: eventual
    filter: state == Declined
    fields:
      - name: work_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: closed_at
        type: Optional<Timestamp>
    naming:
      wire: declined
      display: Work items that were declined

  - name: swarm2.work.WorkComplete
    source: swarm2.work.WorkItem
    consistency: eventual
    filter: state == Complete
    fields:
      - name: work_id
        type: Uuid
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: Optional<String>
      - name: attempts
        type: Integer
      - name: closed_at
        type: Optional<Timestamp>
    naming:
      wire: complete
      display: Work items that completed

  # Every field, so the entity's invariants have rows they can be decided against.
  - name: swarm2.work.WorkItemById
    source: swarm2.work.WorkItem
    consistency: eventual
    fields:
      - name: work_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: wave_id
        type: Optional<Uuid>
      - name: artifact_ref
        type: String
      - name: owner_agent
        type: Optional<String>
      - name: repo
        type: String
      - name: worktree
        type: Optional<String>
      - name: integration_branch
        type: Optional<String>
      - name: phase
        type: swarm2.work.Phase
      - name: last_counts
        type: Optional<swarm2.work.Counts>
      - name: evidence_missing
        type: Integer
      - name: attempts
        type: Integer
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
      - name: state
        type: swarm2.work.WorkItem.State
    naming:
      wire: by-id
      display: One work item, whole

  - name: swarm2.work.Waves
    source: swarm2.work.Wave
    consistency: eventual
    order_by:
      - proposed_at desc
    fields:
      - name: wave_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: story_refs
        type: List<String>
      - name: integration_branch
        type: String
      - name: proposed_by
        type: String
      - name: proposed_at
        type: Timestamp
      - name: approved_at
        type: Optional<Timestamp>
      - name: merged_at
        type: Optional<Timestamp>
      - name: state
        type: swarm2.work.Wave.State
    naming:
      wire: waves
      display: All waves, newest first

  - name: swarm2.work.DispatchedWaves
    source: swarm2.work.Wave
    consistency: read_your_writes
    filter: state == Dispatched
    fields:
      - name: wave_id
        type: Uuid
      - name: story_refs
        type: List<String>
      - name: integration_branch
        type: String
    naming:
      wire: dispatched
      display: Waves with work in flight

actors:
  # The agent on the story, in its own worktree. Records what it did up to the change; never the
  # verification of it.
  - name: swarm2.work.Implementor
    may:
      - swarm2.work.FinishIntake
      - swarm2.work.RecordSpecification
      - swarm2.work.RecordDecomposition
      - swarm2.work.RecordVerifiers
      - swarm2.work.RecordChange
    naming:
      display: Implementor
  # The test runner — `producer: verifier / test-runner` — independent of the implementor
  # (default.yaml `adversarial_verify.requires.evidence: independent: true`).
  - name: swarm2.work.Verifier
    may:
      - swarm2.work.RecordVerification
    naming:
      display: Verifier
  # `aep-drive:adversary`: tries to break a change that already passes its own tests.
  - name: swarm2.work.Adversary
    may:
      - swarm2.work.RecordAdversarial
    naming:
      display: Adversary
  - name: swarm2.work.Reviewer
    may:
      - swarm2.work.RecordReview
    naming:
      display: Reviewer
  # The coordinator: the store's one writer (WORKING-RULES §11).
  - name: swarm2.work.Coordinator
    may:
      - swarm2.work.Open
      - swarm2.work.ProposeWave
      - swarm2.work.DispatchWave
      - swarm2.work.MergeWave
      - swarm2.work.AbandonWave
    naming:
      display: Coordinator
  - name: swarm2.work.Timo
    may:
      - swarm2.work.ApproveWave
    naming:
      display: Timo
