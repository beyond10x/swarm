views:
  # "schema known to everyone" — this view is that fact. Readable by every actor, the Viewer
  # included. read_your_writes so the agent that just published sees it before wiring a port.
  - name: swarm.blackbox.PublishedSchemas
    source: swarm.blackbox.Schema
    consistency: read_your_writes
    filter: state == Published
    fields:
      - name: schema_id
        type: String
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: version
        type: Integer
      - name: summary
        type: Optional<String>
      - name: owner_agent
        type: Optional<String>
    naming:
      wire: published-schemas
      display: Schemas known to everyone

  # The whole schema including its JSON Schema text, in any state — what a validator fetches.
  - name: swarm.blackbox.SchemaById
    source: swarm.blackbox.Schema
    consistency: read_your_writes
    fields:
      - name: schema_id
        type: String
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: version
        type: Integer
      - name: json_schema
        type: String
      - name: owner_agent
        type: Optional<String>
      - name: summary
        type: Optional<String>
      - name: published_at
        type: Optional<Timestamp>
    naming:
      wire: schema-by-id
      display: One schema, whole

  # The canvas: every box of one swarm, in every state, keyed by the caller's `swarm_id` — a
  # view's filter is one equality on the source, and the swarm key is the caller's, so there is
  # no filter here. read_your_writes: a box just thrown on the canvas is there when the canvas
  # re-reads. `state` is listed because a view with no filter returns Retired boxes too, and the
  # UI has to draw Draft, Published and Retired apart (probed 2026-09-11, ess 0.23.0: a view may
  # list the lifecycle state as a field typed `<Entity>.State`; manager.yaml never does, it
  # filters instead).
  - name: swarm.blackbox.Canvas
    source: swarm.blackbox.Box
    consistency: read_your_writes
    fields:
      - name: box_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: kind
        type: swarm.blackbox.BoxKind
      - name: owner_agent
        type: Optional<String>
      - name: version
        type: Integer
      - name: inputs
        type: List<swarm.blackbox.Port>
      - name: outputs
        type: List<swarm.blackbox.Port>
      - name: ref_id
        type: Optional<String>
      # Listed because this view IS the canvas, and a canvas that cannot see a Ui box's props
      # cannot draw it — the reader would have to fetch the box again to render what it already
      # asked for.
      - name: props
        type: Optional<Map<String, String>>
      - name: agent_id
        type: Optional<String>
      - name: position
        type: swarm.blackbox.Position
      - name: state
        type: swarm.blackbox.Box.State
    naming:
      wire: canvas
      display: The canvas — every box of a swarm

  # What an agent may connect to: the surfaces that are promises.
  - name: swarm.blackbox.PublishedBoxes
    source: swarm.blackbox.Box
    consistency: read_your_writes
    filter: state == Published
    fields:
      - name: box_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: kind
        type: swarm.blackbox.BoxKind
      - name: owner_agent
        type: Optional<String>
      - name: summary
        type: Optional<String>
      - name: version
        type: Integer
      - name: inputs
        type: List<swarm.blackbox.Port>
      - name: outputs
        type: List<swarm.blackbox.Port>
    naming:
      wire: published-boxes
      display: Boxes that can be connected to

  - name: swarm.blackbox.BoxById
    source: swarm.blackbox.Box
    consistency: read_your_writes
    fields:
      - name: box_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: kind
        type: swarm.blackbox.BoxKind
      - name: owner_agent
        type: Optional<String>
      - name: summary
        type: Optional<String>
      - name: version
        type: Integer
      - name: inputs
        type: List<swarm.blackbox.Port>
      - name: outputs
        type: List<swarm.blackbox.Port>
      - name: ref_id
        type: Optional<String>
      - name: agent_id
        type: Optional<String>
      - name: position
        type: swarm.blackbox.Position
      - name: created_at
        type: Timestamp
      - name: published_at
        type: Optional<Timestamp>
    naming:
      wire: box-by-id
      display: One box, whole

  # The wires the canvas draws solid: what is carrying values now, with the binding columns.
  - name: swarm.blackbox.LiveConnections
    source: swarm.blackbox.Connection
    consistency: read_your_writes
    filter: state == Live
    fields:
      - name: connection_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: from_box_id
        type: Uuid
      - name: from_output
        type: String
      - name: to_box_id
        type: Uuid
      - name: to_input
        type: String
      - name: schema_id
        type: String
      - name: delivery
        type: swarm.blackbox.Delivery
      - name: on_failure
        type: swarm.blackbox.Failure
    naming:
      wire: live-connections
      display: Connections carrying values

  # The wires the canvas draws dashed: what a revise or retire broke, for its maker to repair.
  - name: swarm.blackbox.BrokenConnections
    source: swarm.blackbox.Connection
    consistency: read_your_writes
    filter: state == Broken
    fields:
      - name: connection_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: from_box_id
        type: Uuid
      - name: from_output
        type: String
      - name: to_box_id
        type: Uuid
      - name: to_input
        type: String
      - name: schema_id
        type: String
      - name: made_by
        type: String
    naming:
      wire: broken-connections
      display: Connections an end change broke

  # Every connection in every state — the audit list; eventual, nobody acts on it in the same
  # breath as a write. `state` is listed for the same reason as on `Canvas`: no filter, so Removed
  # rows are in it.
  - name: swarm.blackbox.Connections
    source: swarm.blackbox.Connection
    consistency: eventual
    order_by:
      - made_at desc
    fields:
      - name: connection_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: from_box_id
        type: Uuid
      - name: from_output
        type: String
      - name: to_box_id
        type: Uuid
      - name: to_input
        type: String
      - name: schema_id
        type: String
      - name: delivery
        type: swarm.blackbox.Delivery
      - name: on_failure
        type: swarm.blackbox.Failure
      - name: escalation_event
        type: Optional<String>
      - name: made_by
        type: String
      - name: made_at
        type: Timestamp
      - name: state
        type: swarm.blackbox.Connection.State
    naming:
      wire: connections
      display: Every connection, newest first

actors:
  # Any agent, the orchestrator included — Timo: "the orchestrator will then also (individually
  # per swarm) build things - agents can do too". One actor, not one per kind of builder:
  # nothing in his words gives the orchestrator a command an agent lacks.
  - name: swarm.blackbox.Builder
    may:
      - swarm.blackbox.DraftSchema
      - swarm.blackbox.PublishSchema
      - swarm.blackbox.DeprecateSchema
      - swarm.blackbox.DraftBox
      - swarm.blackbox.MoveBox
      - swarm.blackbox.RedefinePorts
      - swarm.blackbox.PublishBox
      - swarm.blackbox.ReviseBox
      - swarm.blackbox.RetireBox
      - swarm.blackbox.Connect
      - swarm.blackbox.ActivateConnection
      - swarm.blackbox.BreakConnection
      - swarm.blackbox.RepairConnection
      - swarm.blackbox.Disconnect
    naming:
      display: Builder
  # The UI ("pre-build ui-components (component-lib)"): reads every view, issues no command. An
  # actor with no `may` is "in the picture, permitted nothing" (authoring rules).
  - name: swarm.blackbox.Viewer
    naming:
      display: Viewer
