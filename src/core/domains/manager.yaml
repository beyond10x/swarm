# swarm.manager — the outer system. Its members are Swarms.
#
# A Swarm is one session with one home directory and one coordinator. The session name is the fact
# every launcher keys on, so it is a required field here and NOT the identity: a swarm can be
# stopped and started again under the same session name, and two records for one name is a mismatch
# the implementation detects rather than a shape this file permits.
#
# What a swarm is pursuing is a `swarm.goal.Goal` — an entity with a lifecycle whose back-edge is
# the loop, not a list of free text. It replaced a `Goal` struct on 2026-09-11, because a goal
# nothing can mark reached cannot end a loop.
domain: swarm.manager

summary: Many swarms, each created, started, paused, stopped and deleted here.

naming:
  wire: swarms
  display: Swarm manager

entities:
  - name: swarm.manager.Swarm
    identity:
      name: swarm_id
      type: Uuid
    fields:
      - name: display_name
        type: String
      # The tmux session. Required, unique per manager — uniqueness is prose + the
      # `SwarmSessionTaken` refusal below, because ess/1 has no field-level uniqueness (probed on
      # swarm/domains/board.yaml round 24: `unknown field unique`).
      - name: tmux_session
        type: String
      # The directory the swarm works in and writes its records under.
      - name: home
        type: String
      # Timestamps are handed in, never read from a clock inside the model: ESS determines what an
      # outcome writes but not what time it is, so the runtime reads the clock at the edge and
      # passes it as an input. Every one of them is also carried on the event that sets it, so the
      # log alone can rebuild this record.
      - name: created_at
        type: Timestamp
      - name: started_at
        type: Optional<Timestamp>
      - name: stopped_at
        type: Optional<Timestamp>
      # The configuration the swarm runs with now. Written by `AdoptConfig`, which a binding
      # invokes from `swarm.config.ConfigActivated`; Optional because a Created swarm has none yet.
      - name: active_config_id
        type: Optional<Uuid>
    relations:
      # The swarm's members. At birth there is exactly one — the coordinator. Every other agent is
      # one the coordinator spawned, and has no meaning outside the swarm that spawned it.
      - name: agents
        kind: owns
        target: swarm.agent.Agent
        cardinality: many
        via: swarm_id
      # What this swarm draws for itself. Timo, 2026-09-11: "they build workflows/systems
      # themselves". A tool, an MCP server, a UI panel, a loop and the goal are all Boxes; what may
      # reach what is a Connection between them. This is the whole extension mechanism: a swarm
      # grows by drawing boxes and wiring them, never by gaining a domain.
      - name: boxes
        kind: owns
        target: swarm.blackbox.Box
        cardinality: many
        via: swarm_id
      - name: schemas
        kind: owns
        target: swarm.blackbox.Schema
        cardinality: many
        via: swarm_id
      # A configuration has no meaning without the swarm it configures.
      - name: configs
        kind: owns
        target: swarm.config.Config
        cardinality: many
        via: swarm_id
      # The one it runs with. `references`, not `owns`: the same rows are already owned above, and
      # this edge only says which of them is current.
      - name: active_config
        kind: references
        target: swarm.config.Config
        cardinality: one
        via: active_config_id
    lifecycle:
      # Created: the record exists, nothing runs. Running: the tmux session is up and the
      # orchestrator has a generation. Paused: the session is up, the crons are cancelled, nobody
      # is woken. Stopped: the session is gone, the records stay. Deleted: terminal — the records
      # are retired; nothing here says they are erased (swarm/docs/md-inventory.md: "nothing here
      # is deleted", briefs were moved, not removed).
      initial: Created
      states: [Created, Running, Paused, Stopped, Deleted]
      terminal: [Deleted]
      transitions:
        - name: start
          from: [Created, Stopped]
          to: Running
        - name: pause
          from: [Running]
          to: Paused
        - name: resume
          from: [Paused]
          to: Running
        - name: stop
          from: [Running, Paused]
          to: Stopped
        # From Created or Stopped only. Deleting a Running swarm is refused by absence: the
        # `wrong-state` branch of `DeleteSwarm` answers in Running and Paused.
        - name: delete
          from: [Created, Stopped]
          to: Deleted

errors:
  - name: swarm.manager.SwarmStateConflict
    summary: The swarm is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm.manager.Swarm.State
  # Raised by the implementation of `CreateSwarm` when the session name is already a swarm's.
  # Not an outcome: "a row with this session exists" is a lookup, not a function of the input
  # (ESS-COMMAND-003, the same limit `swarm.board.CreateInbox` documents).
  - name: swarm.manager.SwarmSessionTaken
    summary: Another swarm already owns this tmux session name, so nothing was created.
    fields:
      - name: tmux_session
        type: String

commands:
  - name: swarm.manager.CreateSwarm
    naming:
      wire: create-swarm
      display: Create a swarm
    input:
      - name: display_name
        type: String
      - name: tmux_session
        type: String
      - name: home
        type: String
      - name: created_at
        type: Timestamp
    outcomes:
      - name: created
        creates: swarm.manager.Swarm
        instance: swarm_id
        emits:
          - swarm.manager.SwarmCreated
        payload:
          swarm.manager.SwarmCreated:
            display_name: input.display_name
            tmux_session: input.tmux_session
            home: input.home
            created_at: input.created_at
            swarm_id:
              generated: true
        sets:
          display_name: input.display_name
          tmux_session: input.tmux_session
          home: input.home
          created_at: input.created_at
        summary: The swarm exists in Created, with no config and no run.

  - name: swarm.manager.UpdateSwarm
    naming:
      wire: update-swarm
      display: Rename a swarm
    input:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
    outcomes:
      - name: updated
        updates: swarm.manager.Swarm
        instance: swarm_id
        emits:
          - swarm.manager.SwarmUpdated
        payload:
          swarm.manager.SwarmUpdated:
            swarm_id: input.swarm_id
            display_name: input.display_name
        sets:
          display_name: input.display_name
        summary: The name is replaced; the state is unchanged.

  # Invoked by the binding on `swarm.config.ConfigActivated`, never typed: the config domain
  # decides which config is active, and this is how the swarm record learns it. A cross-entity
  # `sets:` is not expressible, so the fact crosses as an event and lands as its own command.
  - name: swarm.manager.AdoptConfig
    naming:
      wire: adopt-config
      display: Adopt an activated config
    input:
      - name: swarm_id
        type: Uuid
      - name: config_id
        type: Uuid
    outcomes:
      - name: adopted
        updates: swarm.manager.Swarm
        instance: swarm_id
        emits:
          - swarm.manager.ConfigAdopted
        payload:
          swarm.manager.ConfigAdopted:
            swarm_id: input.swarm_id
            config_id: input.config_id
            active_config_id: input.config_id
        sets:
          active_config_id: input.config_id
        summary: The swarm's active_config_id points at the config that was just activated.

  - name: swarm.manager.StartSwarm
    naming:
      wire: start-swarm
      display: Start a swarm
    input:
      - name: swarm_id
        type: Uuid
      - name: started_at
        type: Timestamp
    outcomes:
      - name: started
        moves: swarm.manager.Swarm.start
        instance: swarm_id
        emits:
          - swarm.manager.SwarmStarted
        payload:
          swarm.manager.SwarmStarted:
            swarm_id: input.swarm_id
            started_at: input.started_at
        sets:
          started_at: input.started_at
        summary: The session is up; a binding opens the orchestrator's run.
      - name: wrong-state
        wrong_state: true
        error: swarm.manager.SwarmStateConflict
        summary: The swarm is Running, Paused or Deleted, so nothing started.

  - name: swarm.manager.PauseSwarm
    naming:
      wire: pause-swarm
      display: Pause a swarm
    input:
      - name: swarm_id
        type: Uuid
    outcomes:
      - name: paused
        moves: swarm.manager.Swarm.pause
        instance: swarm_id
        emits:
          - swarm.manager.SwarmPaused
        payload:
          swarm.manager.SwarmPaused:
            swarm_id: input.swarm_id
        summary: Crons are cancelled and gates are not evaluated; windows stay.
      - name: wrong-state
        wrong_state: true
        error: swarm.manager.SwarmStateConflict
        summary: Only a Running swarm can be paused.

  - name: swarm.manager.ResumeSwarm
    naming:
      wire: resume-swarm
      display: Resume a paused swarm
    input:
      - name: swarm_id
        type: Uuid
    outcomes:
      - name: resumed
        moves: swarm.manager.Swarm.resume
        instance: swarm_id
        emits:
          - swarm.manager.SwarmResumed
        payload:
          swarm.manager.SwarmResumed:
            swarm_id: input.swarm_id
        summary: Crons are recreated and gates are evaluated again.
      - name: wrong-state
        wrong_state: true
        error: swarm.manager.SwarmStateConflict
        summary: Only a Paused swarm can be resumed.

  - name: swarm.manager.StopSwarm
    naming:
      wire: stop-swarm
      display: Stop a swarm
    input:
      - name: swarm_id
        type: Uuid
      - name: stopped_at
        type: Timestamp
    outcomes:
      - name: stopped
        moves: swarm.manager.Swarm.stop
        instance: swarm_id
        emits:
          - swarm.manager.SwarmStopped
        payload:
          swarm.manager.SwarmStopped:
            swarm_id: input.swarm_id
            stopped_at: input.stopped_at
        sets:
          stopped_at: input.stopped_at
        summary: The session is torn down; records, board and event log stay on disk.
      - name: wrong-state
        wrong_state: true
        error: swarm.manager.SwarmStateConflict
        summary: The swarm was not Running or Paused, so nothing stopped.

  - name: swarm.manager.DeleteSwarm
    naming:
      wire: delete-swarm
      display: Delete a swarm
    input:
      - name: swarm_id
        type: Uuid
    outcomes:
      - name: deleted
        moves: swarm.manager.Swarm.delete
        instance: swarm_id
        emits:
          - swarm.manager.SwarmDeleted
        payload:
          swarm.manager.SwarmDeleted:
            swarm_id: input.swarm_id
        summary: The swarm is retired; it no longer appears in the swarms list.
      - name: wrong-state
        wrong_state: true
        error: swarm.manager.SwarmStateConflict
        summary: A Running or Paused swarm is not deleted; stop it first.

events:
  - name: swarm.manager.SwarmCreated
    fields:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
      - name: tmux_session
        type: String
      - name: home
        type: String
      - name: created_at
        type: Timestamp
  - name: swarm.manager.SwarmUpdated
    fields:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
  - name: swarm.manager.ConfigAdopted
    fields:
      - name: swarm_id
        type: Uuid
      - name: config_id
        type: Uuid
      - name: active_config_id
        type: Optional<Uuid>
  - name: swarm.manager.SwarmStarted
    fields:
      - name: swarm_id
        type: Uuid
      - name: started_at
        type: Timestamp
  - name: swarm.manager.SwarmPaused
    fields:
      - name: swarm_id
        type: Uuid
  - name: swarm.manager.SwarmResumed
    fields:
      - name: swarm_id
        type: Uuid
  - name: swarm.manager.SwarmStopped
    fields:
      - name: swarm_id
        type: Uuid
      - name: stopped_at
        type: Timestamp
  - name: swarm.manager.SwarmDeleted
    fields:
      - name: swarm_id
        type: Uuid

views:
  - name: swarm.manager.Swarms
    source: swarm.manager.Swarm
    consistency: read_your_writes
    order_by:
      - created_at desc
    fields:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
      - name: tmux_session
        type: String
      - name: created_at
        type: Timestamp
    naming:
      wire: swarms
      display: All swarms, newest first

  - name: swarm.manager.RunningSwarms
    source: swarm.manager.Swarm
    consistency: read_your_writes
    filter: state == Running
    fields:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
      - name: tmux_session
        type: String
      - name: started_at
        type: Optional<Timestamp>
    naming:
      wire: running
      display: Swarms that are running

  - name: swarm.manager.SwarmById
    source: swarm.manager.Swarm
    consistency: eventual
    fields:
      - name: swarm_id
        type: Uuid
      - name: display_name
        type: String
      - name: tmux_session
        type: String
      - name: home
        type: String
      - name: active_config_id
        type: Optional<Uuid>
    naming:
      wire: by-id
      display: One swarm, whole

actors:
  # Timo, or a UI/CLI acting for him. The manager is the one surface reached across a process
  # boundary (components.yaml: `reached_by: network`).
  - name: swarm.manager.Operator
    may:
      - swarm.manager.CreateSwarm
      - swarm.manager.UpdateSwarm
      - swarm.manager.StartSwarm
      - swarm.manager.PauseSwarm
      - swarm.manager.ResumeSwarm
      - swarm.manager.StopSwarm
      - swarm.manager.DeleteSwarm
    naming:
      display: Operator
  # The bindings' actor: what the system does to itself.
  - name: swarm.manager.Manager
    may:
      - swarm.manager.AdoptConfig
    naming:
      display: Swarm manager
