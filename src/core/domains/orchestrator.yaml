# swarm2.orchestrator — the one main process per swarm: its run, its generations, its tick cycle,
# its classification of agents.
#
# The orchestrator is "the session Timo types into" (swarm/coordinator/CHARTER.md, first line) and
# "the main ingestion agent. Work arrives — from Timo, from the AEP ledger, from the inboxes — and
# the coordinator's job is to route it, not to do it" (swarm/AGENTS.md, first paragraph). It is one
# process that lives through many GENERATIONS: every 15-minute memory tick ends the current one
# (`coord-restart.sh` types `/clear`) and the SessionStart hook seeds the next from the memory
# file (CHARTER.md §5, SEED.md). A RUN is the record directory those generations share
# (`swarm/runs/<run>/`, CHARTER.md §2) — one per swarm start; `swarm2.manager.Swarm.runs owns Run
# via swarm_id` is declared by the integrator on the Swarm entity, this file only carries the field.
#
# Two things this domain deliberately does NOT model, and where they live instead:
#   - the decisions ledger (CHARTER.md §1 "the run's open decisions") → swarm2.decision;
#   - the board the orchestrator reads on every tick (AGENTS.md §1 step 1) → swarm2.board.
# Both are reached through bindings in components.yaml; each event below says which.
#
# ess 0.23.0 on this machine (docs/ess-authoring-rules.md was probed against 0.22.2).
domain: swarm2.orchestrator

summary: >-
  One orchestrator process per swarm: a run of numbered generations, each seeded from the memory
  file, ticking every minute to classify every window into one of four verdicts, reporting
  deviations only, and restarting itself every fifteen minutes unless a question is in flight.

naming:
  wire: orchestrator
  display: Orchestrator

types:
  # The four verdicts, and only four. WORKING-RULES.md §8: "At every tick each window is one of
  # four, and the classification is the work: continue, idle is correct, decision, fault."
  - name: swarm2.orchestrator.Verdict
    kind: enum
    variants: [Continue, IdleIsCorrect, Decision, Fault]
    naming:
      display: Verdict

  # AGENTS.md §1 step 5 "Route — keep, dispatch, or park". Declared here so that the routing table
  # ("What the coordinator keeps versus dispatches") has a typed home; no command below takes it,
  # because the route follows from the verdict (Classify) and is not a second input.
  - name: swarm2.orchestrator.Route
    kind: enum
    variants: [Keep, Dispatch, Park]
    naming:
      display: Route

  # One section of the memory file as coord-budget.sh measures it: "each section's caps are the
  # `<!-- cap: N lines / M chars | evict: ... -->` comment under its heading" (swarm/bin/
  # coord-budget.sh header). Seven of these make the file (`## 0 Generation` … `## 6 Do not
  # re-derive`); the ceiling over all of them is 8192 bytes (CHARTER.md §4).
  - name: swarm2.orchestrator.MemorySection
    kind: struct
    fields:
      - name: name
        type: String
      - name: bytes
        type: Integer
      - name: lines
        type: Integer

entities:
  # A run: the record directory one swarm start writes into. CHARTER.md §2 lists what lives there
  # ("swarm/runs/<run>/decisions.md, swarm/runs/<run>/peers.state, … swarm/runs/<run>/
  # coordinator.memory.md"); every script keys on its name (`run=2026-09-11-codex-takeover` in
  # coord-budget.sh, `run_id=2026-09-11-codex-takeover` in coord-restart.sh, `RUN = "2026-09-11-
  # codex-takeover"` in coordinator-seed.py).
  - name: swarm2.orchestrator.Run
    identity:
      name: run_id
      type: Uuid
    fields:
      # The swarm this run belongs to; the `via` of `swarm2.manager.Swarm.runs` (integrator's).
      - name: swarm_id
        type: Uuid
      # The directory slug the scripts hard-code, e.g. `2026-09-11-codex-takeover`.
      - name: name
        type: String
      # Where the records are: `swarm/runs/<run>/` relative to the swarm's home (CHARTER.md §2).
      - name: record_dir
        type: String
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
      # How many generations have been seeded into this run. Maintained by the implementation of
      # `Seed` (`sets:` cannot express `+ 1`); the arrival line's `N` (SEED.md §4) is the latest.
      - name: generation_count
        type: Integer
    invariants:
      - generation_count >= 0
    relations:
      # A generation has no meaning without the run whose memory file seeded it.
      - name: generations
        kind: owns
        target: swarm2.orchestrator.Generation
        cardinality: many
        via: run_id
    lifecycle:
      # Open: generations are being seeded into it. Closed: terminal — the records stay on disk
      # (manager.yaml: "records, board and event log stay on disk" when a swarm stops).
      initial: Open
      states: [Open, Closed]
      terminal: [Closed]
      transitions:
        - name: close
          from: [Open]
          to: Closed

  # A generation: one session of the orchestrator process between two seedings. SEED.md: "What a
  # fresh coordinator generation is told. The SessionStart hook … injects this file, CHARTER.md and
  # coordinator.memory.md as additionalContext … Nobody types anything." Its number is `## 0
  # Generation` in the memory file (`- generation: N`, one of the four mandatory keys
  # coord-budget.sh checks: generation, written, pane, defers).
  - name: swarm2.orchestrator.Generation
    identity:
      name: generation_id
      type: Uuid
    fields:
      - name: run_id
        type: Uuid
      # `N` in the arrival line "coordinator gen N up" (SEED.md §4).
      - name: number
        type: Integer
      # The harness session id the hook records in ACTIVE (`session=%s`, coordinator-seed.py).
      # Optional: "a coordinator launched without CC_COORD=1 carries no marker" (CHARTER.md §5.5).
      - name: session_id
        type: Optional<String>
      # `B` in the arrival line: "wc -c of the memory file" at seed time (SEED.md §4).
      - name: seeded_from_bytes
        type: Integer
      # `K` in the arrival line: "the line count of `## 3 Windows`" (SEED.md §4); refreshed by
      # every check-in from `swarm/bin/status.sh` (AGENTS.md §1 step 3).
      - name: windows
        type: Integer
      # `- defers: N` in `## 0 Generation`. "Hard cap: 3 consecutive defers (45 minutes)"
      # (CHARTER.md §5.7). The cap itself is `swarm2.config.Budgets.max_defers`.
      - name: defers
        type: Integer
      # The memory file's current size; the ceiling is 8192 bytes (CHARTER.md §4) and lives in
      # `swarm2.config.Budgets.memory_file_bytes`. Not an invariant here: the gate is the script.
      - name: memory_bytes
        type: Integer
      # The last verdict of `swarm/bin/coord-budget.sh` ("Exit 0 = legal"). At seed time it is the
      # hook's own run of the gate ("budget gate: exit 0, the memory file is legal").
      - name: memory_gate_green
        type: Boolean
      # The content of `## 2 In flight to Timo`, if any: "asked in a report since his last message,
      # and not yet a numbered row in decisions.md" (CHARTER.md §5.1). Null means none in flight.
      - name: in_flight_question
        type: Optional<String>
      - name: seeded_at
        type: Timestamp
      - name: retired_at
        type: Optional<Timestamp>
      # Check-ins taken (the `*/1 * * * *` cron, SEED.md §1). Counted by the implementation of
      # `FirstTick` and `CheckIn`; not a memory-file key, so no input carries it.
      - name: ticks
        type: Integer
    invariants:
      - defers >= 0
      - memory_bytes >= 0
    lifecycle:
      # The generation workflow, in the shape of ../aep/workflows/*.yaml (system.yaml header).
      # Seeded: the hook has injected charter, seed and memory; no tick yet (SEED.md §4: one
      #   arrival line, "then stop and wait").
      # Ticking: the 1-minute check-in loop runs (AGENTS.md §1).
      # Deferred: a memory tick found a question in flight and skipped the restart (CHARTER.md
      #   §5.1 → §5.7); check-ins continue.
      # Restarting: `coord-restart.sh` has been run; the keystroke is queued until the pane is
      #   idle ("Text sent to a pane mid-turn is queued as the NEXT prompt", coord-restart.sh).
      # Retired: terminal. Either the `/clear` landed and the hook seeded the successor, or the
      #   generation died (usage limit, killed pane — the `fault` row of WORKING-RULES.md §8).
      initial: Seeded
      states: [Seeded, Ticking, Deferred, Restarting, Retired]
      terminal: [Retired]
      transitions:
        - name: first_tick
          from: [Seeded]
          to: Ticking
        # From Deferred to Deferred is the 2nd and 3rd consecutive defer (CHARTER.md §5.7).
        - name: defer
          from: [Ticking, Deferred]
          to: Deferred
        # Timo answered, or the question became a numbered row: `## 2` is empty again.
        - name: resume
          from: [Deferred]
          to: Ticking
        # From Deferred as well: the 4th tick parks the question and "the restart proceeds at
        # step 2" (CHARTER.md §5.7).
        - name: restart
          from: [Ticking, Deferred]
          to: Restarting
        - name: retire
          from: [Restarting]
          to: Retired
        # "Must not restart itself on arrival" (SEED.md §5) is why Seeded → Restarting is absent;
        # Seeded → Retired is a generation that died before its first tick.
        - name: abort
          from: [Seeded, Ticking, Deferred, Restarting]
          to: Retired

errors:
  - name: swarm2.orchestrator.GenerationStateConflict
    summary: The generation is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.orchestrator.Generation.State
  - name: swarm2.orchestrator.RunStateConflict
    summary: The run is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.orchestrator.Run.State
  # CHARTER.md §5.4: "Never restart on a red gate — a fresh generation seeded from an illegal file
  # is worse than a bloated one." coord-restart.sh precondition 1, "refusing — the budget gate is
  # red; fix the memory file, do not restart".
  - name: swarm2.orchestrator.RedBudgetGate
    summary: The memory file fails coord-budget.sh, so the generation was not restarted.
    fields:
      - name: memory_bytes
        type: Integer
  # CHARTER.md §5.5 / §6 "Never leave two coordinators running". The hook's line: "TWO
  # COORDINATORS: pid(s) %s are live and also carry CC_COORD=1 … Stop, tell Timo, and do not
  # restart anything." (coordinator-seed.py).
  - name: swarm2.orchestrator.TwoCoordinators
    summary: Another live claude process carries CC_COORD=1, so the generation was not restarted.
    fields: []

commands:
  # Invoked by the binding on `swarm2.manager.SwarmStarted` (manager.yaml StartSwarm: "The session
  # is up; a binding opens the orchestrator's run"), or typed for a run that predates the manager.
  - name: swarm2.orchestrator.OpenRun
    naming:
      wire: open-run
      display: Open a run
    input:
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: record_dir
        type: String
    outcomes:
      - name: opened
        creates: swarm2.orchestrator.Run
        instance: run_id
        emits:
          - swarm2.orchestrator.RunOpened
        payload:
          swarm2.orchestrator.RunOpened:
            swarm_id: input.swarm_id
            name: input.name
        sets:
          swarm_id: input.swarm_id
          name: input.name
          record_dir: input.record_dir
        summary: The run exists in Open with no generation yet; generation_count starts at zero.

  - name: swarm2.orchestrator.CloseRun
    naming:
      wire: close-run
      display: Close a run
    input:
      - name: run_id
        type: Uuid
    outcomes:
      - name: closed
        moves: swarm2.orchestrator.Run.close
        instance: run_id
        emits:
          - swarm2.orchestrator.RunClosed
        payload:
          swarm2.orchestrator.RunClosed:
            run_id: input.run_id
        summary: No further generation is seeded into this run; its records stay on disk.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.RunStateConflict
        summary: The run was already Closed, so nothing moved.

  # What the SessionStart hook does on `startup` and `clear` (coordinator-seed.py: "FIRES ON:
  # source startup and clear only"). `seeded_from_bytes` and `windows` are the `B` and `K` of the
  # arrival line (SEED.md §4). The hook also runs the budget gate and writes ACTIVE; the gate's
  # verdict lands on `memory_gate_green` by the implementation, not by an input.
  - name: swarm2.orchestrator.Seed
    naming:
      wire: seed
      display: Seed a generation
    input:
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
      - name: session_id
        type: Optional<String>
      - name: seeded_from_bytes
        type: Integer
      - name: windows
        type: Integer
    outcomes:
      - name: seeded
        creates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationSeeded
        payload:
          swarm2.orchestrator.GenerationSeeded:
            run_id: input.run_id
            number: input.number
            windows: input.windows
        sets:
          run_id: input.run_id
          number: input.number
          session_id: input.session_id
          seeded_from_bytes: input.seeded_from_bytes
          windows: input.windows
        summary: >-
          The generation exists in Seeded with defers 0 and ticks 0; the run's generation_count
          is incremented in the same transaction.

  # The first `check in on your swarm` tick after seeding (SEED.md §1 cron `*/1 * * * *`), AGENTS.md
  # §1 steps 1–3: take the inbox (`unread`), take the ledger (`draft_stories`), take the pane state
  # (`windows`). Split from `CheckIn` because ess/1 has no "move if in Seeded, else update"
  # outcome: a `moves:` command refuses every other state as wrong-state, and a normal tick is
  # not a wrong state.
  - name: swarm2.orchestrator.FirstTick
    naming:
      wire: first-tick
      display: Take the first check-in
    input:
      - name: generation_id
        type: Uuid
      - name: unread
        type: Integer
      - name: draft_stories
        type: Integer
      - name: windows
        type: Integer
    outcomes:
      - name: started
        moves: swarm2.orchestrator.Generation.first_tick
        instance: generation_id
        emits:
          - swarm2.orchestrator.CheckInStarted
        payload:
          swarm2.orchestrator.CheckInStarted:
            generation_id: input.generation_id
            unread: input.unread
            draft_stories: input.draft_stories
            windows: input.windows
        sets:
          windows: input.windows
        summary: The generation is Ticking; ticks becomes 1.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.GenerationStateConflict
        summary: Only a Seeded generation takes a first tick; later ticks are CheckIn.

  # Every later `check in on your swarm` tick, in Ticking or Deferred. Steps 1–3 of AGENTS.md §1;
  # steps 4–6 are Classify and Report. The binding `CheckInStarted → swarm2.flow.StartRun
  # (orchestrator.check-in)` lives in components.yaml. `updates:` has no state guard: a check-in
  # against a Restarting or Retired generation is refused by the implementation as
  # GenerationStateConflict (prose, since only `moves:` may carry wrong_state).
  - name: swarm2.orchestrator.CheckIn
    naming:
      wire: check-in
      display: Check in on the swarm
    input:
      - name: generation_id
        type: Uuid
      - name: unread
        type: Integer
      - name: draft_stories
        type: Integer
      - name: windows
        type: Integer
    outcomes:
      - name: ticked
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.CheckInStarted
        payload:
          swarm2.orchestrator.CheckInStarted:
            generation_id: input.generation_id
            unread: input.unread
            draft_stories: input.draft_stories
            windows: input.windows
        sets:
          windows: input.windows
        summary: ticks is incremented and windows refreshed; the state is unchanged.

  # AGENTS.md §1 step 4 and WORKING-RULES.md §8: "classify, then act. Do not relay." One call per
  # window per tick. The classification IS the work; the route (step 5) follows the verdict, and
  # each event feeds one binding in components.yaml:
  #   MemberContinued    → swarm2.board.PostMessage   ("send the next step", keep)
  #   MemberIdleConfirmed → nothing                   ("nothing, and say nothing")
  #   DecisionParked     → swarm2.decision.Raise      ("one numbered binary line", park)
  #   FaultDetected      → swarm2.fault.DetectFault   ("fix it, or report it if fixing needs Timo")
  # `ref` is the member's own `--ref` from its §10 event (`decision --ref <n>`, an artifact id);
  # it is carried for the fault/decision handlers and mapped onto no event here.
  - name: swarm2.orchestrator.Classify
    naming:
      wire: classify
      display: Classify one window
    input:
      - name: generation_id
        type: Uuid
      - name: agent_id
        type: String
      - name: verdict
        type: swarm2.orchestrator.Verdict
      - name: ref
        type: Optional<String>
      - name: msg
        type: String
      - name: question
        type: Optional<String>
      - name: default_on_silence
        type: Optional<String>
      - name: kind
        type: Optional<String>
    outcomes:
      - name: continued
        when: verdict == Continue
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.MemberContinued
        payload:
          swarm2.orchestrator.MemberContinued:
            agent_id: input.agent_id
            msg: input.msg
        summary: The window finished a step and the next is implied; the next step is sent.
      - name: idle-confirmed
        when: verdict == IdleIsCorrect
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.MemberIdleConfirmed
        payload:
          swarm2.orchestrator.MemberIdleConfirmed:
            agent_id: input.agent_id
        summary: Its task is done or its assignment has nothing left; nothing is said.
      - name: decision-parked
        when: verdict == Decision
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.DecisionParked
        payload:
          swarm2.orchestrator.DecisionParked:
            agent_id: input.agent_id
            question: input.question
            default_on_silence: input.default_on_silence
        summary: Parked on something only Timo can answer; it becomes a numbered binary row.
      # The remaining variant, Fault, is the unconditional branch: ess/1 needs exactly one.
      - name: fault-detected
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.FaultDetected
        payload:
          swarm2.orchestrator.FaultDetected:
            agent_id: input.agent_id
            kind: input.kind
            msg: input.msg
        summary: Lost Enter, dead pane, usage limit, background shell gone, a stall.

  # AGENTS.md §1 step 6: "verdict first, deviations only, decisions by number. A tick where
  # everything is idle is correct produces no message." `open_decisions` are the numbers cited
  # (WORKING-RULES.md §9: "never as a paragraph"); they are the caller's to read from decisions.md.
  - name: swarm2.orchestrator.Report
    naming:
      wire: report
      display: Report the tick to Timo
    input:
      - name: generation_id
        type: Uuid
      - name: deviations
        type: Integer
      - name: open_decisions
        type: List<Integer>
      - name: text
        type: String
    outcomes:
      - name: sent
        when: deviations > 0
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.ReportSent
        payload:
          swarm2.orchestrator.ReportSent:
            generation_id: input.generation_id
            deviations: input.deviations
            text: input.text
        summary: At least one window deviated, so one message goes to Timo.
      - name: silent
        updates: swarm2.orchestrator.Generation
        instance: generation_id
        emits:
          - swarm2.orchestrator.ReportSuppressed
        payload:
          swarm2.orchestrator.ReportSuppressed:
            generation_id: input.generation_id
        summary: Every window is idle-is-correct or continuing; no message is produced.

  # The `memory tick` cron (`*/15 * * * *`, SEED.md §1) — CHARTER.md §5, in the charter's order:
  # 1 defer check → 7 defer (skipping the gate); else 2 refresh, 3 rewrite, 4 gate, 5 single-
  # coordinator check, 6 restart. The inputs are what the coordinator reads on the way: `## 2 In
  # flight to Timo` (in_flight), `- defers: N` (defers), `wc -c` (memory_bytes), coord-budget.sh's
  # exit (gate_green), the hook's TWO COORDINATORS line (two_coordinators). Steps 2–3 are the
  # coordinator's own writes and leave no mark here.
  #
  # OUTCOME ORDER IS LOAD-BEARING and read top-down, first match wins — the guards overlap by
  # design: a red gate with a question in flight still defers (§5.1 goes straight to §5.7), and
  # the 4th tick's parked restart "proceeds at step 2" (§5.7), so it passes the gate (§5.4) and
  # the single-coordinator check (§5.5) like any other restart. Reordered from the drafted design
  # (which put the defer-cap branch first) for that reason. ess/1 does not say whether outcomes
  # are ordered; recorded as a rough edge in the report.
  - name: swarm2.orchestrator.MemoryTick
    naming:
      wire: memory-tick
      display: Take the fifteen-minute memory tick
    input:
      - name: generation_id
        type: Uuid
      - name: in_flight
        type: Boolean
      - name: defers
        type: Integer
      - name: memory_bytes
        type: Integer
      - name: gate_green
        type: Boolean
      - name: two_coordinators
        type: Boolean
    outcomes:
      # §5.1 → §5.7: defers 1, 2 and 3. `defers` is the count BEFORE this tick.
      - name: deferred
        when: {all: [in_flight == true, defers < 3]}
        moves: swarm2.orchestrator.Generation.defer
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationDeferred
        payload:
          swarm2.orchestrator.GenerationDeferred:
            generation_id: input.generation_id
            defers: input.defers
        sets:
          defers: input.defers
          memory_bytes: input.memory_bytes
        summary: A question is in flight; the restart is skipped and defers is recorded as N+1.
      # §5.4 "Never restart on a red gate". A refusal: nothing moves, the file is fixed first.
      - name: held-red-gate
        when: gate_green == false
        error: swarm2.orchestrator.RedBudgetGate
        summary: coord-budget.sh is red; the generation stays where it is until the file is legal.
      # §5.5 / §6 "Never leave two coordinators running".
      - name: held-two-coordinators
        when: two_coordinators == true
        error: swarm2.orchestrator.TwoCoordinators
        summary: Another process carries CC_COORD=1; stop, tell Timo, restart nothing.
      # §5.7, the 4th tick: "the in-flight question is written into decisions.md as a numbered
      # binary row with its default-on-silence — which makes it parked rather than in flight …
      # and the restart proceeds". Binding `DeferCapReached → swarm2.decision.Raise` in
      # components.yaml parks it; the question text is `in_flight_question` on the generation.
      - name: parked-and-restarting
        when: {all: [in_flight == true, defers >= 3]}
        moves: swarm2.orchestrator.Generation.restart
        instance: generation_id
        emits:
          - swarm2.orchestrator.DeferCapReached
        payload:
          swarm2.orchestrator.DeferCapReached:
            generation_id: input.generation_id
            defers: input.defers
        sets:
          defers: input.defers
          memory_bytes: input.memory_bytes
          memory_gate_green: input.gate_green
        summary: The hard cap of 3 defers is reached; the question is parked and the restart runs.
      # §5.6: `swarm/bin/coord-restart.sh`. "It clears the session; the hook reseeds it."
      - name: restarting
        moves: swarm2.orchestrator.Generation.restart
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationRestarting
        payload:
          swarm2.orchestrator.GenerationRestarting:
            generation_id: input.generation_id
        sets:
          memory_bytes: input.memory_bytes
          memory_gate_green: input.gate_green
        summary: Nothing in flight, gate green, one coordinator; the restart keystroke is queued.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.GenerationStateConflict
        summary: Only a Ticking or Deferred generation takes a memory tick.

  # `## 2 In flight to Timo` is empty again: Timo answered in his window, or the item became a
  # numbered row ("an item leaves only by being answered, or by becoming a numbered row in
  # decisions.md", the section's own eviction rule). Clearing in_flight_question to null is the
  # implementation's (`sets:` maps input fields only).
  - name: swarm2.orchestrator.Resume
    naming:
      wire: resume
      display: Resume ticking after a defer
    input:
      - name: generation_id
        type: Uuid
    outcomes:
      - name: resumed
        moves: swarm2.orchestrator.Generation.resume
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationResumed
        payload:
          swarm2.orchestrator.GenerationResumed:
            generation_id: input.generation_id
        summary: Nothing is in flight; defers resets to 0 and the next memory tick may restart.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.GenerationStateConflict
        summary: Only a Deferred generation resumes.

  # The `/clear` landed at a turn boundary (coord-restart.sh "WHY IT WAITS") and the previous
  # transcript "is gone on purpose" (coordinator-seed.py). Binding `GenerationRetired → Seed` in
  # components.yaml seeds number+1 into the same run — what the hook does on `source=clear`.
  - name: swarm2.orchestrator.Retire
    naming:
      wire: retire
      display: Retire a restarting generation
    input:
      - name: generation_id
        type: Uuid
    outcomes:
      - name: retired
        moves: swarm2.orchestrator.Generation.retire
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationRetired
        payload:
          swarm2.orchestrator.GenerationRetired:
            generation_id: input.generation_id
        summary: The generation is over; retired_at is stamped and the successor is seeded.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.GenerationStateConflict
        summary: Only a Restarting generation retires; a dead one is aborted.

  # The generation died rather than restarted: usage limit, killed pane, process exit
  # (WORKING-RULES.md §8 fault row). `reason` is free text because no source enumerates the ways.
  # UNMAPPED: who records the death. coordinator-seed.py overwrites ACTIVE on `startup` and
  # compares nothing with the previous pid; no script today notices a dead predecessor. The
  # SeedHook is given `Abort` because it is the first thing that runs after the death, not
  # because any source says so.
  - name: swarm2.orchestrator.Abort
    naming:
      wire: abort
      display: Abort a dead generation
    input:
      - name: generation_id
        type: Uuid
      - name: reason
        type: String
    outcomes:
      - name: aborted
        moves: swarm2.orchestrator.Generation.abort
        instance: generation_id
        emits:
          - swarm2.orchestrator.GenerationAborted
        payload:
          swarm2.orchestrator.GenerationAborted:
            generation_id: input.generation_id
            reason: input.reason
        summary: The generation is Retired without a successor being seeded by this domain.
      - name: wrong-state
        wrong_state: true
        error: swarm2.orchestrator.GenerationStateConflict
        summary: The generation was already Retired, so nothing moved.

events:
  # Emitted by NO outcome: it is the `escalate` event of a binding in components.yaml (the binding retired-generation-is-reseeded could not seed the next generation).
  # An escalation nobody declared would be a silence; this is the fact instead (WakeLost precedent).
  - name: swarm2.orchestrator.SeedFailed
    fields:
      - name: run_id
        type: Uuid
  # Emitted by NO outcome: it is the `escalate` event of a binding in components.yaml (the binding open-run-on-start could not open a run for a started swarm).
  # An escalation nobody declared would be a silence; this is the fact instead (WakeLost precedent).
  - name: swarm2.orchestrator.RunOpenFailed
    fields:
      - name: swarm_id
        type: Uuid
  # Emitted by NO outcome: it is the `escalate` event of a binding in components.yaml (the binding memory-tick could not deliver the tick).
  # An escalation nobody declared would be a silence; this is the fact instead (WakeLost precedent).
  - name: swarm2.orchestrator.TickLost
    fields:
      - name: cron_id
        type: Uuid
  - name: swarm2.orchestrator.RunOpened
    fields:
      - name: run_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
  - name: swarm2.orchestrator.RunClosed
    fields:
      - name: run_id
        type: Uuid
  - name: swarm2.orchestrator.GenerationSeeded
    fields:
      - name: generation_id
        type: Uuid
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
      - name: windows
        type: Integer
  # Emitted by both FirstTick and CheckIn; the binding to `swarm2.flow.StartRun` does not care
  # which. Carries the three counts of AGENTS.md §1 steps 1–3.
  - name: swarm2.orchestrator.CheckInStarted
    fields:
      - name: generation_id
        type: Uuid
      - name: unread
        type: Integer
      - name: draft_stories
        type: Integer
      - name: windows
        type: Integer
  - name: swarm2.orchestrator.MemberContinued
    fields:
      - name: agent_id
        type: String
      - name: msg
        type: String
  - name: swarm2.orchestrator.MemberIdleConfirmed
    fields:
      - name: agent_id
        type: String
  # `question` and `default_on_silence` are what a numbered binary row needs (CHARTER.md §5.7
  # "a numbered binary row with its default-on-silence"). Optional, matching the input: mapping
  # an `Optional<String>` input onto a `String` event field is refused (ESS-COMMAND-002
  # type_mismatch, 2026-09-11) unless a `conversions:` entry with a `because:` is declared in
  # components.yaml — the integrator's file, not this one. A Decision verdict without them is
  # therefore refused by `swarm2.decision.Raise`'s own input, not here.
  - name: swarm2.orchestrator.DecisionParked
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: question
        type: Optional<String>
      - name: default_on_silence
        type: Optional<String>
  # `kind` is Optional for the same ESS-COMMAND-002 reason as DecisionParked above: "lost Enter,
  # dead pane, usage limit, background shell gone, a stall" (WORKING-RULES.md §8) is a list, not
  # an enum any source closes, and a fault whose kind is not yet known is still a fault.
  - name: swarm2.orchestrator.FaultDetected
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: Optional<String>
      - name: msg
        type: String
  - name: swarm2.orchestrator.ReportSent
    fields:
      - name: generation_id
        type: Uuid
      - name: deviations
        type: Integer
      - name: text
        type: String
  - name: swarm2.orchestrator.ReportSuppressed
    fields:
      - name: generation_id
        type: Uuid
  - name: swarm2.orchestrator.DeferCapReached
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: generation_id
        type: Uuid
      - name: defers
        type: Integer
  - name: swarm2.orchestrator.GenerationDeferred
    fields:
      - name: generation_id
        type: Uuid
      - name: defers
        type: Integer
  - name: swarm2.orchestrator.GenerationRestarting
    fields:
      - name: generation_id
        type: Uuid
  - name: swarm2.orchestrator.GenerationResumed
    fields:
      - name: generation_id
        type: Uuid
  # Carries `run_id` and `number` although the input has only the id: the binding to `Seed`
  # needs both to seed number+1 into the same run, and a binding maps one event field per input.
  - name: swarm2.orchestrator.GenerationRetired
    fields:
      # The retiring generation's memory file size — `seeded_from_bytes` of the next one.
      - name: memory_bytes
        type: Integer
      # Added at integration: what the next generation is seeded with (the binding retired-generation-is-reseeded maps these two into Seed).
      - name: windows
        type: Integer
      - name: generation_id
        type: Uuid
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
  - name: swarm2.orchestrator.GenerationAborted
    fields:
      - name: generation_id
        type: Uuid
      - name: reason
        type: String

views:
  # The one the arrival line and every tick read. `state == Ticking` is the one equality ess/1
  # allows, so a Deferred generation is NOT in this view — read `Generations` for it.
  - name: swarm2.orchestrator.CurrentGeneration
    source: swarm2.orchestrator.Generation
    consistency: read_your_writes
    filter: state == Ticking
    fields:
      - name: generation_id
        type: Uuid
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
      - name: session_id
        type: Optional<String>
      - name: windows
        type: Integer
      - name: defers
        type: Integer
      - name: memory_bytes
        type: Integer
      - name: memory_gate_green
        type: Boolean
      - name: in_flight_question
        type: Optional<String>
      - name: ticks
        type: Integer
      - name: seeded_at
        type: Timestamp
    naming:
      wire: current
      display: The generation that is ticking

  - name: swarm2.orchestrator.Generations
    source: swarm2.orchestrator.Generation
    consistency: eventual
    order_by:
      - number desc
    fields:
      - name: generation_id
        type: Uuid
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
      - name: session_id
        type: Optional<String>
      - name: seeded_from_bytes
        type: Integer
      - name: defers
        type: Integer
      - name: ticks
        type: Integer
      - name: seeded_at
        type: Timestamp
      - name: retired_at
        type: Optional<Timestamp>
    naming:
      wire: generations
      display: Every generation, newest first

  - name: swarm2.orchestrator.OpenRuns
    source: swarm2.orchestrator.Run
    consistency: read_your_writes
    filter: state == Open
    fields:
      - name: run_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: record_dir
        type: String
      - name: opened_at
        type: Timestamp
      - name: generation_count
        type: Integer
    naming:
      wire: open-runs
      display: Runs that are open

  - name: swarm2.orchestrator.RunById
    source: swarm2.orchestrator.Run
    consistency: eventual
    fields:
      - name: run_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: name
        type: String
      - name: record_dir
        type: String
      - name: opened_at
        type: Timestamp
      - name: closed_at
        type: Optional<Timestamp>
      - name: generation_count
        type: Integer
    naming:
      wire: run-by-id
      display: One run, whole

  - name: swarm2.orchestrator.GenerationById
    source: swarm2.orchestrator.Generation
    consistency: eventual
    fields:
      - name: generation_id
        type: Uuid
      - name: run_id
        type: Uuid
      - name: number
        type: Integer
      - name: session_id
        type: Optional<String>
      - name: seeded_from_bytes
        type: Integer
      - name: windows
        type: Integer
      - name: defers
        type: Integer
      - name: memory_bytes
        type: Integer
      - name: memory_gate_green
        type: Boolean
      - name: in_flight_question
        type: Optional<String>
      - name: seeded_at
        type: Timestamp
      - name: retired_at
        type: Optional<Timestamp>
      - name: ticks
        type: Integer
    naming:
      wire: generation-by-id
      display: One generation, whole

actors:
  # `.claude/hooks/coordinator-seed.py`, SessionStart on `startup` and `clear`. Seeds. `Abort` is
  # assigned here by design, not by a source — see the UNMAPPED note on that command.
  - name: swarm2.orchestrator.SeedHook
    may:
      - swarm2.orchestrator.Seed
      - swarm2.orchestrator.Abort
    naming:
      display: Seed hook
  # The generation itself, acting on its two crons and on what Timo types.
  - name: swarm2.orchestrator.Coordinator
    may:
      - swarm2.orchestrator.OpenRun
      - swarm2.orchestrator.CloseRun
      - swarm2.orchestrator.FirstTick
      - swarm2.orchestrator.CheckIn
      - swarm2.orchestrator.Classify
      - swarm2.orchestrator.Report
      - swarm2.orchestrator.MemoryTick
      - swarm2.orchestrator.Resume
      - swarm2.orchestrator.Retire
    naming:
      display: Coordinator
  # In the picture, permitted nothing here: "Timo himself, typed into your own window. He outranks
  # the orchestrator" (AGENTS.md §2 exception 1) — what he types is an order the coordinator acts
  # on, not a command of this domain. His answers land in swarm2.decision.
  - name: swarm2.orchestrator.Timo
    naming:
      display: Timo
