# swarm2.schedule — the schedulers: one wake gate per agent window, and the orchestrator's two
# standing crons.
#
# ess/1 has NO timer or scheduler construct (grep of the ess crates, 2026-09-11). A scheduler is
# therefore modelled as three ordinary things: an actor `swarm2.schedule.Clock` that issues
# `Evaluate` (waked.sh's 60 s tick, once per enrolled gate) and `Fire` (a cron firing); commands
# whose outcomes emit events; and bindings in components.yaml (the integrator's file) that route
#   swarm2.schedule.GateFired     -> swarm2.agent.Wake
#   swarm2.schedule.CheckInTicked -> swarm2.orchestrator.CheckIn
#   swarm2.schedule.MemoryTicked  -> swarm2.orchestrator.MemoryTick
# The cadence itself — the poll period, the two cron lines, the interval floor, the idle
# heartbeat, the 7-day expiry — is a VALUE and lives in `swarm2.config.Schedules` (config.yaml).
# Nothing here repeats a number; a per-gate field below is the value one conf sets, and its
# default is the config's.
#
# Why a gate and not a timer (swarm/docs/wake-gate.md, Finding 1): an idle loop pass costs about
# a quarter of a million cache-read tokens and "grows" with the session's age; eleven windows at
# one pass a minute would be "4.2x the swarm's entire cache-read volume, to produce nothing".
# "The schedule is the defect, not the mechanism carrying it." wakegate.sh is the condition
# ("~10 ms, zero tokens"); waked.sh "polls it every 60 s ... and nudges only on WAKE". The two
# crons stay because they are the coordinator's own (swarm/coordinator/SEED.md §1) and
# "CronList and CronDelete are session-only" (wake-gate.md, "Stopping") — nobody else can hold or
# remove them, so the record here is what the orchestrator is told to reconcile against.
domain: swarm2.schedule

summary: The schedulers — a wake gate per agent that fires on a transition rather than a timer, and the orchestrator's two standing crons, each a record the clock ticks and a binding turns into a wake.

naming:
  wire: schedule
  display: Schedulers

types:
  # The two jobs SEED.md §1 tells a fresh coordinator generation to recreate, "CronList first,
  # then create only what is missing": `*/1 * * * *` "check in on your swarm" (the §8 check-in
  # loop) and `*/15 * * * *` "memory tick" (the cycle in CHARTER.md §5).
  - name: swarm2.schedule.Job
    kind: enum
    variants: [CheckIn, MemoryTick]
    naming:
      display: Cron job

  # The two words wakegate.sh prints — USAGE: `print "WAKE <reason>" (exit 0) or "SLEEP <reason>"
  # (exit 1)`. The outcome names of `Evaluate` are these two; the per-slug `verdict` in
  # gate-state.json (`waked.sh status --json`) is this enum. Declared so a projection has it.
  - name: swarm2.schedule.Verdict
    kind: enum
    variants: [Wake, Sleep]
    naming:
      display: Gate verdict

  # One WAKE_SIGNAL line, named. wakegate.sh CONFIG: "shell printing a QUANTISED signal. Fed on
  # stdin, not `bash -c`, so the script's own text is not in a cmdline `pgrep -f` can see."
  # improver.conf numbers its signals 1..4 in prose ("its four, in its words"); `name` is that
  # label, `script` the shell that prints the state word.
  - name: swarm2.schedule.Signal
    kind: struct
    fields:
      - name: name
        type: String
      - name: script
        type: String

  # What `--arm` and `--woke` record. wakegate.sh: the state file is "line 1 epoch of last wake,
  # line 2 signal, line 3 file-signal". Both digests Optional: a rules-only enrolment has "no
  # WAKE_SIGNAL, so it is an edge trigger and not a loop" (agent-loop.conf), and a gate with no
  # WAKE_FILES has no file line.
  - name: swarm2.schedule.Stamp
    kind: struct
    fields:
      - name: signal_digest
        type: Optional<String>
      - name: files_digest
        type: Optional<String>
      - name: at
        type: Timestamp

entities:
  # One gate per agent window — `swarm/wake.d/<slug>.conf`. wake-gate.md, Finding 2: "One config
  # file per window, written from one place. The window is consulted once or not at all."
  - name: swarm2.schedule.WakeGate
    identity:
      name: gate_id
      type: Uuid
    fields:
      # The swarm whose waked.sh polls this gate. A gate has no meaning without its swarm, so the
      # edge is `owns` and belongs on the owner, in manager.yaml, which this file does not own:
      # DEFERRED-RELATION: {name: gates, kind: owns, target: swarm2.schedule.WakeGate, cardinality: many, via: swarm_id}
      - name: swarm_id
        type: Uuid
      # The agent it wakes: the conf's slug. waked.sh re-reads the window's NAME every tick and
      # "refuses if it is no longer the slug, because indices are reused ... and a stale index would
      # nudge a stranger". One gate per agent is prose plus `GateAlreadyEnrolled`: today the conf
      # file name IS the slug, so the filesystem allows one. The edge to the agent domain is
      # DEFERRED-RELATION: {name: agent, kind: references, target: swarm2.agent.Agent, cardinality: one, via: agent_id}
      - name: agent_id
        type: String
      # WAKE_SIGNAL, split into named lines. Empty for a rules-only enrolment (agent-loop.conf).
      - name: signals
        type: List<swarm2.schedule.Signal>
      # WAKE_FILES — "paths whose mtime change always wakes, regardless of WAKE_ONLY_IF". Compared
      # by nanosecond mtime and size, "not %Y: stat -c %Y has 1-second granularity". A path that
      # stops existing "stats to the constant `missing`, which fires one spurious WAKE and then
      # never changes again" (improver.conf, wakegate.sh).
      - name: watched_files
        type: List<String>
      # WAKE_ONLY_IF — "optional. A CHANGED signal wakes only if the NEW value matches. This is how
      # 'wake when it goes to 0, not when it leaves 0' is said. WAKE_FILES is not subject to it."
      # agent-loop.conf: 'unread:[1-9]|card:(stale|failing|absent|unreadable)'.
      - name: only_if
        type: Optional<String>
      # WAKE_MIN_INTERVAL — "floor between wakes, so a flapping signal cannot spam a window". Every
      # enrolled conf sets the same value; the default is
      # `swarm2.config.Schedules.wake_min_interval_seconds`.
      - name: min_interval_seconds
        type: Integer
      # WAKE_MAX_IDLE — "fallback heartbeat in seconds; 0 disables it. Default 0 — window 5, 11:38:
      # 'a fallback only helps if the poller dies silently, and a poller that dies is a fault event
      # to catch'". Every enrolled conf sets 0; the default is
      # `swarm2.config.Schedules.wake_max_idle_seconds`.
      - name: max_idle_seconds
        type: Integer
      # WAKE_PROMPT — "what gets typed when it is woken". waked.sh appends the verdict's reason:
      # "The verdict string carries the file's mtime and size, and waked.sh appends it to this
      # prompt" (agent-loop.conf). Every conf ends the prompt with "Reason: " for that.
      - name: prompt
        type: String
      # What --arm / --woke last recorded. None until the first stamp, and "Enrolment is not
      # retroactive" (wake-gate.md): "before enrolment it recorded nothing, so there is no 'before'
      # for the first edit to differ from." The current contents are adopted, not delivered.
      - name: last_stamp
        type: Optional<swarm2.schedule.Stamp>
      # The epoch the gate last woke its window, lifted out of the stamp for the views. Written
      # on `fire`; `--arm` writes it back by WAKE_MIN_INTERVAL ("record $(( now - WAKE_MIN_INTERVAL ))")
      # so the floor does not hold back the next real wake.
      - name: last_fired_at
        type: Optional<Timestamp>
      - name: enrolled_at
        type: Timestamp
    invariants:
      - min_interval_seconds >= 0
      - max_idle_seconds >= 0
    relations:
      # Declared here at integration (the file's DEFERRED-RELATION above): `references`, and its
      # `via` lives on this side, because the agent outlives its gate — a gate is disabled and
      # re-enrolled while the role keeps running.
      - name: agent
        kind: references
        target: swarm2.agent.Agent
        cardinality: one
        via: agent_id
    lifecycle:
      # Armed: the stamp is current and the next tick may fire. Fired: WAKE was delivered — "A wake
      # is stamped only after delivery is proven, and 'proven' means the nudge tool's exit code"
      # (wake-gate.md) — and the window has not yet ended its pass with `--arm <files you wrote>`.
      # Disabled: terminal; `<slug>.off` touched or the conf removed ("that slug is no longer
      # enrolled"). The blanket `DISABLED` file ("every slug sleeps") is the swarm being Paused in
      # swarm2.manager, not a state of any one gate.
      #
      # Rough edge, on purpose: wakegate.sh itself has no Fired state — after a wake it SLEEPs
      # "min-interval" and then wakes again on the next change, delivered or not. The Fired state
      # here is the design's: one wake per pass, the window re-arms when it is done, and a second
      # WAKE inside a pass is a `wrong-state` refusal rather than a queued nudge.
      initial: Armed
      states: [Armed, Fired, Disabled]
      terminal: [Disabled]
      transitions:
        - name: fire
          from: [Armed]
          to: Fired
        # From Fired: the end-of-pass `--arm <file>...`. From Armed: the selective `--arm` that
        # adopts a signal without waking — "so a window that edits its own watched file does not
        # get its own edit fired back" (wake-gate.md, "The retasking race"). Armed -> Armed is a
        # self-transition; if ess/1 refuses it the report says what replaced it.
        - name: arm
          from: [Fired, Armed]
          to: Armed
        - name: disable
          from: [Armed, Fired]
          to: Disabled

  # The coordinator's two standing ticks (SEED.md §1). `CronCreate` jobs are session-only — the
  # tool result says "not written to disk, dies when Claude exits", and `durable: true` "Has no
  # effect" (cron-prompts.md) — so a Cron here is the manager's record of what the orchestrator
  # was told to hold, and "CronList first, then create only what is missing. Two duplicate ticks
  # are worse than a late one" is how record and session are reconciled after a restart.
  - name: swarm2.schedule.Cron
    identity:
      name: cron_id
      type: Uuid
    fields:
      # DEFERRED-RELATION: {name: crons, kind: owns, target: swarm2.schedule.Cron, cardinality: many, via: swarm_id}
      - name: swarm_id
        type: Uuid
      # The orchestrator's slug (WORKING-RULES §4: "The coordinator is `orchestrator` / `main`").
      # Only that session can list or delete the cron: "A window's own cron is not stoppable by
      # anyone but that window" (wake-gate.md, "Stopping").
      - name: agent_id
        type: String
      - name: job
        type: swarm2.schedule.Job
      # The five-field cron line, `*/1 * * * *` or `*/15 * * * *` (SEED.md §1). The value is
      # `swarm2.config.Schedules.check_in_cron` / `memory_tick_cron`.
      - name: expression
        type: String
      # What the fire types: "check in on your swarm" / "memory tick". Plain text arrives as a
      # `user` record carrying `scheduledTaskId`; a `/<built-in>` such as `/clear` arrives as "the
      # literal string ... Nothing is executed" — "a cron cannot reset a session" (cron-prompts.md).
      - name: prompt
        type: String
      # "Both are recurring and both auto-expire after 7 days" (SEED.md §1) —
      # `swarm2.config.Schedules.cron_ttl_days`.
      - name: ttl_days
        type: Integer
      - name: created_at
        type: Timestamp
      # "Jobs fire only while the REPL is idle. A fire that lands mid-turn waits for the turn to
      # end" (cron-prompts.md) — so this is the delivery time, not the schedule's.
      - name: last_fired_at
        type: Optional<Timestamp>
      - name: fired_count
        type: Integer
    invariants:
      - ttl_days > 0
      - fired_count >= 0
    relations:
      # The orchestrator whose session holds the cron (integration, see DEFERRED-RELATION above).
      - name: agent
        kind: references
        target: swarm2.agent.Agent
        cardinality: one
        via: agent_id
    lifecycle:
      # Scheduled: held by the orchestrator's session. Cancelled: `CronDelete` by that session
      # (a Paused swarm cancels both, manager.yaml). Expired: the harness's own 7-day expiry.
      # Both terminal — a tick is recreated, never revived.
      initial: Scheduled
      states: [Scheduled, Cancelled, Expired]
      terminal: [Cancelled, Expired]
      transitions:
        - name: cancel
          from: [Scheduled]
          to: Cancelled
        - name: expire
          from: [Scheduled]
          to: Expired

errors:
  - name: swarm2.schedule.GateStateConflict
    summary: The gate is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.schedule.WakeGate.State
  - name: swarm2.schedule.CronStateConflict
    summary: The cron is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.schedule.Cron.State
  # Raised by the implementation of `Enrol` when the agent already has a gate that is not
  # Disabled. Not an outcome: "a row exists" is a lookup, not a function of the input
  # (ESS-COMMAND-003; the same limit `swarm2.manager.SwarmSessionTaken` documents).
  - name: swarm2.schedule.GateAlreadyEnrolled
    summary: This agent already has a live wake gate, so nothing was created.
    fields:
      - name: agent_id
        type: String

commands:
  # Writing `swarm/wake.d/<slug>.conf`. "One config file per window, written from one place"
  # (wake-gate.md). The current contents of every watched file are adopted at enrolment, not
  # delivered: "Enrol, then treat the next change as the first one covered."
  - name: swarm2.schedule.Enrol
    naming:
      wire: enrol
      display: Enrol an agent's wake gate
    input:
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: signals
        type: List<swarm2.schedule.Signal>
      - name: watched_files
        type: List<String>
      - name: only_if
        type: Optional<String>
      - name: min_interval_seconds
        type: Integer
      - name: max_idle_seconds
        type: Integer
      - name: prompt
        type: String
    outcomes:
      - name: enrolled
        creates: swarm2.schedule.WakeGate
        instance: gate_id
        emits:
          - swarm2.schedule.GateEnrolled
        payload:
          swarm2.schedule.GateEnrolled:
            swarm_id: input.swarm_id
            agent_id: input.agent_id
        sets:
          swarm_id: input.swarm_id
          agent_id: input.agent_id
          signals: input.signals
          watched_files: input.watched_files
          only_if: input.only_if
          min_interval_seconds: input.min_interval_seconds
          max_idle_seconds: input.max_idle_seconds
          prompt: input.prompt
        summary: The gate exists in Armed with no stamp; the next tick evaluates it.

  # One tick of waked.sh for one gate: `wakegate.sh <slug>` decides, ~10 ms, zero tokens. The
  # Clock computes the five facts from the gate's stamp and the live signals BEFORE calling,
  # because a `when` reads input only (ESS-COMMAND-003): `interval_elapsed` is
  # now - last_fired_at >= min_interval_seconds (true when never fired); `files_changed` is the
  # WAKE_FILES mtime:size digest differing from the stamp; `signal_changed` is the WAKE_SIGNAL
  # output differing; `only_if_matched` is the NEW signal matching WAKE_ONLY_IF, and true when
  # the gate has none ("No WAKE_ONLY_IF: window 6 asked for 'any is true'", improver.conf);
  # `idle_exceeded` is max_idle_seconds > 0 and the idle age past it (the "heartbeat" verdict).
  # The order mirrors wakegate.sh: the floor first, then files, then signal, then heartbeat.
  # `WAKE_FORCE_IF` ("exit 0 forces a wake") is not modelled: no enrolled conf sets it.
  # A `Fired` gate is not evaluated again until the window re-arms it: that is `wrong-state`,
  # where the script would SLEEP "min-interval" and then queue another nudge.
  - name: swarm2.schedule.Evaluate
    naming:
      wire: evaluate
      display: Evaluate a wake gate (one poll tick)
    input:
      - name: gate_id
        type: Uuid
      - name: signal_changed
        type: Boolean
      - name: files_changed
        type: Boolean
      - name: interval_elapsed
        type: Boolean
      - name: only_if_matched
        type: Boolean
      - name: idle_exceeded
        type: Boolean
    outcomes:
      # WAKE. A changed signal wakes only through its WAKE_ONLY_IF; a changed file wakes on its
      # own ("WAKE_FILES is not subject to it"); the heartbeat wakes on its own; and nothing
      # wakes inside the interval floor.
      - name: fired
        when:
          all:
            - interval_elapsed == true
            - any:
                - all:
                    - signal_changed == true
                    - only_if_matched == true
                - files_changed == true
                - idle_exceeded == true
        moves: swarm2.schedule.WakeGate.fire
        instance: gate_id
        emits:
          - swarm2.schedule.GateFired
        payload:
          swarm2.schedule.GateFired:
            gate_id: input.gate_id
        summary: >-
          WAKE. The stamp is recorded with the wake time (`--woke`, only after the nudge is
          accepted) and a binding wakes the agent with the prompt plus the reason.
      # SLEEP. The gate is updated even so: a changed-but-unmatched signal is adopted "so it is
      # not re-evaluated forever" (wakegate.sh, `signal-changed-but-not-matched`), and waked.sh
      # rewrites gate-state.json every tick with the ticks since the last wake and `stale` once
      # that passes WAKE_STALE_TICKS. What is adopted is not an input field, so no `sets:`.
      - name: slept
        updates: swarm2.schedule.WakeGate
        instance: gate_id
        emits:
          - swarm2.schedule.GateSlept
        payload:
          swarm2.schedule.GateSlept:
            gate_id: input.gate_id
        summary: SLEEP. Nothing is typed; an unmatched signal change is adopted; the tick counter advances.
      - name: wrong-state
        wrong_state: true
        error: swarm2.schedule.GateStateConflict
        summary: The gate is Fired (the pass has not ended) or Disabled, so no wake is issued.

  # `wakegate.sh <slug> --arm <files you wrote>` at the end of a pass, or the selective adopt
  # without waking. The window names the files it wrote; "Anything else that moved stays
  # un-adopted and wakes on the next tick." The blanket form "REFUSES when a watched file has
  # actually moved" unless it is the first enrolment — a lookup against the stamp, so that
  # refusal is the implementation's, not an outcome.
  - name: swarm2.schedule.Arm
    naming:
      wire: arm
      display: Arm a wake gate (adopt the current signals)
    input:
      - name: gate_id
        type: Uuid
      - name: stamp
        type: swarm2.schedule.Stamp
    outcomes:
      - name: armed
        moves: swarm2.schedule.WakeGate.arm
        instance: gate_id
        emits:
          - swarm2.schedule.GateArmed
        payload:
          swarm2.schedule.GateArmed:
            gate_id: input.gate_id
        sets:
          last_stamp: input.stamp
        summary: The stamp is what the window handed in; the next difference from it is the next wake.
      - name: wrong-state
        wrong_state: true
        error: swarm2.schedule.GateStateConflict
        summary: A Disabled gate is not re-armed; enrol it again.

  # `touch swarm/runs/<run>/wake/<slug>.off` or `rm swarm/wake.d/<slug>.conf` — "none of which
  # needs a model" (wakegate.sh, STOPPING). The source also says "A window can throw the first
  # three itself"; the actor list below gives Disable to the Orchestrator only, per the design.
  - name: swarm2.schedule.Disable
    naming:
      wire: disable
      display: Disable a wake gate
    input:
      - name: gate_id
        type: Uuid
    outcomes:
      - name: disabled
        moves: swarm2.schedule.WakeGate.disable
        instance: gate_id
        emits:
          - swarm2.schedule.GateDisabled
        payload:
          swarm2.schedule.GateDisabled:
            gate_id: input.gate_id
        summary: The poller skips this slug from the next tick on; the record stays.
      - name: wrong-state
        wrong_state: true
        error: swarm2.schedule.GateStateConflict
        summary: The gate was already Disabled.

  # The coordinator's `CronCreate`, after `CronList` says the job is missing (SEED.md §1). The
  # "no duplicate tick" rule is a lookup against ScheduledCrons, so it is prose here: the
  # orchestrator lists first and schedules only what is absent.
  - name: swarm2.schedule.Schedule
    naming:
      wire: schedule
      display: Schedule a cron
    input:
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: job
        type: swarm2.schedule.Job
      - name: expression
        type: String
      - name: prompt
        type: String
      - name: ttl_days
        type: Integer
    outcomes:
      - name: scheduled
        creates: swarm2.schedule.Cron
        instance: cron_id
        emits:
          - swarm2.schedule.CronScheduled
        payload:
          swarm2.schedule.CronScheduled:
            swarm_id: input.swarm_id
            agent_id: input.agent_id
            job: input.job
        sets:
          swarm_id: input.swarm_id
          agent_id: input.agent_id
          job: input.job
          expression: input.expression
          prompt: input.prompt
          ttl_days: input.ttl_days
        summary: The cron exists in Scheduled with fired_count 0; the harness holds the live copy.

  # A `scheduled_task_fire` (cron-prompts.md: "announced in the transcript as `type: "system",
  # subtype: "scheduled_task_fire"` immediately before the `user` record"). `job` is an input
  # because a `when` cannot read the row: the Clock passes the cron's own job back in. Two
  # outcomes, one per variant — `check-in` guarded, `memory-tick` the catch-all. Firing a
  # Cancelled or Expired cron is refused by the implementation with `CronStateConflict`; the
  # Clock reads ScheduledCrons and never asks.
  - name: swarm2.schedule.Fire
    naming:
      wire: fire
      display: Fire a cron
    input:
      - name: cron_id
        type: Uuid
      - name: job
        type: swarm2.schedule.Job
    outcomes:
      - name: check-in
        when: job == CheckIn
        updates: swarm2.schedule.Cron
        instance: cron_id
        emits:
          - swarm2.schedule.CheckInTicked
        payload:
          swarm2.schedule.CheckInTicked:
            cron_id: input.cron_id
        summary: fired_count and last_fired_at advance; a binding runs the orchestrator's check-in.
      - name: memory-tick
        updates: swarm2.schedule.Cron
        instance: cron_id
        emits:
          - swarm2.schedule.MemoryTicked
        payload:
          swarm2.schedule.MemoryTicked:
            cron_id: input.cron_id
        summary: fired_count and last_fired_at advance; a binding runs the orchestrator's memory tick.

  # `CronDelete`, by the session that owns it — no one else can (wake-gate.md, "Stopping").
  - name: swarm2.schedule.Cancel
    naming:
      wire: cancel
      display: Cancel a cron
    input:
      - name: cron_id
        type: Uuid
    outcomes:
      - name: cancelled
        moves: swarm2.schedule.Cron.cancel
        instance: cron_id
        emits:
          - swarm2.schedule.CronCancelled
        payload:
          swarm2.schedule.CronCancelled:
            cron_id: input.cron_id
        summary: The tick is gone from the session and the record is closed.
      - name: wrong-state
        wrong_state: true
        error: swarm2.schedule.CronStateConflict
        summary: Only a Scheduled cron can be cancelled.

  # The harness's own expiry — "both auto-expire after 7 days" (SEED.md §1). The Clock records
  # it; the next generation's `CronList` then finds the job missing and schedules it again.
  - name: swarm2.schedule.Expire
    naming:
      wire: expire
      display: Expire a cron
    input:
      - name: cron_id
        type: Uuid
    outcomes:
      - name: expired
        moves: swarm2.schedule.Cron.expire
        instance: cron_id
        emits:
          - swarm2.schedule.CronExpired
        payload:
          swarm2.schedule.CronExpired:
            cron_id: input.cron_id
        summary: The record says the harness dropped the job; nothing here recreates it.
      - name: wrong-state
        wrong_state: true
        error: swarm2.schedule.CronStateConflict
        summary: Only a Scheduled cron can expire.

events:
  - name: swarm2.schedule.GateEnrolled
    fields:
      - name: gate_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
  # `reason` is the verdict string wakegate.sh prints after WAKE — `files-changed:<name>:<mtime>:<size>`,
  # `signal-changed:<signal>`, `heartbeat <age>s>=<max>s` — and waked.sh appends it to the prompt.
  # `agent_id` is resolved from the gate, not carried by the input: the binding to
  # `swarm2.agent.Wake` maps one event field per input and needs the agent.
  - name: swarm2.schedule.GateFired
    fields:
      - name: gate_id
        type: Uuid
      - name: agent_id
        type: String
      - name: reason
        type: String
  - name: swarm2.schedule.GateSlept
    fields:
      - name: gate_id
        type: Uuid
  - name: swarm2.schedule.GateArmed
    fields:
      - name: gate_id
        type: Uuid
  - name: swarm2.schedule.GateDisabled
    fields:
      - name: gate_id
        type: Uuid
  # Emitted by NO outcome here. It is the `escalate` event of the components.yaml binding
  # `GateFired -> swarm2.agent.Wake`: a nudge that "typed nothing anywhere" (nudge.sh rc 2 —
  # "win 99 gone - nothing typed") is retried, not consumed, and when the retries are spent the
  # binding raises this rather than let the gate stand stamped "as though the window had been
  # told" (wake-gate.md, "A wake must not be consumed by a nudge that typed nothing").
  - name: swarm2.schedule.WakeLost
    fields:
      - name: gate_id
        type: Uuid
      - name: agent_id
        type: String
  - name: swarm2.schedule.CronScheduled
    fields:
      - name: cron_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: job
        type: swarm2.schedule.Job
  # Both tick events carry `agent_id` (resolved from the cron) so the binding can address the
  # orchestrator's command without a second lookup.
  - name: swarm2.schedule.CheckInTicked
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: cron_id
        type: Uuid
      - name: agent_id
        type: String
  - name: swarm2.schedule.MemoryTicked
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: cron_id
        type: Uuid
      - name: agent_id
        type: String
  - name: swarm2.schedule.CronCancelled
    fields:
      - name: cron_id
        type: Uuid
  - name: swarm2.schedule.CronExpired
    fields:
      - name: cron_id
        type: Uuid

views:
  # What waked.sh iterates each tick: `wakegate.sh --list` minus the `.off` slugs.
  - name: swarm2.schedule.ArmedGates
    source: swarm2.schedule.WakeGate
    consistency: read_your_writes
    filter: state == Armed
    fields:
      - name: gate_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: last_fired_at
        type: Optional<Timestamp>
    naming:
      wire: armed
      display: Gates the next tick evaluates

  # Fired and not yet re-armed: the window's pass has not finished. This is what `stale` in
  # gate-state.json is read against — "a window waiting on a signal nobody writes is
  # indistinguishable from a window that is done", and a Fired gate whose window went quiet
  # without emitting `idle` is the "continue + stale: true = Fault" row (wake-gate.md).
  - name: swarm2.schedule.FiredGates
    source: swarm2.schedule.WakeGate
    consistency: read_your_writes
    filter: state == Fired
    fields:
      - name: gate_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: last_fired_at
        type: Optional<Timestamp>
    naming:
      wire: fired
      display: Gates whose window is mid-pass

  # `wakegate.sh <slug> --show`: "config, live signals and recorded state". Keyed by the
  # caller's agent_id in prose; the filter grammar takes one literal equality, not a parameter.
  - name: swarm2.schedule.GateForAgent
    source: swarm2.schedule.WakeGate
    consistency: eventual
    fields:
      - name: gate_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: signals
        type: List<swarm2.schedule.Signal>
      - name: watched_files
        type: List<String>
      - name: only_if
        type: Optional<String>
      - name: min_interval_seconds
        type: Integer
      - name: max_idle_seconds
        type: Integer
      - name: prompt
        type: String
      - name: last_stamp
        type: Optional<swarm2.schedule.Stamp>
      - name: last_fired_at
        type: Optional<Timestamp>
      - name: enrolled_at
        type: Timestamp
    naming:
      wire: for-agent
      display: One agent's gate, whole

  # What `CronList` should agree with (SEED.md §1) and what the Clock fires from.
  - name: swarm2.schedule.ScheduledCrons
    source: swarm2.schedule.Cron
    consistency: read_your_writes
    filter: state == Scheduled
    order_by:
      - created_at desc
    fields:
      - name: cron_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: job
        type: swarm2.schedule.Job
      - name: expression
        type: String
      - name: created_at
        type: Timestamp
      - name: last_fired_at
        type: Optional<Timestamp>
    naming:
      wire: scheduled
      display: Crons the orchestrator's session should be holding

  - name: swarm2.schedule.CronById
    source: swarm2.schedule.Cron
    consistency: eventual
    fields:
      - name: cron_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: job
        type: swarm2.schedule.Job
      - name: expression
        type: String
      - name: prompt
        type: String
      - name: ttl_days
        type: Integer
      - name: created_at
        type: Timestamp
      - name: last_fired_at
        type: Optional<Timestamp>
      - name: fired_count
        type: Integer
    naming:
      wire: by-id
      display: One cron, whole

actors:
  # waked.sh — "Runs wakegate.sh for every enrolled slug, and nudges only the windows whose gate
  # said WAKE. Spends no model tokens" — and the harness's scheduled-task fire. One actor for
  # both: each is the clock, and neither is a model.
  - name: swarm2.schedule.Clock
    may:
      - swarm2.schedule.Evaluate
      - swarm2.schedule.Fire
      - swarm2.schedule.Expire
    naming:
      display: Clock (poller and cron fire)
  # The coordinator: writes the confs from one place (wake-gate.md), creates and deletes its own
  # crons (SEED.md §1; "CronList and CronDelete are session-only").
  - name: swarm2.schedule.Orchestrator
    may:
      - swarm2.schedule.Enrol
      - swarm2.schedule.Disable
      - swarm2.schedule.Schedule
      - swarm2.schedule.Cancel
    naming:
      display: Orchestrator
  # An agent window: "End the pass with `swarm/bin/wakegate.sh improver --arm <files you wrote>`"
  # (improver.conf WAKE_PROMPT).
  - name: swarm2.schedule.Worker
    may:
      - swarm2.schedule.Arm
    naming:
      display: Agent window
