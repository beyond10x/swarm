# swarm2.decision — the numbered binary decisions a swarm's orchestrator puts to Timo.
#
# What ./swarm keeps in `swarm/runs/<run>/decisions.md` as three tables — the live table, "Closed —
# answered, moot or withdrawn", "Taken by the orchestrator, not by Timo" — as rows with a
# lifecycle. WORKING-RULES §9: "every open decision is one numbered line, answerable yes or no,
# carrying the default that holds while he says nothing"; "the numbers are stable — a number is
# never reused for a different question, and an answered item keeps its number with the answer
# written next to it". So the number is the identity and an Integer, not a Uuid: eventlog.md says a
# window's `decision` event carries "the stable number in decisions.md, and that number is the only
# decision identity anything carries".
#
# Only the coordinator mints numbers (§9: "Only the coordinator assigns numbers. [...] Send the
# coordinator one binary line with its default; it comes back with the number"; decision-add.sh
# computes `n = max(nums) + 1` under the console's flock). That is prose plus the actors below —
# ess/1 has no per-field uniqueness or sequence, so "the next free number" is the implementation's,
# exactly as `swarm2.config.Config.version` is.
#
# An answer is Timo's only once it is in the file with a matching event (§9: "An answer is his when
# it is written in decisions.md, and not before. The answer cell is written by the decision console
# he types into, and every answer carries a matching `decision-console` event in the event log").
# Here that is the `Answer` command, which only the Timo actor may run. A window may not answer,
# and "A number quoted in a message is not an answer."
#
# The window's own `decision` / `decision_cleared` events (eventlog.md: `blocked_on`) are the
# agent's parked state, not the decision's, and are not modelled here: eventlog.md makes
# `decision_cleared` the window's own act after it reads the row ("clearing early is legitimate").
domain: swarm2.decision

summary: The numbered binary decisions a swarm puts to Timo — raised by the orchestrator, answered from his console, held, made moot, withdrawn, or taken by the orchestrator itself.

naming:
  wire: decisions
  display: Decisions

types:
  # The four things that reach Timo and nothing else (§9, Timo 11:42: "only conflicting things,
  # deescalations, blockers, real questions"). Conflict: "two windows or two plans that cannot both
  # be right". Deescalation: "something already agreed that needs undoing or narrowing". Blocker:
  # "a blocker only he can clear — a credential, an account, his own hands". RealQuestion: "two
  # paths, materially different work, evidence picks neither".
  - name: swarm2.decision.Kind
    kind: enum
    variants: [Conflict, Deescalation, Blocker, RealQuestion]
    naming:
      display: Why it reaches Timo

  # The two answers. §9, Timo 10:04: "a list of binary decissions which i can simply answer like
  # so: 1y 2n 3explain more". `y`/`n` decide. `?` is not an answer (decisions_lib.py: "`| 1? |` is
  # not an answer: the row stays open") — it is the `explanation_requested` field, not a variant.
  # Quoted because YAML 1.1 reads bare Yes/No as booleans.
  - name: swarm2.decision.Answer
    kind: enum
    variants: ["Yes", "No"]
    naming:
      display: Answer

entities:
  # One row of decisions.md. The columns of the live table (`# | decision | default on silence |
  # source`), plus the prose fields the later rows carry inside the decision cell (rows 41–49:
  # `**Waiting on it:**`, `**Irreversible:**`, `**The fact that would change your mind:**`), plus
  # what the two history tables add: the answer, the orchestrator's rationale, the closing note.
  - name: swarm2.decision.Decision
    identity:
      # The stable number. §9: "never reused for a different question"; "an answered item keeps
      # its number". Minted only by the orchestrator — prose, plus Orchestrator being the one
      # actor that may Raise.
      name: number
      type: Integer
    fields:
      # The swarm whose ledger holds this row: decisions.md lives under `swarm/runs/<run>/`, and a
      # run is one swarm2.manager.Swarm ("one run record directory", manager.yaml header). The
      # `owns` edge belongs on the Swarm side and is the integrator's; manager.yaml is not this
      # file's to edit.
      - name: swarm_id
        type: Uuid
      # §9's four. The test before writing a row: "if he says nothing, and I take the default,
      # what breaks? If the answer is 'nothing', it is not a decision" — such a row is Taken.
      - name: kind
        type: swarm2.decision.Kind
      # The one line. §9: "A question that cannot be made binary is not ready to be asked."
      # decision-add.sh: "a cell may not contain a pipe or a newline" — a single line is prose here.
      - name: question
        type: String
      # decisions.md column "default on silence": "While an item is unanswered the default in its
      # row holds."
      - name: default_on_silence
        type: String
      # decisions.md column "source" ("window 10, 12:00"; header: "Source per item: window report
      # or plan file named"). Held as the agent's role slug, not the window index — eventlog.md:
      # "Not the window index: indices get reused".
      - name: source_agent
        type: String
      # decisions.md row 41: "**Waiting on it:** nothing in this swarm — it is your sign-off that
      # starts it"; row 46: "the commit stays local in its worktree; nothing is lost". Optional:
      # rows written before 41 carry no such field.
      - name: waiting_on
        type: Optional<String>
      # decisions.md row 41: "**Irreversible:** no, it is a deploy that can be rolled back"; row 44:
      # "a merge to main, revertable but public".
      - name: irreversible
        type: Optional<Boolean>
      # decisions.md row 41: "**The fact that would change your mind:** if `!2558` is blocked on
      # something other than review, the date is not yours to give".
      - name: would_change_mind
        type: Optional<String>
      # decisions.md header: "Written 10:05 by the orchestrator"; each row's source cell carries its
      # time of writing. Assigned by the implementation at Raise.
      - name: raised_at
        type: Timestamp
      # decisions_lib.py: "answered — The answer lives in the number cell — `| 1y |` or `| 1n |`".
      - name: answer
        type: Optional<swarm2.decision.Answer>
      # The `ts` of the matching `decision-console` event (§9: "every answer carries a matching
      # `decision-console` event in the event log"). Assigned by the implementation at Answer.
      - name: answered_at
        type: Optional<Timestamp>
      # The `?`. decisions_lib.py: "flagged — `| 1? |` is not an answer: the row stays open and is
      # counted separately as something Timo wants explained". §9: "`1?` — he wants more, so the
      # next report explains that one item and nothing else".
      - name: explanation_requested
        type: Boolean
      # decisions.md "## Taken by the orchestrator, not by Timo", column "what I did and why"
      # (row 2: "take it: the save happens first and the plan names both commands").
      - name: taken_rationale
        type: Optional<String>
      # decisions.md "## Closed — answered, moot or withdrawn", column "outcome"; row 48: "**MOOT
      # 19:09 — no longer cold. A full workspace test has been running in that tree since ~18:49".
      - name: closed_note
        type: Optional<String>
    # No relation is declared on this side: `swarm2.manager.Swarm.decisions` OWNS Decision via this
    # entity's `swarm_id`, and ess/1 lets a field carry exactly one relation (ESS-ENTITY-006,
    # observed at integration 2026-09-11: "a field carries one relation"). A decision has no
    # meaning outside the swarm whose ledger numbered it, so ownership is the right side.
    lifecycle:
      # decisions_lib.py's row classes, one state each. Open: in the live table, unanswered. Held:
      # `**HELD` — "visible, NOT answerable, and not in the flagged count" (row 30). Answered:
      # `y`/`n` in the number cell. Moot: `**MOOT` — "not a decision any more" (row 48). Withdrawn:
      # `**WITHDRAWN` (row 8). Taken: under "Taken by the orchestrator" (rows 2, 4, 15, 21, 25, 31,
      # 34–39, 43). The four closing states are terminal: "Numbers are stable: never reused, kept
      # after the answer" — a closed row is history and is not reopened; a new question is a new
      # number.
      initial: Open
      states: [Open, Answered, Held, Moot, Withdrawn, Taken]
      terminal: [Answered, Moot, Withdrawn, Taken]
      transitions:
        # From Held too, per the design handed to this file. The console itself refuses `y`/`n`/`?`
        # on a `**HELD` row (decisions_lib.py: "The write path refuses it"), so through Timo's
        # surface a Held row is released first; the Held→Answered edge is what the orchestrator's
        # own edit of the file can do. Kept as designed and reported.
        - name: answer
          from: [Open, Held]
          to: Answered
        # Row 30: "**HELD 11:29 — do not answer yet.** The reason for it collapsed [...]".
        - name: hold
          from: [Open]
          to: Held
        # The `**HELD` marker removed; the console answers it again.
        - name: release
          from: [Held]
          to: Open
        - name: mark_moot
          from: [Open, Held]
          to: Moot
        - name: withdraw
          from: [Open, Held]
          to: Withdrawn
        # From Open only. §9: "A window that sends the coordinator a question failing that test
        # gets it taken, not numbered" — and a numbered one can still be taken (row 43: "taken by
        # the orchestrator 12:35 under §5's commit rule").
        - name: take
          from: [Open]
          to: Taken

errors:
  - name: swarm2.decision.DecisionStateConflict
    summary: The decision is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.decision.Decision.State

commands:
  # decision-add.sh: "Add a row to the LIVE decision table, never below the history headings [...]
  # Prints the number it assigned. Takes the same lock the console takes." The number is not an
  # input: it is minted here, and `instance: number` names it on the emitted event.
  - name: swarm2.decision.Raise
    naming:
      wire: raise
      display: Raise a decision
    input:
      - name: swarm_id
        type: Uuid
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: waiting_on
        type: Optional<String>
      - name: irreversible
        type: Optional<Boolean>
      - name: would_change_mind
        type: Optional<String>
    outcomes:
      - name: raised
        creates: swarm2.decision.Decision
        instance: number
        emits:
          - swarm2.decision.DecisionRaised
        payload:
          swarm2.decision.DecisionRaised:
            swarm_id: input.swarm_id
            kind: input.kind
            question: input.question
            default_on_silence: input.default_on_silence
            source_agent: input.source_agent
            waiting_on: input.waiting_on
            irreversible: input.irreversible
            would_change_mind: input.would_change_mind
        sets:
          swarm_id: input.swarm_id
          kind: input.kind
          question: input.question
          default_on_silence: input.default_on_silence
          source_agent: input.source_agent
          waiting_on: input.waiting_on
          irreversible: input.irreversible
          would_change_mind: input.would_change_mind
        summary: The row exists in Open under the next free number, with its default holding until Timo answers.

  # `decisions-console.sh answer <n> <y|n>`: "finds the row by its stable NUMBER rather than by
  # line position, and replaces only that line's number cell before an atomic rename", then writes
  # the `decision-console` event. A stale keystroke is refused by the console ("If the row is gone
  # or any of its other cells changed since it was drawn, the keystroke is refused") — that is a
  # fingerprint lookup, not a function of the input, so it is the implementation's and not an
  # outcome here.
  # Named `AnswerDecision`, not `Answer`: ess refuses one name for the type and the command
  # (ESS-DOMAIN-006 duplicate_declaration, probed 2026-09-11: "`swarm2.decision.Answer` is declared
  # twice [...] as a type and as a command [...] a name has exactly one owner").
  - name: swarm2.decision.AnswerDecision
    naming:
      wire: answer
      display: Answer a decision
    input:
      - name: number
        type: Integer
      - name: answer
        type: swarm2.decision.Answer
    outcomes:
      - name: answered
        moves: swarm2.decision.Decision.answer
        instance: number
        emits:
          - swarm2.decision.DecisionAnswered
        payload:
          swarm2.decision.DecisionAnswered:
            number: input.number
            answer: input.answer
        sets:
          answer: input.answer
        summary: The answer is in the number cell and the matching console event is written; the row is history.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: The decision is already Answered, Moot, Withdrawn or Taken, so nothing was written.

  # The `?`. decisions-console.sh: "?  explain this one (stays OPEN)". A literal cannot be set in
  # ess/1 (`sets:` reads input fields only), so the flag is an input: `true` is Timo's `?`, `false`
  # is the flag cleared.
  # UNMAPPED: what clears the `?`. Nothing in §9, decisions_lib.py or the console says whether the
  # flag is cleared once the next report has explained the item, or only by the answer itself;
  # `requested: false` exists so that either reading can be run, and which one is Timo's to say.
  - name: swarm2.decision.Explain
    naming:
      wire: explain
      display: Ask for more on a decision
    input:
      - name: number
        type: Integer
      - name: requested
        type: Boolean
    outcomes:
      - name: flagged
        updates: swarm2.decision.Decision
        instance: number
        emits:
          - swarm2.decision.ExplanationRequested
        payload:
          swarm2.decision.ExplanationRequested:
            number: input.number
            requested: input.requested
        sets:
          explanation_requested: input.requested
        summary: The row stays where it is; the next report explains this one item and nothing else.

  # Row 30: "**HELD 11:29 — do not answer yet.**" followed by the reason. The reason rides on the
  # event and, in the file, inside the row's decision cell; the design lists no entity field for
  # it, so none is set here.
  - name: swarm2.decision.Hold
    naming:
      wire: hold
      display: Hold a decision
    input:
      - name: number
        type: Integer
      - name: reason
        type: String
    outcomes:
      - name: held
        moves: swarm2.decision.Decision.hold
        instance: number
        emits:
          - swarm2.decision.DecisionHeld
        payload:
          swarm2.decision.DecisionHeld:
            number: input.number
            reason: input.reason
        summary: The row is visible in the console with [H] and refuses y, n and ? until released.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: Only an Open decision can be held.

  - name: swarm2.decision.Release
    naming:
      wire: release
      display: Release a held decision
    input:
      - name: number
        type: Integer
    outcomes:
      - name: released
        moves: swarm2.decision.Decision.release
        instance: number
        emits:
          - swarm2.decision.DecisionReleased
        payload:
          swarm2.decision.DecisionReleased:
            number: input.number
        summary: The HELD marker is gone; the console answers the row again.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: Only a Held decision can be released.

  # Row 48: "**MOOT 19:09 — no longer cold [...] Taking it now would kill a running gate.**" The
  # reason for asking collapsed; nobody answered.
  - name: swarm2.decision.MarkMoot
    naming:
      wire: mark-moot
      display: Mark a decision moot
    input:
      - name: number
        type: Integer
      - name: note
        type: String
    outcomes:
      - name: moot
        moves: swarm2.decision.Decision.mark_moot
        instance: number
        emits:
          - swarm2.decision.DecisionMoot
        payload:
          swarm2.decision.DecisionMoot:
            number: input.number
            note: input.note
        sets:
          closed_note: input.note
        summary: Not a decision any more; the row moves under Closed with its note, the number stays taken.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: Only an Open or Held decision can become moot.

  # Row 8: "wave stage-1: approve WITHDRAWN 11:26 — it described 4 units, 2 of which are now
  # built". The asker took the question back.
  - name: swarm2.decision.Withdraw
    naming:
      wire: withdraw
      display: Withdraw a decision
    input:
      - name: number
        type: Integer
      - name: note
        type: String
    outcomes:
      - name: withdrawn
        moves: swarm2.decision.Decision.withdraw
        instance: number
        emits:
          - swarm2.decision.DecisionWithdrawn
        payload:
          swarm2.decision.DecisionWithdrawn:
            number: input.number
            note: input.note
        sets:
          closed_note: input.note
        summary: The question is taken back; the row moves under Closed with its note, the number stays taken.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: Only an Open or Held decision can be withdrawn.

  # decisions.md "## Taken by the orchestrator, not by Timo": "These were mine and I took them. Each
  # is reversible, none is outward-facing, none changes what he asked for. Say the word on any one
  # and it flips." §9: "Take it, record it, tell him in one line that you did."
  - name: swarm2.decision.Take
    naming:
      wire: take
      display: Take a decision as the orchestrator
    input:
      - name: number
        type: Integer
      - name: rationale
        type: String
    outcomes:
      - name: taken
        moves: swarm2.decision.Decision.take
        instance: number
        emits:
          - swarm2.decision.DecisionTaken
        payload:
          swarm2.decision.DecisionTaken:
            number: input.number
            rationale: input.rationale
        sets:
          taken_rationale: input.rationale
        summary: The orchestrator decided it; the row moves under Taken with what it did and why.
      - name: wrong-state
        wrong_state: true
        error: swarm2.decision.DecisionStateConflict
        summary: Only an Open decision can be taken; a Held one is released first.

events:
  # Emitted by NO outcome: it is the `escalate` event of a binding in components.yaml (the binding answer-unparks-the-agent could not reach the parked agent).
  # An escalation nobody declared would be a silence; this is the fact instead (WakeLost precedent).
  - name: swarm2.decision.AnswerUndelivered
    fields:
      - name: number
        type: Integer
  # The row inserted into the live table. `number` is the minted identity, not an input.
  - name: swarm2.decision.DecisionRaised
    fields:
      - name: number
        type: Integer
      - name: swarm_id
        type: Uuid
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: waiting_on
        type: Optional<String>
      - name: irreversible
        type: Optional<Boolean>
      - name: would_change_mind
        type: Optional<String>
  # The `decision-console` event of §9 — the thing a window greps for before acting on "he said
  # 22y".
  - name: swarm2.decision.DecisionAnswered
    fields:
      # Added at integration: the agent that parked on this decision, so the binding answer-unparks-the-agent can address it (read from the row, not from the console's input).
      - name: source_agent
        type: String
      - name: number
        type: Integer
      - name: answer
        type: swarm2.decision.Answer
  - name: swarm2.decision.ExplanationRequested
    fields:
      - name: number
        type: Integer
      - name: requested
        type: Boolean
  - name: swarm2.decision.DecisionHeld
    fields:
      - name: number
        type: Integer
      - name: reason
        type: String
  - name: swarm2.decision.DecisionReleased
    fields:
      - name: number
        type: Integer
  - name: swarm2.decision.DecisionMoot
    fields:
      - name: number
        type: Integer
      - name: note
        type: String
  - name: swarm2.decision.DecisionWithdrawn
    fields:
      - name: number
        type: Integer
      - name: note
        type: String
  - name: swarm2.decision.DecisionTaken
    fields:
      - name: number
        type: Integer
      - name: rationale
        type: String

views:
  # The console's default screen (decisions_lib.py: "Only rows ABOVE the first `## ` heading are
  # decisions"; Timo 11:46: "things which are decided dont need to be visible in my decissions
  # pane"). Rows in number order, as the file lists them.
  - name: swarm2.decision.OpenDecisions
    source: swarm2.decision.Decision
    consistency: read_your_writes
    filter: state == Open
    order_by:
      - number asc
    fields:
      - name: number
        type: Integer
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: raised_at
        type: Timestamp
    naming:
      wire: open
      display: Open decisions, by number

  # The `[H]` rows: shown, not answerable.
  - name: swarm2.decision.HeldDecisions
    source: swarm2.decision.Decision
    consistency: read_your_writes
    filter: state == Held
    order_by:
      - number asc
    fields:
      - name: number
        type: Integer
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: raised_at
        type: Timestamp
    naming:
      wire: held
      display: Held decisions, by number

  # "read the row before acting" (§9) — one row, every field.
  - name: swarm2.decision.DecisionByNumber
    source: swarm2.decision.Decision
    consistency: eventual
    fields:
      - name: number
        type: Integer
      - name: swarm_id
        type: Uuid
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: waiting_on
        type: Optional<String>
      - name: irreversible
        type: Optional<Boolean>
      - name: would_change_mind
        type: Optional<String>
      - name: raised_at
        type: Timestamp
      - name: answer
        type: Optional<swarm2.decision.Answer>
      - name: answered_at
        type: Optional<Timestamp>
      - name: explanation_requested
        type: Boolean
      - name: taken_rationale
        type: Optional<String>
      - name: closed_note
        type: Optional<String>
    naming:
      wire: by-number
      display: One decision, whole

  # The whole of decisions.md as rows: the live table and both history tables, by number. Which
  # table a row is in is its lifecycle state, carried here as a field so the three tables can be
  # rebuilt from one view.
  - name: swarm2.decision.DecisionLedger
    source: swarm2.decision.Decision
    consistency: eventual
    order_by:
      - number asc
    fields:
      - name: number
        type: Integer
      - name: state
        type: swarm2.decision.Decision.State
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: raised_at
        type: Timestamp
      - name: answer
        type: Optional<swarm2.decision.Answer>
      - name: answered_at
        type: Optional<Timestamp>
      - name: explanation_requested
        type: Boolean
      - name: taken_rationale
        type: Optional<String>
      - name: closed_note
        type: Optional<String>
    naming:
      wire: ledger
      display: Every decision ever numbered, by number

  # decisions.md "## Taken by the orchestrator, not by Timo": "Say the word on any one and it
  # flips" — so he can see them.
  - name: swarm2.decision.TakenByOrchestrator
    source: swarm2.decision.Decision
    consistency: eventual
    filter: state == Taken
    order_by:
      - number asc
    fields:
      - name: number
        type: Integer
      - name: kind
        type: swarm2.decision.Kind
      - name: question
        type: String
      - name: default_on_silence
        type: String
      - name: source_agent
        type: String
      - name: taken_rationale
        type: Optional<String>
      - name: raised_at
        type: Timestamp
    naming:
      wire: taken
      display: Decisions the orchestrator took itself

actors:
  # The coordinator (WORKING-RULES §4: "The coordinator is `orchestrator` / `main`"). The one actor
  # that mints a number (§9), and the one that holds, releases, closes and takes.
  - name: swarm2.decision.Orchestrator
    may:
      - swarm2.decision.Raise
      - swarm2.decision.Hold
      - swarm2.decision.Release
      - swarm2.decision.MarkMoot
      - swarm2.decision.Withdraw
      - swarm2.decision.Take
    naming:
      display: Orchestrator
  # Timo, through the decision console (decisions-console.sh: "one tmux window where every open
  # decision is answered with one keystroke [...] ZERO MODEL TOKENS"). `y`/`n` is Answer; `?` is
  # Explain. Nobody else may run either — §9: "An answer is his when it is written in
  # decisions.md, and not before."
  - name: swarm2.decision.Timo
    may:
      - swarm2.decision.AnswerDecision
      - swarm2.decision.Explain
    naming:
      display: Timo
