# swarm2.fault — what happens when an agent window is broken, in the shape of
# ../aep/workflows/incidents/standard.yaml.
#
# A Fault is the fourth verdict of the orchestrator's check-in loop (swarm/WORKING-RULES.md §8:
# "fault | lost Enter, dead pane, usage limit, background shell gone, a stall | fix it, or report
# it if fixing needs Timo") and the `fault` kind of the event log (swarm/docs/eventlog.md: "your
# window is broken: dead background shell, lost Enter, usage limit"). The lifecycle is aep's
# incident workflow with two of its seven states folded: `triage` into Detected (one window is
# the whole blast radius — the scope is the `agent_id`), and `verify` into the `recover` guard
# (`health == Healthy` is the verification; there is no telemetry beyond the pane and the event
# log to verify against). What aep keeps and this keeps: mitigation comes AFTER a tested
# hypothesis ("an untested hypothesis acted on under pressure is how an incident acquires a second
# cause"), `degraded` is enough to leave mitigation but not enough to be recovered, and `learn` is
# a state, not a follow-up ("the postmortem is the only output of an incident that prevents the
# next one"). The lesson lands in swarm/WORKING-RULES.md — §12a is exactly that: three kills on
# 2026-09-11 became one rule.
#
# Escalated is aep's missing edge, added because the swarm has an operator: a fault whose fix
# needs Timo's hands (WORKING-RULES §9: "a blocker only he can clear — a credential, an account,
# his own hands") leaves this domain as a numbered decision row; the binding
# `FaultEscalated -> swarm2.decision.Raise` lives in components.yaml. A fault is fed in by the
# bindings `swarm2.agent.FaultRaised -> DetectFault` (an agent's own `fault` event line) and
# `swarm2.orchestrator.FaultDetected -> DetectFault` (the tick's classification), also in
# components.yaml.
domain: swarm2.fault

summary: A broken agent window, detected, diagnosed, mitigated, recovered and learned from — or escalated to Timo as a numbered decision when the repair needs his hands.

naming:
  wire: faults
  display: Faults

types:
  # What is broken. Each variant names where it was seen; none is a guess.
  - name: swarm2.fault.Kind
    kind: enum
    # LostEnter — WORKING-RULES §8 ("lost Enter"); swarm/bin/stall.sh: "input-pending!(4m12s)
    #   over STALL_SECONDS -> STALLED, probably a lost Enter"; nudge.sh: "Not accepted after 5
    #   tries: the stamp STAYS. It is a true record of a lost Enter".
    # DeadPane — WORKING-RULES §8 ("dead pane"); swarm/AGENTS.md §6 "Report it only when it
    #   hides a fault — a lost Enter, a dead pane, a usage limit, a dead background shell".
    # UsageLimit — swarm/bin/limits.sh: "three windows hit a session limit" on 2026-09-11,
    #   "Usage limit reached - continuing automatically at 3:20pm"; eventlog.md `fault` kind.
    # BackgroundShellGone — eventlog.md `fault`: "dead background shell"; WORKING-RULES §8.
    # Stall — WORKING-RULES §8 ("a stall"); stall.sh measures it, keystroke-known or observed.
    # TwoCoordinators — coordinator/CHARTER.md §5.5: the hook "says `TWO COORDINATORS` in the
    #   seed if it finds one"; coord-restart.sh precondition 3 "never leave two coordinators
    #   running".
    # DiskFull — swarm/AGENTS.md §6 "Disk, 09:25: `/` hit 100% with 3.3G free".
    # SecondLiveProcess — swarm/AGENTS.md §6 "`bc-mrs` has a second live process ... pid 3641636
    #   ... Do not type into it — two writers branch the same transcript".
    # GateKilledBySignal — WORKING-RULES §12a: a `pkill -f` "killed ... an unrelated release
    #   gate's test step, which recorded `exit 143` with zero real failures"; "`exit 143` is
    #   SIGTERM, not a failure".
    # Unknown — the kind before classification. WORKING-RULES §8: "classify, then act ... the
    #   classification is the work", so a fault can be raised before its kind is named.
    #   UNMAPPED: no source records a fault raised unclassified; whether `Unknown` is ever
    #   written, or diagnosis always names a kind, is settled by the first run that emits one.
    variants:
      - LostEnter
      - DeadPane
      - UsageLimit
      - BackgroundShellGone
      - Stall
      - TwoCoordinators
      - DiskFull
      - SecondLiveProcess
      - GateKilledBySignal
      - Unknown
    naming:
      display: Fault kind

  # The repairs swarm/bin/ has. One variant per tool, plus the two that are not a tool.
  - name: swarm2.fault.Repair
    kind: enum
    # Nudge — swarm/bin/nudge.sh: "types text into tmux window <session>:<win>, submits,
    #   retries Enter until accepted". The repair for LostEnter and Stall.
    # Restart — swarm/bin/coord-restart.sh: "end the coordinator's generation and start the
    #   next one", refused on a red budget gate, a question in flight, or two coordinators.
    # Takeover — swarm/bin/takeover.sh: "one command from a Codex rollout id to a takeover
    #   handoff on disk, plus the exact two commands that put a Claude window on it".
    # Handoff — swarm/bin/handoff.sh: "when a window compacts or dies, what it knew is gone.
    #   This is that equivalent" — a handoff written from the Claude transcript, for a DeadPane.
    # Reclaim — swarm/bin/reclaim.sh: "the disk warden's mechanical tiers, without a model in
    #   the loop" — for DiskFull. "THIS SCRIPT DELETES THINGS": not reversible (see `reversible`).
    # Kill — WORKING-RULES §12a: "Kill by pid, resolved from something that names the one
    #   process you mean: its parent, its working directory, its own pidfile". Never `pkill -f`.
    # Wait — limits.sh: "Usage limit reached - continuing automatically at 3:20pm"; incident
    #   class LIVE "reset ahead, not cancelled ... still waiting". The repair for UsageLimit.
    # None — a repair was chosen and it is to do nothing: the second live process on `bc-mrs`
    #   is left alone ("Do not type into it", AGENTS.md §6). Distinct from `repair` being
    #   absent, which means no repair has been chosen yet.
    variants:
      - Nudge
      - Restart
      - Takeover
      - Handoff
      - Reclaim
      - Kill
      - Wait
      - None
    naming:
      display: Repair

  # aep's `service.health`: the `mitigate -> recover` guard is `service.health >= degraded`, the
  # `recover -> verify` guard is `service.health == healthy`. Here the "service" is one window.
  - name: swarm2.fault.Health
    kind: enum
    variants: [Down, Degraded, Healthy]
    naming:
      display: Window health

entities:
  - name: swarm2.fault.Fault
    identity:
      # Assigned by the implementation when `DetectFault` creates the row; an agent's `fault`
      # event line carries no id of its own (eventlog.md: `ref` is a story id or a gate name).
      name: fault_id
      type: Uuid
    fields:
      # The swarm whose window broke (swarm2.manager.Swarm). Every script keys on its session
      # name; the fault keys on the record.
      - name: swarm_id
        type: Uuid
      # The broken window's role slug. eventlog.md: "`agent` | string | role slug — `improver`,
      # `cv2-aep` — the same identity as `board.yaml`'s `agent_id`. **Not** the window index:
      # indices get reused". A swarm-wide fault carries the slug of the window that owns the
      # repair: DiskFull -> `disk-warden` (AGENTS.md §6), TwoCoordinators -> the coordinator
      # (WORKING-RULES §4: "The coordinator is `orchestrator` / `main`").
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      # Who raised it: the `agent` of the `fault` event line when a window reports its own
      # (eventlog.md), or `orchestrator` when the tick classified it (WORKING-RULES §8).
      - name: detected_by
        type: String
      # eventlog.md: "`msg` | string | one line, no newlines, ≤500 chars (longer is truncated,
      # not rejected)". The ceiling is swarm2.config.Budgets.event_msg_max_chars; prose here.
      - name: msg
        type: String
      # aep `diagnose`: "Form a hypothesis and test it." Absent until `Diagnose` runs.
      - name: hypothesis
        type: Optional<String>
      # aep `diagnose -> mitigate`: "the guard is the test result, not the theory". False at
      # detection (implementation-initialised; `sets:` cannot write a literal), true only by
      # the `diagnosed` outcome, which is the only way into Diagnosed.
      - name: hypothesis_tested
        type: Boolean
      # Absent until `Mitigate` chooses one.
      - name: repair
        type: Optional<swarm2.fault.Repair>
      # aep `mitigate` is `irreversible: false` for "a feature flag, a config revert, a rollback";
      # "purging a cache, deleting or rewriting corrupt rows ... are irreversible steps wearing
      # a mitigation label". Nudge, Wait and None are reversible; Reclaim deletes and Kill ends
      # a process, so they are not. Recorded per fault, not derived from the repair, because
      # a Restart with a handoff on disk is reversible and one without is not. Prose only.
      - name: reversible
        type: Boolean
      # WORKING-RULES §8: "fix it, or report it if fixing needs Timo". True marks the
      # `escalate` edge; §9 says what qualifies: "a credential, an account, his own hands".
      - name: needs_timo
        type: Boolean
      # The decision row's stable number, as a String: eventlog.md "Its `ref` is a **string**,
      # the same type as an event's `ref` — one type for one identity"; WORKING-RULES §9 "that
      # number is the only decision identity anything carries".
      # UNMAPPED: which command writes it. `swarm2.decision.Raise` mints the number after
      # `FaultEscalated` fires; no source names the edge that carries it back onto the fault.
      - name: decision_ref
        type: Optional<String>
      # aep `service.health`, for one window. Down at detection (a raised fault is a window that
      # is not serving — eventlog.md "your window is broken"); implementation-initialised,
      # rewritten by every `Recover` outcome.
      - name: health
        type: swarm2.fault.Health
      # aep `learn`: "Record what happened and what changes because of it." What lands in
      # swarm/WORKING-RULES.md (§12a is one: "Two rules, and the second is the one that keeps
      # being missed"). Absent until `Learn`.
      - name: lesson
        type: Optional<String>
      # Stamped by the implementation at create, at `recover`, at `learn`.
      - name: detected_at
        type: Timestamp
      - name: recovered_at
        type: Optional<Timestamp>
      - name: learned_at
        type: Optional<Timestamp>
    # DEFERRED-RELATION: {name: faults, kind: owns, target: swarm2.fault.Fault, cardinality: many,
    #   via: swarm_id} — belongs on swarm2.manager.Swarm (the owner's side), which this file does
    #   not write; the integrator adds it beside `configs`.
    # DEFERRED-RELATION: {name: agent, kind: references, target: swarm2.agent.Agent,
    #   cardinality: one, via: agent_id} — swarm2.agent is not in the base yet.
    relations:
      # Declared at integration (the DEFERRED-RELATION note above): the broken window's role
      # outlives the fault record — a restarted agent keeps its slug — so `references`, via here.
      - name: agent
        kind: references
        target: swarm2.agent.Agent
        cardinality: one
        via: agent_id
    lifecycle:
      # Detected: an observation says the window is broken (aep `detect`; triage is folded in —
      # the scope is one window). Diagnosed: a hypothesis was tested and held. Mitigated: a
      # repair ran and the window is at least Degraded ("Stop the bleeding. Restoring full
      # service is the next state's job"). Recovered: Healthy, which is aep's `verify` guard
      # folded into `recover`. Learned: terminal — the lesson is written. Escalated: terminal
      # here — the fault continues as a decision row; a fault Timo clears is closed there, and
      # this record keeps the number in `decision_ref`.
      initial: Detected
      states: [Detected, Diagnosed, Mitigated, Recovered, Learned, Escalated]
      terminal: [Learned, Escalated]
      transitions:
        - name: diagnose
          from: [Detected]
          to: Diagnosed
        - name: mitigate
          from: [Diagnosed]
          to: Mitigated
        # From every non-terminal state but Recovered: a recovered window needs nobody's hands.
        - name: escalate
          from: [Detected, Diagnosed, Mitigated]
          to: Escalated
        - name: recover
          from: [Mitigated]
          to: Recovered
        # aep `mitigate.on_failure: rollback` as a back-edge: the repair did not hold, the
        # window is Down again, and the next hypothesis starts from what was learned.
        - name: regress
          from: [Mitigated]
          to: Diagnosed
        - name: learn
          from: [Recovered]
          to: Learned

errors:
  - name: swarm2.fault.FaultStateConflict
    summary: The fault is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: swarm2.fault.Fault.State
  # aep `diagnose`: "An untested hypothesis acted on under pressure is how an incident acquires a
  # second cause." Refused, not recorded: a hypothesis that was not tested is not a diagnosis.
  - name: swarm2.fault.HypothesisUntested
    summary: The hypothesis was not tested, so it is not a diagnosis and nothing moved.
    fields:
      - name: hypothesis
        type: String

commands:
  # Never typed by hand in the normal case: fed by the bindings `swarm2.agent.FaultRaised ->
  # DetectFault` (a window's own `fault` event line, eventlog.md) and
  # `swarm2.orchestrator.FaultDetected -> DetectFault` (the tick's classification,
  # WORKING-RULES §8) in components.yaml. `hypothesis_tested`, `reversible` and `needs_timo`
  # start false and `health` starts Down — implementation-initialised, because `sets:` writes
  # input fields only.
  - name: swarm2.fault.DetectFault
    naming:
      wire: detect-fault
      display: Record a broken window
    input:
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: detected_by
        type: String
      - name: msg
        type: String
    outcomes:
      - name: detected
        creates: swarm2.fault.Fault
        instance: fault_id
        emits:
          - swarm2.fault.FaultDetected
        payload:
          swarm2.fault.FaultDetected:
            agent_id: input.agent_id
            kind: input.kind
        sets:
          swarm_id: input.swarm_id
          agent_id: input.agent_id
          kind: input.kind
          detected_by: input.detected_by
          msg: input.msg
        summary: The fault exists in Detected, Down, with no hypothesis and no repair.

  # aep `diagnose -> mitigate`: "A hypothesis has been tested and held. Acting on an untested
  # theory is the common path to making an incident worse, so the guard is the test result, not
  # the theory." The test is a runtime observation (CLAUDE.md "Evidence before assertion": the
  # transcript tail, `stall.sh check`, `limits.sh`, `/proc`), not a reading of the pane.
  - name: swarm2.fault.Diagnose
    naming:
      wire: diagnose
      display: Record a tested hypothesis
    input:
      - name: fault_id
        type: Uuid
      - name: hypothesis
        type: String
      - name: tested
        type: Boolean
    outcomes:
      - name: diagnosed
        when: tested == true
        moves: swarm2.fault.Fault.diagnose
        instance: fault_id
        emits:
          - swarm2.fault.FaultDiagnosed
        payload:
          swarm2.fault.FaultDiagnosed:
            fault_id: input.fault_id
            hypothesis: input.hypothesis
        sets:
          hypothesis: input.hypothesis
          hypothesis_tested: input.tested
        summary: The hypothesis held under a test; a repair may now be chosen.
      - name: untested
        error: swarm2.fault.HypothesisUntested
        summary: The hypothesis was not tested, so nothing is recorded and nothing moves.
      - name: wrong-state
        wrong_state: true
        error: swarm2.fault.FaultStateConflict
        summary: Only a Detected fault is diagnosed.

  # aep `mitigate`: "Stop the bleeding." The repair is one of swarm/bin/'s; `reversible` is the
  # caller's reading of aep's list, not derived. `needs_timo` routes the fault out of this
  # domain instead (WORKING-RULES §8 "report it if fixing needs Timo"): the `escalated` outcome
  # runs first. `agent_id`, `kind` and `msg` are inputs beside `fault_id` so that
  # `FaultEscalated` carries what the binding to `swarm2.decision.Raise` needs, one event field
  # per input; `kind` is the wire text of the decision row, the typed kind stays on the record.
  - name: swarm2.fault.Mitigate
    naming:
      wire: mitigate
      display: Choose and run a repair
    input:
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: String
      - name: msg
        type: String
      - name: repair
        type: swarm2.fault.Repair
      - name: reversible
        type: Boolean
      - name: needs_timo
        type: Boolean
    outcomes:
      - name: escalated
        when: needs_timo == true
        moves: swarm2.fault.Fault.escalate
        instance: fault_id
        emits:
          - swarm2.fault.FaultEscalated
        payload:
          swarm2.fault.FaultEscalated:
            fault_id: input.fault_id
            agent_id: input.agent_id
            kind: input.kind
            msg: input.msg
        sets:
          repair: input.repair
          reversible: input.reversible
          needs_timo: input.needs_timo
        summary: The chosen repair needs Timo's hands; the fault leaves as a decision row.
      - name: mitigated
        moves: swarm2.fault.Fault.mitigate
        instance: fault_id
        emits:
          - swarm2.fault.FaultMitigated
        payload:
          swarm2.fault.FaultMitigated:
            fault_id: input.fault_id
            repair: input.repair
        sets:
          repair: input.repair
          reversible: input.reversible
          needs_timo: input.needs_timo
        summary: The repair ran; whether it held is `Recover`'s question.
      - name: wrong-state
        wrong_state: true
        error: swarm2.fault.FaultStateConflict
        summary: Only a Diagnosed fault is mitigated.

  # aep `mitigate -> recover`: "`degraded` is deliberately enough to leave this state"; `recover
  # -> verify`: "service.health == healthy"; `mitigate.on_failure: rollback`. Three readings of
  # one health fact, in order: Healthy recovers, Down regresses, Degraded stays Mitigated and
  # is written down. The fact comes from `status.sh`/`state.sh`, not from the pane's spinner.
  - name: swarm2.fault.Recover
    naming:
      wire: recover
      display: Record the window's health after a repair
    input:
      - name: fault_id
        type: Uuid
      - name: health
        type: swarm2.fault.Health
    outcomes:
      # `agent_id` on the event is resolved from the record by the implementation.
      - name: recovered
        when: health == Healthy
        moves: swarm2.fault.Fault.recover
        instance: fault_id
        emits:
          - swarm2.fault.FaultRecovered
        payload:
          swarm2.fault.FaultRecovered:
            fault_id: input.fault_id
        sets:
          health: input.health
        summary: The window is Healthy; the lesson is what remains.
      - name: regressed
        when: health == Down
        moves: swarm2.fault.Fault.regress
        instance: fault_id
        emits:
          - swarm2.fault.MitigationFailed
        payload:
          swarm2.fault.MitigationFailed:
            fault_id: input.fault_id
        sets:
          health: input.health
        summary: The repair did not hold; back to Diagnosed for the next hypothesis.
      # Unconditional: Degraded. The state does not move; the health is recorded. Outside
      # Mitigated the implementation answers with the `wrong-state` branch below for this
      # outcome too — an `updates:` outcome has no state guard of its own in ess/1.
      - name: still-degraded
        updates: swarm2.fault.Fault
        instance: fault_id
        emits:
          - swarm2.fault.RecoveryPending
        payload:
          swarm2.fault.RecoveryPending:
            fault_id: input.fault_id
            health: input.health
        sets:
          health: input.health
        summary: The window serves but not fully; the fault stays Mitigated.
      - name: wrong-state
        wrong_state: true
        error: swarm2.fault.FaultStateConflict
        summary: Only a Mitigated fault has a recovery to record.

  # The direct edge for a fault that needs Timo before any repair is chosen (WORKING-RULES §9:
  # "a blocker only he can clear — a credential, an account, his own hands"), from Detected or
  # Diagnosed; from Mitigated it is `Mitigate`'s `escalated` outcome. `reason` is the one line
  # the decision row will carry ("one numbered line, answerable yes or no"); `msg` is the
  # fault's own text. `needs_timo` becomes true by the implementation (no input to `sets:` it).
  - name: swarm2.fault.Escalate
    naming:
      wire: escalate
      display: Hand a fault to Timo
    input:
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: String
      - name: msg
        type: String
      - name: reason
        type: String
    outcomes:
      - name: escalated
        moves: swarm2.fault.Fault.escalate
        instance: fault_id
        emits:
          - swarm2.fault.FaultEscalated
        payload:
          swarm2.fault.FaultEscalated:
            fault_id: input.fault_id
            agent_id: input.agent_id
            kind: input.kind
            msg: input.msg
            reason: input.reason
        summary: The fault leaves this domain as a decision row; the number comes back as `decision_ref`.
      - name: wrong-state
        wrong_state: true
        error: swarm2.fault.FaultStateConflict
        summary: A Recovered, Learned or Escalated fault is not escalated.

  # aep `learn`: "This is a state and not an aspiration because the postmortem is the only output
  # of an incident that prevents the next one." The lesson lands in swarm/WORKING-RULES.md; this
  # record holds the text so the rule can be traced to the fault that taught it.
  - name: swarm2.fault.Learn
    naming:
      wire: learn
      display: Record the lesson
    input:
      - name: fault_id
        type: Uuid
      - name: lesson
        type: String
    outcomes:
      - name: learned
        moves: swarm2.fault.Fault.learn
        instance: fault_id
        emits:
          - swarm2.fault.LessonRecorded
        payload:
          swarm2.fault.LessonRecorded:
            fault_id: input.fault_id
            lesson: input.lesson
        sets:
          lesson: input.lesson
        summary: The fault is closed with its lesson written.
      - name: wrong-state
        wrong_state: true
        error: swarm2.fault.FaultStateConflict
        summary: Only a Recovered fault is learned from.

events:
  - name: swarm2.fault.FaultDetected
    fields:
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
  - name: swarm2.fault.FaultDiagnosed
    fields:
      - name: fault_id
        type: Uuid
      - name: hypothesis
        type: String
  # Carries `agent_id`, `kind` and `msg` beside the id: the binding to `swarm2.decision.Raise`
  # maps one event field per input, and a decision row is one line about one window. `reason`
  # is set by `Escalate` only; `Mitigate`'s `escalated` outcome leaves it absent, the repair
  # being the reason.
  - name: swarm2.fault.FaultEscalated
    fields:
      # Added at integration: a binding maps one event field per input and a literal is text, so the id an invoked command requires must ride on the event (resolved by the implementation, not from the input).
      - name: swarm_id
        type: Uuid
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: String
      - name: msg
        type: String
      - name: reason
        type: Optional<String>
  - name: swarm2.fault.FaultMitigated
    fields:
      - name: fault_id
        type: Uuid
      - name: repair
        type: swarm2.fault.Repair
  # `agent_id` is here so a binding can wake or re-assign the window without a lookup.
  - name: swarm2.fault.FaultRecovered
    fields:
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
  - name: swarm2.fault.MitigationFailed
    fields:
      - name: fault_id
        type: Uuid
  - name: swarm2.fault.RecoveryPending
    fields:
      - name: fault_id
        type: Uuid
      - name: health
        type: swarm2.fault.Health
  - name: swarm2.fault.LessonRecorded
    fields:
      - name: fault_id
        type: Uuid
      - name: lesson
        type: String

views:
  # "Open faults" is three views, because a filter is one equality and there is no "not
  # terminal": Detected (nobody has looked), Mitigated (a repair is being watched), Escalated
  # (with Timo). Diagnosed and Recovered are transient between two orchestrator actions.
  - name: swarm2.fault.DetectedFaults
    source: swarm2.fault.Fault
    consistency: read_your_writes
    filter: state == Detected
    order_by:
      - detected_at desc
    fields:
      - name: fault_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: detected_by
        type: String
      - name: msg
        type: String
      - name: detected_at
        type: Timestamp
    naming:
      wire: detected
      display: Faults nobody has diagnosed

  - name: swarm2.fault.MitigatedFaults
    source: swarm2.fault.Fault
    consistency: read_your_writes
    filter: state == Mitigated
    order_by:
      - detected_at desc
    fields:
      - name: fault_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: repair
        type: Optional<swarm2.fault.Repair>
      - name: reversible
        type: Boolean
      - name: health
        type: swarm2.fault.Health
      - name: detected_at
        type: Timestamp
    naming:
      wire: mitigated
      display: Faults whose repair is being watched

  - name: swarm2.fault.EscalatedFaults
    source: swarm2.fault.Fault
    consistency: read_your_writes
    filter: state == Escalated
    order_by:
      - detected_at desc
    fields:
      - name: fault_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: msg
        type: String
      - name: decision_ref
