      display: One fault, whole

  # What goes into WORKING-RULES.md, with the fault that taught it.
  - name: swarm2.fault.Lessons
    source: swarm2.fault.Fault
    consistency: eventual
    filter: state == Learned
    order_by:
      - learned_at desc
    fields:
      - name: fault_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: lesson
        type: Optional<String>
      - name: learned_at
        type: Optional<Timestamp>
    naming:
      wire: lessons
      display: Lessons, newest first

actors:
  # The check-in loop (WORKING-RULES §8): classifies, fixes, or reports. The only actor that
  # moves a fault.
  - name: swarm2.fault.Orchestrator
    may:
      - swarm2.fault.DetectFault
      - swarm2.fault.Diagnose
      - swarm2.fault.Mitigate
      - swarm2.fault.Recover
      - swarm2.fault.Escalate
      - swarm2.fault.Learn
    naming:
      display: Orchestrator
  # A window raising its own fault — the `fault` kind of eventlog.md ("your window is broken").
  - name: swarm2.fault.Worker
    may:
      - swarm2.fault.DetectFault
    naming:
      display: Agent window
  # In the picture, permitted nothing here: an escalation reaches him as a numbered decision
  # row (WORKING-RULES §9), and his answer is written there, not on the fault.
  - name: swarm2.fault.Timo
    naming:
      display: Timo
