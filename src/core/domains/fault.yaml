    naming:
      wire: escalated
      display: Faults with Timo

  - name: swarm2.fault.Faults
    source: swarm2.fault.Fault
    consistency: eventual
    order_by:
      - detected_at desc
    fields:
      - name: fault_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: detected_by
        type: String
      - name: repair
        type: Optional<swarm2.fault.Repair>
      - name: health
        type: swarm2.fault.Health
      - name: detected_at
        type: Timestamp
    naming:
      wire: all
      display: Every fault, newest first

  - name: swarm2.fault.FaultById
    source: swarm2.fault.Fault
    consistency: eventual
    fields:
      - name: fault_id
        type: Uuid
      - name: swarm_id
        type: Uuid
      - name: agent_id
        type: String
      - name: kind
        type: swarm2.fault.Kind
      - name: detected_by
        type: String
      - name: msg
        type: String
      - name: hypothesis
