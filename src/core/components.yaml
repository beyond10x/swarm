# The subsystems (level 2) and the wiring between them. Kernel first — Timo, 2026-09-11: "it
# usually starts simple: you need to solve tool access, orchestrator needs to be able to create the
# agents and they can basically build anything anyway - we do provide inbox + eventbus like
# connections + presentation layer for the human to observe. from there on they build what they need
# and like." The four kernel components are `swarm-manager`, `agent-runtime`, `board` and
# `blackbox-bus`; `flow-engine` is what they build with; `orchestrator`, `scheduler` and
# `decision-console` are what the first orchestrator built for itself on 2026-09-11 (./swarm), kept
# because they are measured, not because a new swarm has to run them.
#
# A binding is `when: event → invoke: command`; `delivery` and `on_failure` are required words
# (ess/examples/billing/components.yaml). A `mapping` maps one event field per input, or a literal.
# `escalate` publishes a declared event nothing else emits — the way a lost wake or an undelivered
# assignment becomes a fact instead of a silence.
#
# Two limits met at integration (2026-09-11, ess 0.23.0), both kept visible rather than worked
# around: (1) `reached_by: command_line` requires a `cli:` block naming the binary and the command
# tree, so the five CLI-reached components (agent-runtime, board, flow-engine, scheduler,
# decision-console) are `in_process` until that block is written from board.sh/eventlog.sh's real
# grammars; (2) "a literal in a binding is text", so an input typed Uuid, Integer or Boolean cannot
# be filled by a literal — such inputs are left unmapped and the implementation supplies them from
# the run's context (the swarm id, the current generation, the counts a script prints).

conversions:
  - from: String
    to: swarm2.fault.Kind
    because: >-
      An agent raises its fault with a free-text kind (eventlog.md's `fault` line carries prose);
      the fault ledger classifies it. The implementation maps known names onto the enum and files
      the rest as Unknown, which the enum declares for exactly this crossing.
  - from: Optional<String>
    to: swarm2.fault.Kind
    because: >-
      The orchestrator's Classify answers four verdicts with one input set, so its fault kind is
      Optional; a fault-verdict with no kind is filed as Unknown rather than refused, because the
      fault is real even when its name is not yet.
  - from: Integer
    to: String
    because: >-
      A decision's identity is its number; the agent's blocked_on ref is that number as text
      (eventlog.md: "one type for one identity", the ref is a string). The crossing is a rendering.
  # `Classify.question` is Optional (a verdict of `continue` carries no question), `Raise.question`
  # is required: the crossing is written down (ESS-COMMAND-002 refuses it otherwise).
  - from: Optional<String>
    to: String
    because: >-
      The orchestrator's DecisionParked and FaultDetected carry Optional text because the same
      command answers four verdicts; the receiving commands require it because a decision without
      a question and a fault without a kind are not records. The implementation refuses the binding
      when the Optional is absent, which is the right answer: a parked verdict with no question is a
      classification bug, not a decision.

components:
  # ---- kernel ---------------------------------------------------------------------------------
  - component: swarm-manager
    summary: Many swarms, and the runtime configuration each runs with. The one surface a person or a UI reaches across a process boundary.
    owns:
      domains:
        - swarm2.manager
        - swarm2.config
    accepts:
      commands:
        - swarm2.manager.CreateSwarm
        - swarm2.manager.UpdateSwarm
        - swarm2.manager.AdoptConfig
        - swarm2.manager.StartSwarm
        - swarm2.manager.PauseSwarm
        - swarm2.manager.ResumeSwarm
        - swarm2.manager.StopSwarm
        - swarm2.manager.DeleteSwarm
        - swarm2.config.DraftConfig
        - swarm2.config.ActivateConfig
        - swarm2.config.SupersedeConfig
        - swarm2.config.DiscardConfig
    publishes:
      events:
        - swarm2.manager.SwarmCreated
        - swarm2.manager.SwarmUpdated
        - swarm2.manager.ConfigAdopted
        - swarm2.manager.SwarmStarted
        - swarm2.manager.SwarmPaused
        - swarm2.manager.SwarmResumed
        - swarm2.manager.SwarmStopped
        - swarm2.manager.SwarmDeleted
        - swarm2.config.ConfigDrafted
        - swarm2.config.ConfigActivated
        - swarm2.config.ConfigSuperseded
        - swarm2.config.ConfigDiscarded
    reached_by: network

  - component: agent-runtime
    summary: Agents — a role on a host with a loadout (tool access) — their assignments, and the work, waves and faults they carry. One per swarm window; the orchestrator is one of them.
    owns:
      domains:
        - swarm2.agent
        - swarm2.work
        - swarm2.fault
    accepts:
      commands:
        - swarm2.agent.Spawn
        - swarm2.agent.Assign
        - swarm2.agent.RecordAssignment
        - swarm2.agent.TakeAssignment
        - swarm2.agent.ReportStep
        - swarm2.agent.ReportGate
        - swarm2.agent.Block
        - swarm2.agent.Unblock
        - swarm2.agent.Park
        - swarm2.agent.Unpark
        - swarm2.agent.GoIdle
        - swarm2.agent.Wake
        - swarm2.agent.RaiseFault
        - swarm2.agent.Restart
        - swarm2.agent.Retire
        - swarm2.agent.Note
        - swarm2.agent.FinishAssignment
        - swarm2.agent.ClearAssignment
        - swarm2.work.Open
        - swarm2.work.FinishIntake
        - swarm2.work.RecordSpecification
        - swarm2.work.RecordDecomposition
        - swarm2.work.RecordVerifiers
        - swarm2.work.RecordChange
        - swarm2.work.RecordVerification
        - swarm2.work.RecordAdversarial
        - swarm2.work.RecordReview
        - swarm2.work.ProposeWave
        - swarm2.work.ApproveWave
        - swarm2.work.DispatchWave
        - swarm2.work.MergeWave
        - swarm2.work.AbandonWave
