bindings:
  # ---- kernel wiring ----------------------------------------------------------------------------
  - id: adopt-activated-config
    summary: The swarm record learns which config is in force.
    when: {event: swarm2.config.ConfigActivated}
    invoke: {command: swarm2.manager.AdoptConfig}
    mapping:
      swarm_id: event.swarm_id
      config_id: event.config_id
    delivery: at_least_once
    on_failure: retry

  - id: open-run-on-start
    summary: A started swarm has a run; a started swarm with no run is a fault, not a silence.
    when: {event: swarm2.manager.SwarmStarted}
    invoke: {command: swarm2.orchestrator.OpenRun}
    mapping:
      swarm_id: event.swarm_id
      name: run
      record_dir: swarm/runs
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.orchestrator.RunOpenFailed

  - id: assignment-is-a-message
    summary: Timo, ~14:00 — "we put a message on the inbox and the swarm members read from there".
    when: {event: swarm2.agent.AssignmentPosted}
    invoke: {command: swarm2.board.PostMessage}
    mapping:
      recipient_id: event.agent_id
      inbox_name: main
      sender_id: orchestrator
      subject: event.outcome
      body: event.signoff
    delivery: at_least_once
    on_failure:
      escalate:
        emits: swarm2.agent.AssignmentUndelivered

  - id: spawn-runs-the-spawn-flow
    summary: Level 3 → 4. A spawned agent runs flows/agent.spawn.yaml.
    when: {event: swarm2.agent.AgentSpawned}
    invoke: {command: swarm2.flow.StartRun}
    mapping:
      flow_id: agent.spawn
      swarm_id: event.swarm_id
      started_by: binding
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.flow.RunNotStarted

  - id: result-reaches-the-orchestrator
    summary: WORKING-RULES §3 — results go through the board, never a pane.
    when: {event: swarm2.work.WorkItemCompleted}
    invoke: {command: swarm2.board.PostMessage}
    mapping:
      recipient_id: orchestrator
      inbox_name: main
      sender_id: event.owner_agent
      subject: event.artifact_ref
      body: event.review_ref
    delivery: at_least_once
    on_failure:
      escalate:
        emits: swarm2.work.ResultUndelivered

  # ---- schedulers -------------------------------------------------------------------------------
  # There is deliberately NO binding from MessagePosted to the wake gate. A post wakes nobody
  # (WORKING-RULES §4); the unread count is one of the gate's WAKE_SIGNAL lines, read by the Clock's
  # 60 s Evaluate (wake-gate.md). A binding here would need the five Booleans Evaluate takes, which
  # only the poll can compute — "a literal in a binding is text" made that explicit.

  - id: gate-wakes-the-agent
    summary: wake-gate.md — a wake is stamped when delivered; a window that dies before it reads has consumed it. at_most_once + escalate is that hazard, typed.
    when: {event: swarm2.schedule.GateFired}
    invoke: {command: swarm2.agent.Wake}
    mapping:
      agent_id: event.agent_id
      reason: event.reason
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.schedule.WakeLost

  - id: wake-runs-the-wake-pass
    summary: Level 3 → 4. A woken agent runs flows/agent.wake-pass.yaml.
    when: {event: swarm2.agent.AgentWoken}
    invoke: {command: swarm2.flow.StartRun}
    mapping:
      flow_id: agent.wake-pass
      swarm_id: event.swarm_id
      started_by: event.agent_id
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.flow.RunNotStarted

  - id: check-in-tick-runs-the-check-in-flow
    summary: >-
      SEED.md §1 — the */1 cron starts flows/orchestrator.check-in.yaml; the flow's last steps call
      CheckIn, Classify and Report with the counts its first steps produced. A missed tick is caught
      by the next one.
    when: {event: swarm2.schedule.CheckInTicked}
    invoke: {command: swarm2.flow.StartRun}
    mapping:
      flow_id: orchestrator.check-in
      swarm_id: event.swarm_id
      started_by: event.agent_id
    delivery: at_most_once
    on_failure: drop

  - id: memory-tick-runs-the-memory-tick-flow
    summary: >-
      CHARTER §5 — the */15 cron starts flows/orchestrator.memory-tick.yaml, whose steps compute the
      five facts MemoryTick takes and end by calling it. A missed memory tick delays a restart, so it
      is escalated, not dropped.
    when: {event: swarm2.schedule.MemoryTicked}
    invoke: {command: swarm2.flow.StartRun}
    mapping:
      flow_id: orchestrator.memory-tick
      swarm_id: event.swarm_id
      started_by: event.agent_id
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.orchestrator.TickLost

  - id: continue-is-a-post
    summary: AGENTS.md §1 step 5 — a `continue` verdict sends the next step to the agent's inbox.
    when: {event: swarm2.orchestrator.MemberContinued}
    invoke: {command: swarm2.board.PostMessage}
    mapping:
      recipient_id: event.agent_id
      inbox_name: main
      sender_id: orchestrator
      subject: next-step
      body: event.msg
    delivery: at_least_once
    on_failure: retry

  - id: parked-verdict-raises-a-decision
    summary: WORKING-RULES §9 — only the coordinator mints numbers.
    when: {event: swarm2.orchestrator.DecisionParked}
    invoke: {command: swarm2.decision.Raise}
    mapping:
      swarm_id: event.swarm_id
      kind: RealQuestion
      question: event.question
      default_on_silence: event.default_on_silence
      source_agent: event.agent_id
    delivery: at_least_once
    on_failure: retry

  - id: fault-verdict-opens-a-fault
    summary: >-
      WORKING-RULES §8 — verdict `fault`: fix it, or report it if fixing needs Timo.
    when: {event: swarm2.orchestrator.FaultDetected}
    invoke: {command: swarm2.fault.DetectFault}
    mapping:
      swarm_id: event.swarm_id
      agent_id: event.agent_id
      kind: event.kind
      detected_by: orchestrator
      msg: event.msg
    delivery: at_least_once
    on_failure: retry

  - id: agent-fault-opens-a-fault
    summary: WORKING-RULES §10 — the `fault` event-log kind.
    when: {event: swarm2.agent.FaultRaised}
    invoke: {command: swarm2.fault.DetectFault}
    mapping:
      swarm_id: event.swarm_id
      agent_id: event.agent_id
      kind: event.kind
      detected_by: event.agent_id
      msg: event.msg
    delivery: at_least_once
    on_failure: retry

  - id: escalated-fault-is-a-blocker-row
    summary: A fault that needs Timo's hands reaches him as a numbered decision (§9 "blocker").
    when: {event: swarm2.fault.FaultEscalated}
    invoke: {command: swarm2.decision.Raise}
    mapping:
      swarm_id: event.swarm_id
      kind: Blocker
      question: event.msg
      default_on_silence: leave-it
      source_agent: event.agent_id
    delivery: at_least_once
    on_failure: retry

  - id: answer-unparks-the-agent
    summary: eventlog.md — `decision_cleared --ref <n>` is the only clear.
    when: {event: swarm2.decision.DecisionAnswered}
    invoke: {command: swarm2.agent.Unpark}
    mapping:
      agent_id: event.source_agent
      decision_ref: event.number
      msg: answered
    delivery: at_least_once
    on_failure:
      escalate:
        emits: swarm2.decision.AnswerUndelivered

  - id: defer-cap-parks-the-question
    summary: CHARTER §5.7 — on the 4th tick the in-flight question becomes a numbered row.
    when: {event: swarm2.orchestrator.DeferCapReached}
    invoke: {command: swarm2.decision.Raise}
    mapping:
      swarm_id: event.swarm_id
      kind: RealQuestion
      question: in-flight-question
      default_on_silence: unchanged
      source_agent: orchestrator
    delivery: at_least_once
    on_failure: retry

  - id: retired-generation-is-reseeded
    summary: CHARTER §7 — the seed hook cannot start the first turn; a generation that never comes back is a named event.
    when: {event: swarm2.orchestrator.GenerationRetired}
    invoke: {command: swarm2.orchestrator.Seed}
    mapping:
      run_id: event.run_id
      number: event.number
      seeded_from_bytes: event.memory_bytes
      windows: event.windows
    delivery: at_most_once
    on_failure:
      escalate:
        emits: swarm2.orchestrator.SeedFailed
