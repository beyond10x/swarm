  # ---- what they build with --------------------------------------------------------------------
  - component: flow-engine
    summary: Runs flows — DAGs of command, tool, llm and subflow steps with typed ports and a context. Driven; later by metaharness.
    owns:
      domains:
        - swarm2.flow
    accepts:
      commands:
        - swarm2.flow.DraftFlow
        - swarm2.flow.PublishFlow
        - swarm2.flow.ReviseFlow
        - swarm2.flow.RetireFlow
        - swarm2.flow.StartRun
        - swarm2.flow.BeginRun
        - swarm2.flow.CompleteRun
        - swarm2.flow.CancelRun
        - swarm2.flow.EnqueueStep
        - swarm2.flow.MarkReady
        - swarm2.flow.StartStep
        - swarm2.flow.FinishStep
        - swarm2.flow.RetryStep
        - swarm2.flow.SkipStep
        - swarm2.flow.AttachChildRun
    publishes:
      events:
        - swarm2.flow.FlowDrafted
        - swarm2.flow.FlowPublished
        - swarm2.flow.FlowRevised
        - swarm2.flow.FlowRetired
        - swarm2.flow.RunStarted
        - swarm2.flow.RunRunning
        - swarm2.flow.RunSucceeded
        - swarm2.flow.RunFailed
        - swarm2.flow.RunCancelled
        - swarm2.flow.StepEnqueued
        - swarm2.flow.StepReady
        - swarm2.flow.StepWaiting
        - swarm2.flow.StepStarted
        - swarm2.flow.StepSucceeded
        - swarm2.flow.StepFailed
        - swarm2.flow.StepRetried
