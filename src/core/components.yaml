  # ---- what the first orchestrator built for itself (./swarm, 2026-09-11) -----------------------
  - component: orchestrator
    summary: One per swarm. Its run, its generations, the check-in and memory-tick cycles, the four-verdict classification. In-process with the agent it is.
    owns:
      domains:
        - swarm2.orchestrator
    accepts:
      commands:
        - swarm2.orchestrator.OpenRun
        - swarm2.orchestrator.CloseRun
        - swarm2.orchestrator.Seed
        - swarm2.orchestrator.FirstTick
        - swarm2.orchestrator.CheckIn
        - swarm2.orchestrator.Classify
