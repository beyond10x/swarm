# The subsystems (level 2) and the wiring between them.
#
# Timo, 2026-09-11: "it usually starts simple: you need to solve tool access, orchestrator needs to
# be able to create the agents and they can basically build anything anyway - we do provide inbox +
# eventbus like connections + presentation layer for the human to observe. from there on they build
# what they need and like."
#
# Four components, because a bare swarm has four jobs: hold the swarm record and its config
# (`swarm-manager`), run the agents (`agent-runtime`), carry the boxes a swarm draws and the
# connections between them (`blackbox-bus`), and hold what its agents say to each other
# (`mailbox-bus`). The 2026-09-11 draft had eight; `scheduler`, `decision-console`, `flow-engine`
# and `orchestrator` were what the first coordinator built for itself, and a swarm that starts with
# them has not started bare. They are recoverable from the import commit. `board` came back on
# 2026-09-12 as `mailbox-bus`: a coordinator that can spawn agents and cannot address them has
# built a roster it cannot use.
#
# A binding is `when: event → invoke: command`; `delivery` and `on_failure` are required words.
# A `mapping` maps one event field per input, or a literal. This is the dataflow: nothing routes an
# event except a binding declared here, and the runtime reads these rather than inventing them.
#
# One limit met at integration (2026-09-11, ess 0.23.0) and kept visible rather than worked around:
# `reached_by: command_line` requires a `cli:` block naming the binary and the command tree, so
# `agent-runtime` is `in_process` until that block is written from the real grammar.

components:
  - component: swarm-manager
    summary: Many swarms, and the runtime configuration each runs with. The one surface a person or a UI reaches across a process boundary.
    owns:
      domains:
        - swarm.manager
        - swarm.config
        - swarm.goal
    accepts:
      commands:
        - swarm.manager.CreateSwarm
        - swarm.manager.UpdateSwarm
        - swarm.manager.AdoptConfig
        - swarm.manager.StartSwarm
        - swarm.manager.PauseSwarm
        - swarm.manager.ResumeSwarm
        - swarm.manager.StopSwarm
        - swarm.manager.DeleteSwarm
        - swarm.config.DraftConfig
        - swarm.config.ActivateConfig
        - swarm.config.SupersedeConfig
        - swarm.config.DiscardConfig
        - swarm.goal.SetGoal
        - swarm.goal.Pursue
        - swarm.goal.Evaluate
        - swarm.goal.AbandonGoal
    publishes:
      events:
        - swarm.manager.SwarmCreated
        - swarm.manager.SwarmUpdated
        - swarm.manager.ConfigAdopted
        - swarm.manager.SwarmStarted
        - swarm.manager.SwarmPaused
        - swarm.manager.SwarmResumed
        - swarm.manager.SwarmStopped
        - swarm.manager.SwarmDeleted
        - swarm.config.ConfigDrafted
        - swarm.config.ConfigActivated
        - swarm.config.ConfigSuperseded
        - swarm.config.ConfigDiscarded
        - swarm.goal.GoalSet
        - swarm.goal.GoalPursued
        - swarm.goal.GoalReached
        - swarm.goal.GoalNotReached
        - swarm.goal.GoalAbandoned
    reached_by: network

  - component: agent-runtime
    summary: Agents — a role on a host with a loadout — and their assignments. At birth one agent, the coordinator; every other is one it spawned.
    owns:
      domains:
        - swarm.agent
    accepts:
      commands:
        - swarm.agent.Spawn
        - swarm.agent.Assign
        - swarm.agent.RecordAssignment
        - swarm.agent.TakeAssignment
        - swarm.agent.ReportStep
        - swarm.agent.ReportGate
        - swarm.agent.Block
        - swarm.agent.Unblock
        - swarm.agent.Park
        - swarm.agent.Unpark
        - swarm.agent.GoIdle
        - swarm.agent.Wake
        - swarm.agent.RaiseFault
        - swarm.agent.Restart
        - swarm.agent.Retire
        - swarm.agent.Note
        - swarm.agent.FinishAssignment
        - swarm.agent.ClearAssignment
    publishes:
      events:
        - swarm.agent.AgentSpawned
        - swarm.agent.AssignmentPosted
        - swarm.agent.AssignmentUndelivered
        - swarm.agent.AssignmentRecorded
        - swarm.agent.AssignmentTaken
        - swarm.agent.StepDone
        - swarm.agent.GateRed
        - swarm.agent.GateGreen
        - swarm.agent.AgentBlocked
        - swarm.agent.AgentUnblocked
        - swarm.agent.DecisionParked
        - swarm.agent.DecisionCleared
        - swarm.agent.AgentIdle
        - swarm.agent.AgentWoken
        - swarm.agent.FaultRaised
        - swarm.agent.AgentRestarted
        - swarm.agent.AgentRetired
        - swarm.agent.AssignmentDone
        - swarm.agent.AssignmentCleared
        - swarm.agent.NoteEmitted
    reached_by: in_process

  - component: blackbox-bus
    summary: What a swarm draws for itself — boxes with typed ports, the schemas they speak, and the connections between them. A tool, an MCP server, a UI panel, a loop and a goal are all boxes.
    owns:
      domains:
        - swarm.blackbox
    accepts:
      commands:
        - swarm.blackbox.DraftSchema
        - swarm.blackbox.PublishSchema
        - swarm.blackbox.DeprecateSchema
        - swarm.blackbox.DraftBox
        - swarm.blackbox.MoveBox
        - swarm.blackbox.RedefinePorts
        - swarm.blackbox.PublishBox
        - swarm.blackbox.ReviseBox
        - swarm.blackbox.RetireBox
        - swarm.blackbox.Connect
        - swarm.blackbox.ActivateConnection
        - swarm.blackbox.BreakConnection
        - swarm.blackbox.RepairConnection
        - swarm.blackbox.Disconnect
    publishes:
      events:
        - swarm.blackbox.SchemaDrafted
        - swarm.blackbox.SchemaPublished
        - swarm.blackbox.SchemaDeprecated
        - swarm.blackbox.BoxDrafted
        - swarm.blackbox.BoxMoved
        - swarm.blackbox.PortsRedefined
        - swarm.blackbox.BoxPublished
        - swarm.blackbox.BoxRevised
        - swarm.blackbox.BoxRetired
        - swarm.blackbox.ConnectionProposed
        - swarm.blackbox.ConnectionLive
        - swarm.blackbox.ConnectionBroken
        - swarm.blackbox.ConnectionRepaired
        - swarm.blackbox.ConnectionRemoved
    reached_by: network

  - component: mailbox-bus
    summary: Named mailboxes per agent and the messages in them. What one agent says to another, and what a person says to a running swarm.
    owns:
      domains:
        - swarm.mailbox
    accepts:
      commands:
        - swarm.mailbox.OpenMailbox
        - swarm.mailbox.CloseMailbox
        - swarm.mailbox.PostMessage
        - swarm.mailbox.MarkRead
        - swarm.mailbox.AckMessage
    publishes:
      events:
        - swarm.mailbox.MailboxOpened
        - swarm.mailbox.MailboxClosed
        - swarm.mailbox.MessagePosted
        - swarm.mailbox.MessageRead
        - swarm.mailbox.MessageAcked
    reached_by: network

bindings:
  - id: adopt-activated-config
    summary: The swarm record learns which config is in force.
    when: {event: swarm.config.ConfigActivated}
    invoke: {command: swarm.manager.AdoptConfig}
    mapping:
      swarm_id: event.swarm_id
      config_id: event.config_id
    delivery: at_least_once
    on_failure: retry

  # The [loop] of the birth graph, declared rather than hand-built.
  #
  # ess/1 0.23.0 carries a periodic cause, so the tick is part of the specification and not a timer
  # buried in the runtime: the cadence, the overlap bound and the missed-tick policy are reviewable
  # here, beside everything else the system promises. Each profile word admits exactly one value, so
  # the only real choice in this block is `every`.
  #
  # `serial_per_instance` is the one that matters. It says one turn of one goal at a time, which is
  # the property that keeps a slow coordinator from being asked to pursue the same goal twice, and
  # it is a rule worth having stated rather than reimplemented. `one_pending_drop_excess`: a tick
  # missed while a turn was running is taken once when it finishes, not banked and replayed.
  #
  # The host supplies which goal to turn and how many turns it has had. That is the runtime reading
  # `swarm.goal.GoalsAwaitingATick` — goals resting in Evaluating, which is where a turn that ended
  # "not yet" leaves them — and `eligibility: host_boolean` is where a paused or stopped swarm is
  # excluded, because whether a swarm is running is not a fact this binding can read.
  - id: turn-the-loop
    summary: A goal waiting for a turn gets one.
    when:
      periodic:
        every: PT30S
        anchor: host_activation
        first: after_period
        cadence: fixed_rate
        overlap: serial_per_instance
        missed: one_pending_drop_excess
        lifetime: host_instance
        cancellation: stop_acknowledged
        host:
          owner: swarm-manager
          authority: turn-the-loop
          eligibility: host_boolean
          context_fields:
            - name: goal_id
              type: Uuid
          read_fields:
            - name: iterations
              type: Integer
    invoke: {command: swarm.goal.Pursue}
    mapping:
      goal_id: host_context.goal_id
      iterations: host_read.iterations
    delivery: at_most_once
    on_failure: drop
