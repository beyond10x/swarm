        - swarm2.agent.AgentUnblocked
        - swarm2.agent.DecisionParked
        - swarm2.agent.DecisionCleared
        - swarm2.agent.AgentIdle
        - swarm2.agent.AgentWoken
        - swarm2.agent.FaultRaised
        - swarm2.agent.AgentRestarted
        - swarm2.agent.AgentRetired
        - swarm2.agent.NoteEmitted
        - swarm2.agent.AssignmentDone
        - swarm2.agent.AssignmentCleared
        - swarm2.work.WorkItemOpened
        - swarm2.work.IntakeDone
        - swarm2.work.Specified
        - swarm2.work.WorkDeclined
