  - component: blackbox-bus
    summary: The eventbus-like connections. Boxes with only inputs and outputs, schemas known to everyone, connections other agents make between them — the canvas.
    owns:
      domains:
        - swarm2.blackbox
    accepts:
      commands:
        - swarm2.blackbox.DraftSchema
