# swarm — a swarm manager, specified.
#
# A Swarm starts bare: one coordinator, no data, and a goal. What it becomes, it builds. The kernel
# is only what a swarm cannot build for itself — the swarm record, the agent that runs, how that
# agent is launched, what it may reach, and the goal it is pursuing.
#
# Everything an agent then makes for itself — its inbox, its schedules, its work items, its
# incidents, its decisions ledger, the DAG flows it runs — is a Box it draws and connects, not a
# domain declared here. Those domains existed in the 2026-09-11 draft, which was reverse-engineered
# from a 16-agent run; they were removed on 2026-09-11 because a swarm that starts with them has
# not started bare. They are recoverable from the import commit.
#
# Levels: the MANAGER holds many Swarms. A Swarm has one Coordinator and, later, the agents the
# coordinator spawns. What anything may reach is a Connection between Boxes. Specification only.
format: ess/1
system: swarm
version: v1

summary: >-
  A swarm manager: many swarms, each one coordinator pursuing one goal, with the boxes the swarm
  draws for itself and the connections between them. A swarm is born with three nodes — a loop, a
  coordinator and a goal — and the loop turns until the goal is reached.

domains:
  - swarm.manager
  - swarm.config
  - swarm.agent
  - swarm.blackbox
