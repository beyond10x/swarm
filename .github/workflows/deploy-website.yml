# Builds the Docusaurus site in `website/` and publishes it to GitHub Pages.
#
# Every action is pinned to an exact commit and every job declares its permissions, because the
# Gates check (`shared-gates.yml`) rejects a workflow that does neither. The trailing comment names
# the release each commit belongs to; the commit is what is enforced.
#
# Pages is configured with `Source: GitHub Actions` in the repository settings, not the legacy
# `gh-pages` branch, so nothing here pushes to a branch. `website/static/.nojekyll` keeps Pages from
# running Jekyll over the output.
name: Deploy the website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/core/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# The site's counts are read out of `src/core` at build time, which is why a change there triggers
# this too: the specification moving is the thing that made the old page's numbers wrong.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
