[workspace]
resolver = "3"
members = ["src/runtime/ess-runtime", "src/runtime/swarm-cli", "src/runtime/swarm-server", "src/runtime/swarm-check"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
# The specification compiler, linked as a library rather than shelled out to. The IR is
# `Serialize`-only and carries no format version, so it is never read back from JSON: the runtime
# compiles the spec at boot and holds the typed IR.
#
# Pinned by tag, not by path. The sibling checkout at ../../ess is on 0.22.2 with uncommitted work
# in it, and the `ess` on PATH is 0.23.0 — a path dependency would compile neither of the two things
# we mean.
ess-compiler = { git = "https://github.com/beyond10x/ess", tag = "0.23.0" }
ess-primitives = { git = "https://github.com/beyond10x/ess", tag = "0.23.0" }
ess-domain = { git = "https://github.com/beyond10x/ess", tag = "0.23.0" }

# The event store. Pinned by tag for the same reason ess is: the sibling checkout at ../../eventlog
# is on 0.2.0 and two commits behind its origin, and 0.2.1 is the release that corrected the README
# the earlier research was read from.
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.2.1" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog", tag = "0.2.1" }

serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net", "fs"] }
time = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ess-runtime = { path = "src/runtime/ess-runtime" }
# The agent's own CLI. `ureq` rather than reqwest: a command that makes one blocking request wants
# no runtime, and this binary is spawned once per invocation inside a hermetic Claude Code run.
ureq = { version = "3", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
